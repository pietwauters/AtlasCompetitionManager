<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — DE Phase</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notice-bar{padding:.6rem 1rem;border-radius:5px;margin-bottom:1rem;font-size:.9rem}
    .notice-ok{background:#d5f5e3;color:#1e5631}
    .notice-err{background:#fde8e8;color:#922b21}
    .badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:10px;font-weight:600}
    .badge-pending{background:#fef3cd;color:#856404}
    .badge-active{background:#d4edda;color:#155724}
    .badge-finished{background:#d6d8db;color:#383d41}

    /* ── Bracket ── */
    .bracket-wrap{overflow-x:auto;padding-bottom:.5rem}
    .bracket{display:flex;gap:0;align-items:stretch;min-width:max-content}

    .round-col{display:flex;flex-direction:column;justify-content:space-around;width:220px;flex-shrink:0}
    .round-col h3{text-align:center;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#666;margin:0 0 .5rem;padding:.5rem 0;border-bottom:1px solid #e5e5e5}

    .bout-slot{flex:1;display:flex;align-items:center;padding:.25rem .5rem}
    .bout-card{width:100%;background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;font-size:.82rem;cursor:pointer;transition:box-shadow .15s;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .bout-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .bout-card.selected{border-color:#1a6bab;box-shadow:0 0 0 2px #1a6bab44}
    .bout-card.finished{border-left:3px solid #1a6bab}
    .bout-card.bye{border-left:3px solid #ccc;opacity:.7;cursor:default}
    .bout-card.empty{background:#f8f8f8;border-style:dashed;cursor:default}

    .bout-row{display:flex;align-items:center;padding:.3rem .5rem;gap:.3rem;min-height:28px}
    .bout-row+.bout-row{border-top:1px solid #f0f0f0}
    .bout-row.winner{background:#eaf6ee;font-weight:600}
    .bout-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bout-score{font-family:monospace;font-weight:700;font-size:.9rem;min-width:1.5rem;text-align:center;color:#1a6bab}
    .bye-label{color:#aaa;font-style:italic;font-size:.78rem;padding:.3rem .5rem}
    .place-label{font-size:.72rem;color:#999;padding:.2rem .5rem 0;text-align:right}

    /* ── Score modal ── */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
    .modal-box{background:#fff;border-radius:10px;padding:1.5rem;min-width:320px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.25)}
    .modal-title{margin:0 0 1rem;font-size:1rem;font-weight:700;line-height:1.3}
    .score-inputs{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;margin-bottom:.75rem;justify-content:center}
    .score-block{display:flex;flex-direction:column;align-items:center;gap:.3rem}
    .score-block label{font-size:.82rem;color:#555;font-weight:600;text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score-input{width:4rem;text-align:center;font-size:1.6rem;font-weight:700;padding:.3rem;border:2px solid #ccc;border-radius:6px}
    .score-input:focus{border-color:#1a6bab;outline:none}
    .vs-sep{font-size:1.3rem;color:#aaa;padding-top:1.4rem}

    .medal-gold{color:#c9a000;font-weight:700}
    .medal-silver{color:#777;font-weight:700}
    .medal-bronze{color:#b87333;font-weight:700}

    .group-header{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:#666;
                  margin:1.25rem 0 .5rem;padding:.5rem 0;border-bottom:1px solid #e5e5e5}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <span x-show="comp" style="color:#aad4f5;font-size:.9rem" x-text="'/ '+comp?.name"></span>
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <!-- Phase header -->
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="'Direct Elimination — '+(phase?.rule_doc||'').replace('.json','')"></h2>
      <span class="badge" :class="'badge-'+(phase?.status||'')" x-text="phase?.status"></span>
      <a :href="'/competition-detail.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#888">← Back to competition</a>
      <a :href="'/results.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#1a6bab">📋 Results</a>
    </div>
    <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button x-show="phase?.status==='pending'" class="primary" @click="activate()">▶ Activate phase</button>
      <template x-if="phase?.status==='active'">
        <span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <span style="font-size:.85rem;color:#666" x-text="progressLabel()"></span>
          <button @click="simulate()" style="background:#f5f0ff;color:#6b21a8;border-color:#d8b4fe">🎲 Simulate</button>
        </span>
      </template>
    </div>
  </div>

  <!-- Main bracket + placement groups -->
  <div class="card" x-show="rounds.length">
    <h2 style="margin-top:0">Tableau
      <span style="font-weight:400;font-size:.82rem;color:#888" x-text="'('+tableauSize+'-person tableau)'"></span>
    </h2>

    <!-- Main bracket -->
    <div class="bracket-wrap">
      <div class="bracket">
        <template x-for="(round, ri) in rounds" :key="ri">
          <div class="round-col">
            <h3 x-text="roundLabel(ri, rounds.length)"></h3>
            <div style="padding:.15rem .5rem .4rem;text-align:center">
              <select x-model="roundStrip[ri]" @change="assignStrip(ri)"
                      style="width:100%;font-size:.74rem;padding:.2rem .3rem;border:1px solid #ddd;border-radius:4px;background:#f8f9fa;color:#555">
                <option value="">— no piste —</option>
                <template x-for="s in strips" :key="s.id">
                  <option :value="String(s.id)" x-text="s.name || ('Piste ' + s.strip_number)"></option>
                </template>
              </select>
            </div>
            <template x-for="bout in round" :key="bout.id">
              <div class="bout-slot">
                <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                  <template x-if="isBye(bout)">
                    <div>
                      <div class="bout-row">
                        <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                      </div>
                      <div class="bye-label">bye</div>
                    </div>
                  </template>
                  <template x-if="isEmpty(bout)">
                    <div>
                      <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                      <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                    </div>
                  </template>
                  <template x-if="!isBye(bout) && !isEmpty(bout)">
                    <div>
                      <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                        <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                        <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                      </div>
                      <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                        <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                        <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Repechage tables (D, E, F, G) — repechage phases only -->
    <template x-if="isRepechage && repechageRounds.length">
      <div>
        <h3 class="group-header">Repechage</h3>
        <div class="bracket-wrap">
          <div class="bracket">
            <template x-for="(round, ri) in repechageRounds" :key="ri">
              <div class="round-col">
                <h3 x-text="repechageRoundLabel(ri)"></h3>
                <template x-for="bout in round" :key="bout.id">
                  <div class="bout-slot">
                    <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                      <template x-if="isBye(bout)">
                        <div>
                          <div class="bout-row">
                            <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                          </div>
                          <div class="bye-label">bye</div>
                        </div>
                      </template>
                      <template x-if="isEmpty(bout)">
                        <div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                        </div>
                      </template>
                      <template x-if="!isBye(bout) && !isEmpty(bout)">
                        <div>
                          <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                            <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                          </div>
                          <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                            <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- Finals bracket (H, I, J) — repechage phases only -->
    <template x-if="isRepechage && finalsRounds.length">
      <div>
        <h3 class="group-header">Finals</h3>
        <div class="bracket-wrap">
          <div class="bracket">
            <template x-for="(round, fi) in finalsRounds" :key="fi">
              <div class="round-col">
                <h3 x-text="finalsRoundLabel(fi, finalsRounds.length)"></h3>
                <template x-for="bout in round" :key="bout.id">
                  <div class="bout-slot">
                    <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                      <template x-if="isBye(bout)">
                        <div>
                          <div class="bout-row">
                            <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                          </div>
                          <div class="bye-label">bye</div>
                        </div>
                      </template>
                      <template x-if="isEmpty(bout)">
                        <div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                        </div>
                      </template>
                      <template x-if="!isBye(bout) && !isEmpty(bout)">
                        <div>
                          <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                            <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                          </div>
                          <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                            <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- Placement groups (bronze, 5th-8th, 9th-16th, …) -->
    <template x-for="(group, gi) in placementGroups" :key="gi">
      <div>
        <h3 class="group-header" x-text="placementGroupLabel(group)"></h3>
        <div class="bracket-wrap">
          <div class="bracket">
            <template x-for="(col, ci) in group.columns" :key="ci">
              <div class="round-col">
                <h3 x-text="placementColLabel(group, ci)"></h3>
                <div style="padding:.15rem .5rem .4rem;text-align:center">
                  <select
                    :value="placementStrip[gi] && placementStrip[gi][ci] || ''"
                    @change="placementStrip[gi] = placementStrip[gi] || []; placementStrip[gi][ci] = $event.target.value; assignPlacementStrip(gi, ci)"
                    style="width:100%;font-size:.74rem;padding:.2rem .3rem;border:1px solid #ddd;border-radius:4px;background:#f8f9fa;color:#555">
                    <option value="">— no piste —</option>
                    <template x-for="s in strips" :key="s.id">
                      <option :value="String(s.id)" x-text="s.name || ('Piste ' + s.strip_number)"></option>
                    </template>
                  </select>
                </div>
                <template x-for="bout in col" :key="bout.id">
                  <div class="bout-slot">
                    <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                      <template x-if="isBye(bout)">
                        <div>
                          <div class="bout-row">
                            <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                          </div>
                          <div class="bye-label">bye</div>
                        </div>
                      </template>
                      <template x-if="isEmpty(bout)">
                        <div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                        </div>
                      </template>
                      <template x-if="!isBye(bout) && !isEmpty(bout)">
                        <div>
                          <div x-show="bout.place_rank" class="place-label"
                               x-text="ord(bout.place_rank)+'–'+ord(bout.place_rank+1)+' place'"></div>
                          <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                            <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                          </div>
                          <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                            <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

  </div>

  <!-- Score modal -->
  <div class="modal-backdrop" x-show="selected && !isBye(selected) && !isEmpty(selected)"
       @click.self="selected=null" @keydown.escape.window="selected=null">
    <div class="modal-box">
      <p class="modal-title" x-text="scorePanelTitle()"></p>

      <template x-if="phase?.status==='active'">
        <div>
          <div class="score-inputs">
            <div class="score-block">
              <label x-text="boutName(selected,'left')||'Left'"></label>
              <input class="score-input" type="number" min="0" max="99" x-model.number="scoreLeft"
                     x-ref="scoreLeftInput" @keydown.enter="saveScore()">
            </div>
            <span class="vs-sep">vs</span>
            <div class="score-block">
              <label x-text="boutName(selected,'right')||'Right'"></label>
              <input class="score-input" type="number" min="0" max="99" x-model.number="scoreRight"
                     @keydown.enter="saveScore()">
            </div>
          </div>
          <div x-show="selected && scoreLeft===scoreRight && scoreLeft!=='' && scoreLeft!==null"
               style="margin-bottom:.75rem;font-size:.85rem;text-align:center">
            Tie — winner:
            <button :class="tieWinner===selected?.left_id?'primary':''" @click="tieWinner=selected?.left_id" x-text="boutName(selected,'left')"></button>
            <button :class="tieWinner===selected?.right_id?'primary':''" @click="tieWinner=selected?.right_id" x-text="boutName(selected,'right')"></button>
          </div>
          <div style="display:flex;gap:.5rem;justify-content:center">
            <button class="success" @click="saveScore()"
                    :disabled="scoreLeft===''||scoreLeft===null||scoreRight===''||scoreRight===null">Save score</button>
            <button @click="undoScore()" x-show="selected?.status==='finished'">↩ Undo</button>
            <button @click="selected=null">Cancel</button>
          </div>
        </div>
      </template>

      <template x-if="phase?.status!=='active'">
        <div style="color:#888;font-size:.85rem;text-align:center">
          <p>Activate the phase to score bouts.</p>
          <button @click="selected=null">Close</button>
        </div>
      </template>
    </div>
  </div>

  <!-- Final results -->
  <div class="card" x-show="finalResults">
    <h2 style="margin-top:0">Results</h2>
    <table style="width:100%;border-collapse:collapse;font-size:.9rem">
      <thead><tr>
        <th style="text-align:left;padding:.4rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd">Place</th>
        <th style="text-align:left;padding:.4rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd">Name</th>
      </tr></thead>
      <tbody>
        <template x-for="r in finalResults" :key="r.id">
          <tr>
            <td style="padding:.4rem .75rem;border-bottom:1px solid #eee;font-weight:700;color:#1a6bab">
              <span :class="r.medalClass" x-text="r.place"></span>
            </td>
            <td style="padding:.4rem .75rem;border-bottom:1px solid #eee"
                x-text="'('+r.seed+') '+r.name"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>

<script src="/js/nav.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function buildSeedPositions(T) {
  let slots = [1, 2], cur = 2;
  while (cur < T) {
    cur *= 2;
    const next = [];
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (i % 2 === 0) next.push(s, cur + 1 - s);
      else             next.push(cur + 1 - s, s);
    }
    slots = next;
  }
  return slots;
}

function app() {
  const phaseId = new URLSearchParams(window.location.search).get('id');
  return {
    phaseId, phase: null, comp: null,
    rounds: [],            // main bracket rounds (R1..lastMainRound for repechage, or full bracket)
    repechageRounds: [],   // repechage tables D/E/F/G: [[bout,…],…]
    finalsRounds: [],      // finals H/I/J (repechage only): [[bout,…],…]
    isRepechage: false,
    lastMainRound: 0,
    placementGroups: [],   // [{ startPlace, endPlace, columns: [[bout,…],…] }]
    tableauSize: 0,
    nameMap: {},           // competitor_id → display name
    seedMap: {},           // competitor_id → seed number
    strips: [],
    deSlots: [],
    roundStrip: [],
    placementStrip: [],  // placementStrip[gi][ci] = strip_id string
    selected: null,
    scoreLeft: '', scoreRight: '', tieWinner: null,
    notice: { text: '', error: false },
    finalResults: null,

    async init() {
      if (!phaseId) { this.showNotice('No phase ID', true); return; }
      await this.load();
      const es = new EventSource('/api/phases/' + phaseId + '/events');
      window.addEventListener('beforeunload', () => es.close());
      es.addEventListener('bout-updated', e => {
        const updated = JSON.parse(e.data);
        const upd = r => r.map(b => b.id === updated.id ? { ...b, ...updated } : b);
        this.rounds          = this.rounds.map(upd);
        this.repechageRounds = this.repechageRounds.map(upd);
        this.finalsRounds    = this.finalsRounds.map(upd);
        this.placementGroups = this.placementGroups.map(g => ({
          ...g,
          columns: g.columns.map(col => upd(col)),
        }));
        if (this.selected?.id === updated.id) this.selected = { ...this.selected, ...updated };
        this.computeFinalResults();
      });
    },

    async load() {
      this.phase = await fetch('/api/phases/' + phaseId).then(r => r.json());
      if (this.phase.competition_id) {
        this.comp = await fetch('/api/competitions/' + this.phase.competition_id).then(r => r.json());
      }
      this.strips = await fetch('/api/strips').then(r => r.json());
      document.title = 'Atlas — DE — ' + (this.comp?.name || '');
      await this.loadBouts();
    },

    async loadBouts() {
      const bouts = await fetch('/api/bouts?phase_id=' + phaseId).then(r => r.json());

      // Build name map from all bouts
      this.nameMap = {};
      for (const b of bouts) {
        if (b.left_id)  this.nameMap[b.left_id]  = b.left_last  + ', ' + b.left_first;
        if (b.right_id) this.nameMap[b.right_id] = b.right_last + ', ' + b.right_first;
      }

      // ── Main bracket ────────────────────────────────────────────────────────
      const mainBouts = bouts.filter(b => b.bracket === 'main' || !b.bracket);
      const byRound = {};
      let maxRound = 0;
      for (const b of mainBouts) {
        if (!b.de_round) continue;
        (byRound[b.de_round] = byRound[b.de_round] || []).push(b);
        if (b.de_round > maxRound) maxRound = b.de_round;
      }

      const r1 = byRound[1] || [];
      const T  = r1.length * 2;
      this.tableauSize = T || 0;
      if (T >= 2) {
        const seedSlots = buildSeedPositions(T);
        this.seedMap = {};
        for (const b of r1) {
          const p = b.tableau_position;
          if (b.left_id)  this.seedMap[b.left_id]  = seedSlots[2 * (p - 1)];
          if (b.right_id) this.seedMap[b.right_id] = seedSlots[2 * (p - 1) + 1];
        }
      }

      // ── Repechage split ──────────────────────────────────────────────────────
      const repBoutsAll = bouts.filter(b => b.bracket === 'repechage');
      this.isRepechage = repBoutsAll.length > 0;

      if (this.isRepechage) {
        const maxRepRound = repBoutsAll.reduce((m, b) => Math.max(m, b.de_round || 0), 0);
        // numRepRounds = maxRepRound / 2 (D=1 intra, E=2 inj, F=3 intra, G=4 inj → 4/2=2)
        this.lastMainRound  = maxRepRound / 2 + 1;
        const finalsStart   = this.lastMainRound + 1;

        this.rounds = [];
        for (let r = 1; r <= this.lastMainRound; r++) {
          this.rounds.push((byRound[r] || []).sort((a, b) => a.tableau_position - b.tableau_position));
        }

        const repByRound = {};
        for (const b of repBoutsAll) {
          (repByRound[b.de_round] = repByRound[b.de_round] || []).push(b);
        }
        this.repechageRounds = [];
        for (let r = 1; r <= maxRepRound; r++) {
          this.repechageRounds.push((repByRound[r] || []).sort((a, b) => a.tableau_position - b.tableau_position));
        }

        this.finalsRounds = [];
        for (let r = finalsStart; r <= maxRound; r++) {
          this.finalsRounds.push((byRound[r] || []).sort((a, b) => a.tableau_position - b.tableau_position));
        }
      } else {
        this.lastMainRound  = 0;
        this.repechageRounds = [];
        this.finalsRounds    = [];
        this.rounds = [];
        for (let r = 1; r <= maxRound; r++) {
          this.rounds.push((byRound[r] || []).sort((a, b) => a.tableau_position - b.tableau_position));
        }
      }

      if (this.selected) {
        this.selected = bouts.find(b => b.id === this.selected.id) || null;
      }

      // ── Placement groups ─────────────────────────────────────────────────────
      this.placementGroups = this._buildPlacementGroups(bouts);

      this.computeFinalResults();
      await this.loadDeSlots();
    },

    // Organise placement bouts into sorted groups, each with ordered columns.
    // Uses routing pointers (migration 014+) for level assignment; falls back
    // gracefully for pre-014 phases where pointers are null.
    _buildPlacementGroups(bouts) {
      const placementBouts = bouts.filter(b => b.bracket === 'placement');
      if (!placementBouts.length) return [];

      const pMap = new Map(placementBouts.map(b => [b.id, b]));

      // Reverse adjacency: which placement bouts point into each bout?
      const inbound = new Map();
      for (const b of placementBouts) inbound.set(b.id, []);
      for (const b of placementBouts) {
        for (const nid of [b.winner_next_bout_id, b.loser_next_bout_id]) {
          if (nid && inbound.has(nid)) inbound.get(nid).push(b.id);
        }
      }

      // BFS from root bouts (no placement-bout parents) to assign levels
      const levels = new Map();
      const queue = [];
      for (const b of placementBouts) {
        if (inbound.get(b.id).length === 0) { levels.set(b.id, 0); queue.push(b.id); }
      }
      let qi = 0;
      while (qi < queue.length) {
        const id = queue[qi++];
        const b  = pMap.get(id);
        const lv = levels.get(id);
        for (const nid of [b.winner_next_bout_id, b.loser_next_bout_id]) {
          if (nid && pMap.has(nid) && !levels.has(nid)) {
            levels.set(nid, lv + 1);
            queue.push(nid);
          }
        }
      }

      // Connected components (DFS, both directions)
      const visited = new Set();
      const components = [];
      for (const b of placementBouts) {
        if (visited.has(b.id)) continue;
        const comp = [];
        const stack = [b.id];
        while (stack.length) {
          const id = stack.pop();
          if (visited.has(id)) continue;
          visited.add(id); comp.push(id);
          const bout = pMap.get(id);
          const neighbours = [
            ...inbound.get(id),
            ...[bout.winner_next_bout_id, bout.loser_next_bout_id].filter(n => n && pMap.has(n)),
          ];
          for (const nid of neighbours) if (!visited.has(nid)) stack.push(nid);
        }
        components.push(comp);
      }

      return components.map(comp => {
        const maxLevel = Math.max(...comp.map(id => levels.get(id) ?? 0));
        const columns = [];
        for (let lv = 0; lv <= maxLevel; lv++) {
          columns.push(
            comp.filter(id => (levels.get(id) ?? 0) === lv)
                .map(id => pMap.get(id))
                .sort((a, b) => (a.bout_order || 0) - (b.bout_order || 0))
          );
        }

        const terminals = comp.filter(id => pMap.get(id).place_rank != null);
        let startPlace, endPlace;
        if (terminals.length) {
          startPlace = Math.min(...terminals.map(id => pMap.get(id).place_rank));
          endPlace   = Math.max(...terminals.map(id => pMap.get(id).place_rank)) + 1;
        } else {
          // Pre-014 phase: detect bronze by tableau_position and patch a virtual
          // place_rank so computeFinalResults can find this bout as a terminal.
          const bronzeId = comp.find(id => pMap.get(id).tableau_position === 2);
          if (bronzeId) {
            pMap.get(bronzeId).place_rank = 3;
            startPlace = 3; endPlace = 4;
          } else {
            startPlace = 1; endPlace = 2;
          }
        }
        return { startPlace, endPlace, columns };
      }).sort((a, b) => a.startPlace - b.startPlace);
    },

    async loadDeSlots() {
      this.deSlots = await fetch('/api/opp2/pipeline/phase/' + phaseId).then(r => r.json());
      this.roundStrip = this.rounds.map((_, ri) => {
        const tableau = this.tableauSize >> ri;
        const slot = this.deSlots.find(s => (s.bracket === 'main' || s.bracket == null) && s.tableau === tableau);
        return slot ? String(slot.strip_id) : '';
      });
      this.placementStrip = this.placementGroups.map((group, gi) =>
        group.columns.map((_, ci) => {
          const slot = this.deSlots.find(s =>
            s.bracket === 'placement' &&
            s.tableau === group.startPlace &&
            s.partition === String(ci)
          );
          return slot ? String(slot.strip_id) : '';
        })
      );
    },

    async assignStrip(ri) {
      const stripId = this.roundStrip[ri];
      const tableau = this.tableauSize >> ri;
      if (stripId) {
        await fetch('/api/opp2/pipeline/strip/' + stripId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'de', phase_id: Number(phaseId),
                                 bracket: 'main', tableau, partition: 'full' }),
        });
      } else {
        const existing = this.deSlots.find(s => (s.bracket === 'main' || s.bracket == null) && s.tableau === tableau);
        if (existing) await fetch('/api/opp2/pipeline/slots/' + existing.id, { method: 'DELETE' });
      }
      await this.loadDeSlots();
    },

    async assignPlacementStrip(gi, ci) {
      const group   = this.placementGroups[gi];
      const stripId = this.placementStrip[gi]?.[ci];
      const tableau = group.startPlace;
      const partition = String(ci);
      if (stripId) {
        await fetch('/api/opp2/pipeline/strip/' + stripId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'de', phase_id: Number(phaseId),
                                 bracket: 'placement', tableau, partition }),
        });
      } else {
        const existing = this.deSlots.find(s =>
          s.bracket === 'placement' && s.tableau === tableau && s.partition === partition
        );
        if (existing) await fetch('/api/opp2/pipeline/slots/' + existing.id, { method: 'DELETE' });
      }
      await this.loadDeSlots();
    },

    computeFinalResults() {
      if (this.isRepechage) {
        // Repechage result summary: find the finals bracket final
        const allFinals = this.finalsRounds;
        if (!allFinals.length) { this.finalResults = null; return; }
        const finalBout = allFinals[allFinals.length - 1]?.find(b => b.tableau_position === 1);
        if (!finalBout?.winner_id) { this.finalResults = null; return; }

        const results = [];
        const placed  = new Set();
        const add = (label, id, medalClass) => {
          if (!id || placed.has(id)) return;
          const name = this.nameMap[id] || ('Competitor #' + id);
          results.push({ id, place: label, seed: this.seedMap[id] || '?', name, medalClass });
          placed.add(id);
        };

        add('🥇 1', finalBout.winner_id, 'medal-gold');
        const silver = finalBout.winner_id === finalBout.left_id ? finalBout.right_id : finalBout.left_id;
        add('🥈 2', silver, 'medal-silver');

        // Bronze from placement
        const bronze = this.placementGroups.flatMap(g => g.columns.flat())
          .find(b => b.place_rank === 3 && b.status === 'finished' && b.winner_id);
        if (bronze) {
          add('🥉 3', bronze.winner_id, 'medal-bronze');
          const bl = bronze.winner_id === bronze.left_id ? bronze.right_id : bronze.left_id;
          add('4', bl, '');
        }

        // Finals QF losers (5th-8th if reT=8)
        if (allFinals.length >= 2) {
          const qf = allFinals[allFinals.length - 3]; // H round for T8 finals
          if (qf) {
            const losers = qf.filter(b => b.status === 'finished' && b.winner_id && b.left_id && b.right_id)
              .map(b => b.winner_id === b.left_id ? b.right_id : b.left_id).filter(id => !placed.has(id));
            losers.forEach((id, i) => add(String(5 + i), id, ''));
          }
        }

        this.finalResults = results.length > 2 ? results : null;
        return;
      }

      const totalRounds = this.rounds.length;
      if (!totalRounds) { this.finalResults = null; return; }
      const finalBout = this.rounds[totalRounds - 1]?.find(b => b.tableau_position === 1);
      if (!finalBout?.winner_id) { this.finalResults = null; return; }

      const results  = [];
      const placed   = new Set();
      const add = (place, label, id, medalClass) => {
        if (!id || placed.has(id)) return;
        const name = this.nameMap[id] || ('Competitor #' + id);
        results.push({ id, place: label, seed: this.seedMap[id] || '?', name, medalClass });
        placed.add(id);
      };

      add(1, '🥇 1', finalBout.winner_id, 'medal-gold');
      add(2, '🥈 2', finalBout.winner_id === finalBout.left_id ? finalBout.right_id : finalBout.left_id, 'medal-silver');

      // Terminal placement bouts in place order
      const terminals = this.placementGroups
        .flatMap(g => g.columns.flat())
        .filter(b => b.place_rank != null && b.status === 'finished' && b.winner_id)
        .sort((a, b) => a.place_rank - b.place_rank);

      for (const tb of terminals) {
        const loser = tb.winner_id === tb.left_id ? tb.right_id : tb.left_id;
        const mc    = tb.place_rank === 3 ? 'medal-bronze' : '';
        add(tb.place_rank,     (tb.place_rank === 3 ? '🥉 ' : '') + tb.place_rank, tb.winner_id, mc);
        add(tb.place_rank + 1, String(tb.place_rank + 1), loser, '');
      }

      // Remaining round losers not placed by a terminal bout
      for (let r = totalRounds - 1; r >= 1; r--) {
        const roundStartPlace = 2 ** (totalRounds - r) + 1;
        const losers = (this.rounds[r - 1] || [])
          .filter(b => b.status === 'finished' && b.winner_id && b.left_id && b.right_id)
          .map(b => b.winner_id === b.left_id ? b.right_id : b.left_id)
          .filter(id => !placed.has(id))
          .map(id => ({ id, seed: this.seedMap[id] || 999 }))
          .sort((a, b) => a.seed - b.seed);
        losers.forEach((l, i) => add(roundStartPlace + i, String(roundStartPlace + i), l.id, ''));
      }

      this.finalResults = results.length > 2 ? results : null;
    },

    ord(n) {
      if (!n) return '';
      const s = ['th','st','nd','rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    },

    placementGroupLabel(g) {
      if (g.startPlace === 3 && g.endPlace === 4) return 'Bronze bout — 3rd–4th place';
      return this.ord(g.startPlace) + '–' + this.ord(g.endPlace) + ' place';
    },

    placementColLabel(g, ci) {
      const total = g.columns.length;
      if (ci === total - 1) return total === 1 ? 'Place bout' : 'Place bouts';
      return 'Round ' + (ci + 1);
    },

    roundLabel(ri, total) {
      if (this.isRepechage) return 'Round of ' + (this.rounds[ri]?.length * 2);
      const n = total - ri;
      if (n === 1) return 'Final';
      if (n === 2) return 'Semi-final';
      if (n === 3) return 'Quarter-final';
      return 'Round of ' + (this.rounds[ri]?.length * 2);
    },

    // repechageRoundLabel: de_round 1=D, 2=E, 3=F, 4=G (0-based index ri)
    repechageRoundLabel(ri) {
      const labels = ['Table D', 'Table E', 'Table F', 'Table G', 'Table H', 'Table I', 'Table J'];
      return labels[ri] || ('Repechage round ' + (ri + 1));
    },

    // finalsRoundLabel: fr is 0-based index within finalsRounds
    finalsRoundLabel(fi, total) {
      const n = total - fi;
      if (n === 1) return 'Final';
      if (n === 2) return 'Semi-final';
      if (n === 3) return 'Quarter-final';
      return 'Finals round of ' + (this.finalsRounds[fi]?.length * 2);
    },

    isBye(bout) {
      if (!bout) return false;
      return bout.status === 'finished' && (bout.left_id === null || bout.right_id === null);
    },

    isEmpty(bout) {
      if (!bout) return true;
      return bout.left_id === null && bout.right_id === null;
    },

    boutCardClass(bout) {
      if (this.isBye(bout))   return 'bye';
      if (this.isEmpty(bout)) return 'empty';
      const classes = [bout.status];
      if (this.selected?.id === bout.id) classes.push('selected');
      return classes.join(' ');
    },

    boutName(bout, side) {
      if (!bout) return '';
      const id = side === 'left' ? bout.left_id : bout.right_id;
      if (!id) return '';
      const seed = this.seedMap[id];
      const name = this.nameMap[id] || ('Competitor #' + id);
      return seed ? `(${seed}) ${name}` : name;
    },

    scorePanelTitle() {
      if (!this.selected) return '';
      const names = (this.boutName(this.selected, 'left') || '?') + ' vs ' + (this.boutName(this.selected, 'right') || '?');
      const mainIdx = this.rounds.findIndex(r => r.some(b => b.id === this.selected.id));
      if (mainIdx >= 0) return this.roundLabel(mainIdx, this.rounds.length) + ' — ' + names;
      const repIdx = this.repechageRounds.findIndex(r => r.some(b => b.id === this.selected.id));
      if (repIdx >= 0) return this.repechageRoundLabel(repIdx) + ' — ' + names;
      const finIdx = this.finalsRounds.findIndex(r => r.some(b => b.id === this.selected.id));
      if (finIdx >= 0) return this.finalsRoundLabel(finIdx, this.finalsRounds.length) + ' — ' + names;
      const placeLabel = this.selected.place_rank
        ? this.ord(this.selected.place_rank) + '–' + this.ord(this.selected.place_rank + 1) + ' place'
        : 'Placement bout';
      return placeLabel + ' — ' + names;
    },

    progressLabel() {
      let total = 0, done = 0;
      const allBouts = [
        ...this.rounds.flat(),
        ...this.repechageRounds.flat(),
        ...this.finalsRounds.flat(),
        ...this.placementGroups.flatMap(g => g.columns.flat()),
      ];
      for (const b of allBouts) {
        if (this.isBye(b) || this.isEmpty(b)) continue;
        total++;
        if (b.status === 'finished') done++;
      }
      return done + ' / ' + total + ' bouts complete';
    },

    selectBout(bout) {
      if (this.isBye(bout) || this.isEmpty(bout)) return;
      this.selected   = bout;
      this.scoreLeft  = bout.left_score  ?? '';
      this.scoreRight = bout.right_score ?? '';
      this.tieWinner  = bout.winner_id   ?? null;
      this.$nextTick(() => this.$refs.scoreLeftInput?.focus());
    },

    async activate() {
      const r = await fetch('/api/phases/' + phaseId + '/activate', { method: 'POST' });
      if (!r.ok) { this.showNotice((await r.json()).error || 'Activate failed', true); return; }
      this.showNotice('Phase activated');
      await this.load();
    },

    async simulate() {
      const r = await fetch('/api/phases/' + phaseId + '/simulate', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error || 'Simulate failed', true); return; }
      this.showNotice('Simulated ' + data.simulated + ' bout(s)');
      this.selected = null;
      await this.loadBouts();
    },

    async saveScore() {
      if (this.scoreLeft === '' || this.scoreLeft === null ||
          this.scoreRight === '' || this.scoreRight === null) return;
      const tie = this.scoreLeft === this.scoreRight ? this.tieWinner : null;
      const r = await fetch('/api/bouts/' + this.selected.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ left_score: this.scoreLeft, right_score: this.scoreRight, winner_id: tie }),
      });
      if (!r.ok) { this.showNotice((await r.json()).error || 'Save failed', true); return; }
      this.showNotice('Score saved');
      this.selected = null;
      await this.loadBouts();
    },

    async undoScore() {
      const prevId = this.selected?.id;
      const r = await fetch('/api/bouts/' + prevId + '/undo', { method: 'POST' });
      if (!r.ok) { this.showNotice((await r.json()).error || 'Undo failed', true); return; }
      this.showNotice('Score undone');
      await this.loadBouts();
      for (const round of [...this.rounds, ...this.repechageRounds, ...this.finalsRounds]) {
        const b = round.find(x => x.id === prevId);
        if (b) { this.selected = b; return; }
      }
      for (const g of this.placementGroups) {
        for (const col of g.columns) {
          const b = col.find(x => x.id === prevId);
          if (b) { this.selected = b; return; }
        }
      }
    },

    showNotice(text, error = false) {
      this.notice = { text, error };
      setTimeout(() => { this.notice = { text: '', error: false }; }, 4000);
    },
  };
}
</script>
