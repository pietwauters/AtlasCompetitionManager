<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — DE Phase</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
  <style>
    /* ── Section layout ── */
    .section-note{font-size:.82rem;color:var(--clr-text-muted);margin:.25rem 0 .75rem}

    /* ── Bracket (column tree) ── */
    .bracket-wrap{overflow-x:auto;padding-bottom:.5rem}
    .bracket{display:flex;gap:0;align-items:stretch;width:100%}
    .round-col{display:flex;flex-direction:column;justify-content:space-around;flex:1;min-width:180px}
    .round-col h3{text-align:center;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#666;margin:0 0 0;padding:.5rem 0;border-bottom:1px solid #e5e5e5}
    .round-col-note{font-size:.72rem;color:#aaa;text-align:center;padding:.15rem 0 .25rem}
    .bout-slot{flex:1;display:flex;align-items:center;padding:.25rem .5rem}

    /* ── List (flat rounds) ── */
    .list-section{}
    .list-round{margin-bottom:1rem}
    .list-round-header{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem;flex-wrap:wrap}
    .list-round-label{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#555}
    .list-round-note{font-size:.78rem;color:#aaa}
    .list-bouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.4rem}

    /* ── Bout card (shared) ── */
    .bout-card{width:100%;background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;font-size:.82rem;cursor:pointer;transition:box-shadow .15s;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .bout-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .bout-card.selected{border-color:#1a6bab;box-shadow:0 0 0 2px #1a6bab44}
    .bout-card.finished{border-left:3px solid #1a6bab}
    .bout-card.bye{border-left:3px solid #ccc;opacity:.7;cursor:default}
    .bout-card.empty{background:#f8f8f8;border-style:dashed;cursor:default}
    .bout-row{display:flex;align-items:center;padding:.3rem .5rem;gap:.3rem;min-height:28px}
    .bout-row+.bout-row{border-top:1px solid #f0f0f0}
    .bout-row.winner{background:#eaf6ee;font-weight:600}
    .bout-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bout-score{font-family:monospace;font-weight:700;font-size:.9rem;min-width:1.5rem;text-align:center;color:#1a6bab}
    .bye-label{color:#aaa;font-style:italic;font-size:.78rem;padding:.3rem .5rem}
    .place-label{font-size:.72rem;color:#999;padding:.2rem .5rem 0;text-align:right}

    /* ── Strip picker (shared) ── */


    /* ── Score modal ── */
    .modal-box{border-radius:10px;min-width:320px;max-width:92vw;width:auto}
    .modal-title{margin:0 0 1rem;font-size:1rem;font-weight:700;line-height:1.3}
    .score-inputs{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;margin-bottom:.75rem;justify-content:center}
    .score-block{display:flex;flex-direction:column;align-items:center;gap:.3rem}
    .score-block label{font-size:.82rem;color:#555;font-weight:600;text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score-input{width:4rem;text-align:center;font-size:1.6rem;font-weight:700;padding:.3rem;border:2px solid #ccc;border-radius:6px}
    .score-input:focus{border-color:#1a6bab;outline:none}
    .vs-sep{font-size:1.3rem;color:#aaa;padding-top:1.4rem}

    .medal-gold{color:#c9a000;font-weight:700}
    .medal-silver{color:#777;font-weight:700}
    .medal-bronze{color:#b87333;font-weight:700}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       class="nav-comp-link"></a>
  </template>
  <div class="nav-right">
    <span x-show="comp" style="color:#aad4f5;font-size:.9rem" x-text="'/ '+comp?.name"></span>
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main class="layout-data">
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <!-- Phase header -->
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="'Direct Elimination — '+(phase?.rule_doc||'').replace('.json','')"></h2>
      <span class="badge" :class="'badge-'+(phase?.status||'')" x-text="phase?.status"></span>
      <a :href="'/competition-detail.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#888">← Back to competition</a>
      <a :href="'/results.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#1a6bab">📋 Results</a>
    </div>
    <div style="margin-top:.75rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
      <span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <span style="font-size:.85rem;color:#666" x-text="progressLabel()"></span>
        <button x-show="phase?.status==='active'" @click="simulate()" style="background:#f5f0ff;color:#6b21a8;border-color:#d8b4fe">🎲 Simulate</button>
      </span>
      <span style="margin-left:auto;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        <template x-if="sections.length > 1">
          <span style="display:flex;gap:.4rem;align-items:center;font-size:.85rem">
            <label style="color:#666">Section:</label>
            <select x-model="filterSectionId" style="padding:.25rem .5rem;border:1px solid #ccc;border-radius:4px;font-size:.83rem">
              <option value="">All</option>
              <template x-for="s in sections" :key="s.id">
                <option :value="s.id" x-text="s.label"></option>
              </template>
            </select>
          </span>
        </template>
        <template x-if="activeSectionRoundOptions.length > 0">
          <span style="display:flex;gap:.4rem;align-items:center;font-size:.85rem">
            <label style="color:#666">From:</label>
            <select x-model.number="filterFromRoundIdx" style="padding:.25rem .5rem;border:1px solid #ccc;border-radius:4px;font-size:.83rem">
              <option :value="0">All rounds</option>
              <template x-for="opt in activeSectionRoundOptions" :key="opt.idx">
                <option :value="opt.idx" x-text="opt.label"></option>
              </template>
            </select>
          </span>
        </template>
        <template x-if="deStripOptions.length > 0">
          <span style="display:flex;gap:.4rem;align-items:center;font-size:.85rem">
            <label style="color:#666">Piste:</label>
            <select x-model="filterStripId" style="padding:.25rem .5rem;border:1px solid #ccc;border-radius:4px;font-size:.83rem">
              <option value="">All</option>
              <template x-for="s in deStripOptions" :key="s.id">
                <option :value="String(s.id)" x-text="s.name"></option>
              </template>
            </select>
          </span>
        </template>
      </span>
    </div>
  </div>

  <!-- Sections -->
  <template x-for="section in sections" :key="section.id">
    <div class="card" x-show="sectionVisible(section)">
      <h2 style="margin-top:0" x-text="section.label + (tableauSize ? ' (' + tableauSize + '-person tableau)' : '')"
          x-show="section.id === 'main'"></h2>
      <h2 style="margin-top:0" x-text="section.label" x-show="section.id !== 'main'"></h2>
      <p class="section-note" x-show="section.note" x-text="section.note"></p>

      <!-- ── Bracket layout ── -->
      <template x-if="section.displayHint === 'bracket'">
        <div class="bracket-wrap">
          <div class="bracket">
            <template x-for="(round, ri) in section.rounds" :key="ri">
              <div class="round-col" x-show="roundVisible(round, ri, section)">
                <h3 x-text="round.label"></h3>
                <div class="round-col-note" x-show="round.note" x-text="round.note"></div>
                <div x-show="round.stripSlot && roundPisteLabel(round)"
                     style="font-size:.72rem;color:#1a6bab;text-align:center;padding:.15rem .5rem .3rem"
                     x-text="roundPisteLabel(round)"></div>
                <template x-for="bout in round.bouts" :key="bout.id">
                  <div class="bout-slot" x-show="boutVisible(round, bout) && !isBye(bout)">
                    <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                      <template x-if="isBye(bout)">
                        <div>
                          <div class="bout-row">
                            <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                          </div>
                          <div class="bye-label">bye</div>
                        </div>
                      </template>
                      <template x-if="isEmpty(bout)">
                        <div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                        </div>
                      </template>
                      <template x-if="!isBye(bout) && !isEmpty(bout)">
                        <div>
                          <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                            <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                          </div>
                          <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                            <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ── List layout ── -->
      <template x-if="section.displayHint === 'list'">
        <div class="list-section">
          <template x-for="(round, ri) in section.rounds" :key="ri">
            <div class="list-round" x-show="roundVisible(round, ri, section)">
              <div class="list-round-header">
                <span class="list-round-label" x-text="round.label"></span>
                <span class="list-round-note" x-show="round.note" x-text="round.note"></span>
                <span x-show="round.stripSlot && roundPisteLabel(round)"
                      style="margin-left:auto;font-size:.75rem;color:#1a6bab"
                      x-text="roundPisteLabel(round)"></span>
              </div>
              <div class="list-bouts">
                <template x-for="bout in round.bouts" :key="bout.id">
                  <div x-show="boutVisible(round, bout) && !isBye(bout)">
                    <div class="bout-card" :class="boutCardClass(bout)" @click="selectBout(bout)">
                      <template x-if="isBye(bout)">
                        <div>
                          <div class="bout-row">
                            <span class="bout-name" x-text="boutName(bout,'left')||boutName(bout,'right')"></span>
                          </div>
                          <div class="bye-label">bye</div>
                        </div>
                      </template>
                      <template x-if="isEmpty(bout)">
                        <div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                          <div class="bout-row"><span class="bout-name" style="color:#bbb">TBD</span></div>
                        </div>
                      </template>
                      <template x-if="!isBye(bout) && !isEmpty(bout)">
                        <div>
                          <div class="place-label" x-show="bout.place_rank"
                               x-text="ord(bout.place_rank)+'–'+ord(bout.place_rank+1)+' place'"></div>
                          <div class="bout-row" :class="bout.winner_id===bout.left_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'left')||'?'"></span>
                            <span class="bout-score" x-show="bout.left_score!==null" x-text="bout.left_score"></span>
                          </div>
                          <div class="bout-row" :class="bout.winner_id===bout.right_id&&bout.winner_id?'winner':''">
                            <span class="bout-name" x-text="boutName(bout,'right')||'?'"></span>
                            <span class="bout-score" x-show="bout.right_score!==null" x-text="bout.right_score"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

    </div>
  </template>

  <!-- Score modal -->
  <div class="modal-backdrop" x-show="selected && !isBye(selected) && !isEmpty(selected)"
       @click.self="selected=null" @keydown.escape.window="selected=null">
    <div class="modal-box">
      <p class="modal-title" x-text="scorePanelTitle()"></p>

      <div>
        <div class="score-inputs">
          <div class="score-block">
            <label x-text="boutName(selected,'left')||'Left'"></label>
            <input class="score-input" type="number" min="0" max="99" x-model.number="scoreLeft"
                   x-ref="scoreLeftInput" @keydown.enter="saveScore()">
          </div>
          <span class="vs-sep">vs</span>
          <div class="score-block">
            <label x-text="boutName(selected,'right')||'Right'"></label>
            <input class="score-input" type="number" min="0" max="99" x-model.number="scoreRight"
                   @keydown.enter="saveScore()">
          </div>
        </div>
        <div x-show="selected && scoreLeft===scoreRight && scoreLeft!=='' && scoreLeft!==null"
             style="margin-bottom:.75rem;font-size:.85rem;text-align:center">
          Tie — winner:
          <button :class="tieWinner===selected?.left_id?'primary':''" @click="tieWinner=selected?.left_id" x-text="boutName(selected,'left')"></button>
          <button :class="tieWinner===selected?.right_id?'primary':''" @click="tieWinner=selected?.right_id" x-text="boutName(selected,'right')"></button>
        </div>
        <div style="display:flex;gap:.5rem;justify-content:center">
          <button class="success" @click="saveScore()"
                  :disabled="scoreLeft===''||scoreLeft===null||scoreRight===''||scoreRight===null">Save score</button>
          <button @click="undoScore()" x-show="selected?.status==='finished'">↩ Undo</button>
          <button @click="selected=null">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Final results -->
  <div class="card" x-show="finalResults">
    <h2 style="margin-top:0">Results</h2>
    <table>
      <thead><tr>
        <th>Place</th>
        <th>Name</th>
      </tr></thead>
      <tbody>
        <template x-for="r in finalResults" :key="r.id">
          <tr>
            <td style="font-weight:700;color:#1a6bab">
              <span :class="r.medalClass" x-text="r.place"></span>
            </td>
            <td x-text="'('+r.seed+') '+r.name"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>

<script src="/js/nav.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function buildSeedPositions(T) {
  let slots = [1, 2], cur = 2;
  while (cur < T) {
    cur *= 2;
    const next = [];
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (i % 2 === 0) next.push(s, cur + 1 - s);
      else             next.push(cur + 1 - s, s);
    }
    slots = next;
  }
  return slots;
}

function app() {
  const phaseId = new URLSearchParams(window.location.search).get('id');
  return {
    phaseId, phase: null, comp: null,
    sections:    [],
    tableauSize: 0,
    nameMap:     {},
    seedMap:     {},
    deSlots:     [],
    filterStripId: '',
    filterSectionId: '',
    filterFromRoundIdx: 0,
    selected: null,
    scoreLeft: '', scoreRight: '', tieWinner: null,
    notice: { text: '', error: false },
    finalResults: null,

    async init() {
      this.$watch('filterSectionId', () => { this.filterFromRoundIdx = 0; });
      if (!phaseId) { this.showNotice('No phase ID', true); return; }
      await this.load();
      const es = new EventSource('/api/phases/' + phaseId + '/events');
      window.addEventListener('beforeunload', () => es.close());
      es.addEventListener('bout-updated', e => {
        const updated = JSON.parse(e.data);
        this.sections = this.sections.map(section => ({
          ...section,
          rounds: section.rounds.map(round => ({
            ...round,
            bouts: round.bouts.map(b => b.id === updated.id ? { ...b, ...updated } : b),
          })),
        }));
        if (this.selected?.id === updated.id) this.selected = { ...this.selected, ...updated };
        this.computeFinalResults();
      });
    },

    async load() {
      this.phase = await fetch('/api/phases/' + phaseId).then(r => r.json());
      if (this.phase.competition_id) {
        this.comp = await fetch('/api/competitions/' + this.phase.competition_id).then(r => r.json());
      }

      document.title = 'Atlas — DE — ' + (this.comp?.name || '');
      await this.loadSections();
    },

    async loadSections() {
      const data = await fetch('/api/phases/' + phaseId + '/sections').then(r => r.json());
      this.sections    = data.sections || [];
      this.tableauSize = data.tableauSize || 0;

      // Build nameMap and seedMap from all bouts
      this.nameMap = {};
      const mainSection = this.sections.find(s => s.id === 'main');
      const r1Bouts = mainSection?.rounds[0]?.bouts || [];
      const T = this.tableauSize;

      for (const section of this.sections) {
        for (const round of section.rounds) {
          for (const b of round.bouts) {
            if (b.left_id)  this.nameMap[b.left_id]  = b.left_last  + ', ' + b.left_first;
            if (b.right_id) this.nameMap[b.right_id] = b.right_last + ', ' + b.right_first;
          }
        }
      }

      if (T >= 2) {
        const seedSlots = buildSeedPositions(T);
        this.seedMap = {};
        for (const b of r1Bouts) {
          const p = b.tableau_position;
          if (b.left_id)  this.seedMap[b.left_id]  = seedSlots[2 * (p - 1)];
          if (b.right_id) this.seedMap[b.right_id] = seedSlots[2 * (p - 1) + 1];
        }
      }

      // Re-find selected bout after reload
      if (this.selected) {
        const prevId = this.selected.id;
        this.selected = null;
        outer: for (const section of this.sections) {
          for (const round of section.rounds) {
            const b = round.bouts.find(x => x.id === prevId);
            if (b) { this.selected = b; break outer; }
          }
        }
      }

      this.computeFinalResults();
      await this.loadDeSlots();
    },

    async loadDeSlots() {
      this.deSlots = await fetch('/api/opp2/pipeline/phase/' + phaseId).then(r => r.json());
    },

    computeFinalResults() {
      const isRepechage = !!this.sections.find(s => s.id === 'repechage');
      const allPlacementBouts = () => this.sections
        .filter(s => s.id.startsWith('placement-'))
        .flatMap(s => s.rounds.flatMap(r => r.bouts));

      const results = [];
      const placed  = new Set();
      const add = (label, id, medalClass) => {
        if (!id || placed.has(id)) return;
        const name = this.nameMap[id] || ('Competitor #' + id);
        results.push({ id, place: label, seed: this.seedMap[id] || '?', name, medalClass });
        placed.add(id);
      };

      if (isRepechage) {
        const finalsSection = this.sections.find(s => s.id === 'finals');
        if (!finalsSection) { this.finalResults = null; return; }
        const lastRound = finalsSection.rounds[finalsSection.rounds.length - 1];
        const finalBout = lastRound?.bouts.find(b => b.tableau_position === 1);
        if (!finalBout?.winner_id) { this.finalResults = null; return; }

        add('🥇 1', finalBout.winner_id, 'medal-gold');
        add('🥈 2', finalBout.winner_id === finalBout.left_id ? finalBout.right_id : finalBout.left_id, 'medal-silver');

        const bronze = allPlacementBouts().find(b => b.place_rank === 3 && b.status === 'finished' && b.winner_id);
        if (bronze) {
          add('🥉 3', bronze.winner_id, 'medal-bronze');
          add('4', bronze.winner_id === bronze.left_id ? bronze.right_id : bronze.left_id, '');
        }

        const numFR = finalsSection.rounds.length;
        for (let fi = numFR - 2; fi >= 0; fi--) {
          const startPlace = 2 ** (numFR - 1 - fi) + 1;
          const round      = finalsSection.rounds[fi];
          round.bouts
            .filter(b => b.status === 'finished' && b.winner_id && b.left_id && b.right_id)
            .map(b => b.winner_id === b.left_id ? b.right_id : b.left_id)
            .filter(id => !placed.has(id))
            .map(id => ({ id, seed: this.seedMap[id] || 999 }))
            .sort((a, b) => a.seed - b.seed)
            .forEach((l, i) => add(String(startPlace + i), l.id, ''));
        }

        this.finalResults = results.length > 2 ? results : null;
        return;
      }

      // Standard DE
      const mainSection = this.sections.find(s => s.id === 'main');
      if (!mainSection) { this.finalResults = null; return; }
      const N         = mainSection.rounds.length;
      const lastRound = mainSection.rounds[N - 1];
      const finalBout = lastRound?.bouts.find(b => b.tableau_position === 1);
      if (!finalBout?.winner_id) { this.finalResults = null; return; }

      add('🥇 1', finalBout.winner_id, 'medal-gold');
      add('🥈 2', finalBout.winner_id === finalBout.left_id ? finalBout.right_id : finalBout.left_id, 'medal-silver');

      const terminals = allPlacementBouts()
        .filter(b => b.place_rank != null && b.status === 'finished' && b.winner_id)
        .sort((a, b) => a.place_rank - b.place_rank);
      for (const tb of terminals) {
        const loser = tb.winner_id === tb.left_id ? tb.right_id : tb.left_id;
        const mc    = tb.place_rank === 3 ? 'medal-bronze' : '';
        add((tb.place_rank === 3 ? '🥉 ' : '') + tb.place_rank, tb.winner_id, mc);
        add(String(tb.place_rank + 1), loser, '');
      }

      for (let ri = N - 2; ri >= 0; ri--) {
        const startPlace = 2 ** (N - 1 - ri) + 1;
        const round      = mainSection.rounds[ri];
        round.bouts
          .filter(b => b.status === 'finished' && b.winner_id && b.left_id && b.right_id)
          .map(b => b.winner_id === b.left_id ? b.right_id : b.left_id)
          .filter(id => !placed.has(id))
          .map(id => ({ id, seed: this.seedMap[id] || 999 }))
          .sort((a, b) => a.seed - b.seed)
          .forEach((l, i) => add(String(startPlace + i), l.id, ''));
      }

      this.finalResults = results.length > 2 ? results : null;
    },

    ord(n) {
      if (!n) return '';
      const s = ['th','st','nd','rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    },

    isBye(bout) {
      if (!bout) return false;
      return bout.status === 'finished' && (bout.left_id === null || bout.right_id === null);
    },

    isEmpty(bout) {
      if (!bout) return true;
      return bout.left_id === null && bout.right_id === null;
    },

    boutCardClass(bout) {
      if (this.isBye(bout))   return 'bye';
      if (this.isEmpty(bout)) return 'empty';
      const classes = [bout.status];
      if (this.selected?.id === bout.id) classes.push('selected');
      return classes.join(' ');
    },

    boutName(bout, side) {
      if (!bout) return '';
      const id = side === 'left' ? bout.left_id : bout.right_id;
      if (!id) return '';
      const seed = this.seedMap[id];
      const name = this.nameMap[id] || ('Competitor #' + id);
      return seed ? `(${seed}) ${name}` : name;
    },

    scorePanelTitle() {
      if (!this.selected) return '';
      const names = (this.boutName(this.selected, 'left') || '?') + ' vs ' + (this.boutName(this.selected, 'right') || '?');
      for (const section of this.sections) {
        for (let ri = 0; ri < section.rounds.length; ri++) {
          if (section.rounds[ri].bouts.some(b => b.id === this.selected.id)) {
            if (section.id.startsWith('placement-')) {
              const placeLabel = this.selected.place_rank
                ? this.ord(this.selected.place_rank) + '–' + this.ord(this.selected.place_rank + 1) + ' place'
                : section.label + ' — ' + section.rounds[ri].label;
              return placeLabel + ' — ' + names;
            }
            return section.label + ' — ' + section.rounds[ri].label + ' — ' + names;
          }
        }
      }
      return names;
    },

    progressLabel() {
      let total = 0, done = 0;
      for (const section of this.sections) {
        for (const round of section.rounds) {
          for (const b of round.bouts) {
            if (this.isBye(b) || this.isEmpty(b)) continue;
            total++;
            if (b.status === 'finished') done++;
          }
        }
      }
      return done + ' / ' + total + ' bouts complete';
    },

    selectBout(bout) {
      if (this.isBye(bout) || this.isEmpty(bout)) return;
      this.selected   = bout;
      this.scoreLeft  = bout.left_score  ?? '';
      this.scoreRight = bout.right_score ?? '';
      this.tieWinner  = bout.winner_id   ?? null;
      this.$nextTick(() => this.$refs.scoreLeftInput?.focus());
    },

    async simulate() {
      const r = await fetch('/api/phases/' + phaseId + '/simulate', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error || 'Simulate failed', true); return; }
      this.showNotice('Simulated ' + data.simulated + ' bout(s)');
      this.selected = null;
      await this.loadSections();
    },

    async saveScore() {
      if (this.scoreLeft === '' || this.scoreLeft === null ||
          this.scoreRight === '' || this.scoreRight === null) return;
      const tie = this.scoreLeft === this.scoreRight ? this.tieWinner : null;
      const r = await fetch('/api/bouts/' + this.selected.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ left_score: this.scoreLeft, right_score: this.scoreRight, winner_id: tie }),
      });
      if (!r.ok) { this.showNotice((await r.json()).error || 'Save failed', true); return; }
      this.showNotice('Score saved');
      this.selected = null;
      await this.loadSections();
    },

    async undoScore() {
      const prevId = this.selected?.id;
      const r = await fetch('/api/bouts/' + prevId + '/undo', { method: 'POST' });
      if (!r.ok) { this.showNotice((await r.json()).error || 'Undo failed', true); return; }
      this.showNotice('Score undone');
      await this.loadSections();
      outer: for (const section of this.sections) {
        for (const round of section.rounds) {
          const b = round.bouts.find(x => x.id === prevId);
          if (b) { this.selected = b; break outer; }
        }
      }
    },

    // ── Section / round filter ───────────────────────────────────────────────

    get currentSectionForFilter() {
      if (this.filterSectionId) return this.sections.find(s => s.id === this.filterSectionId) || null;
      if (this.sections.length === 1) return this.sections[0];
      return null;
    },

    get activeSectionRounds() {
      const s = this.currentSectionForFilter;
      return s ? s.rounds : [];
    },

    get activeSectionRoundOptions() {
      return this.activeSectionRounds
        .map((r, i) => ({ label: r.label, idx: i }))
        .filter(item => item.idx > 0);
    },

    sectionVisible(section) {
      return !this.filterSectionId || section.id === this.filterSectionId;
    },

    // ── Piste display / filter ───────────────────────────────────────────────

    roundPisteLabel(round) {
      if (!round.stripSlot) return '';
      const { bracket, tableau } = round.stripSlot;
      const slots = this.deSlots.filter(s =>
        (bracket === 'main' ? (s.bracket === 'main' || !s.bracket) : s.bracket === bracket) &&
        s.tableau === tableau
      );
      if (!slots.length) return '';
      return slots.map(s => s.strip_name || ('Piste ' + s.strip_number)).join(' / ');
    },

    get deStripOptions() {
      const seen = new Set();
      return this.deSlots.filter(s => !seen.has(s.strip_id) && seen.add(s.strip_id))
        .map(s => ({ id: s.strip_id, name: s.strip_name || ('Piste ' + s.strip_number) }));
    },

    _partitionRange(partition, tableau) {
      const n = tableau / 2;
      if (!partition || partition === 'full') return [1, n];
      let lo = 1, hi = n;
      for (const ch of partition) {
        const mid = Math.floor((lo + hi) / 2);
        if ('A1aceg'.includes(ch)) hi = mid; else lo = mid + 1;
      }
      return [lo, hi];
    },

    roundVisible(round, ri, section) {
      const fs = this.currentSectionForFilter;
      if (fs && section && section.id === fs.id && ri < this.filterFromRoundIdx) return false;
      if (!this.filterStripId || !round.stripSlot) return true;
      const { bracket, tableau } = round.stripSlot;
      return this.deSlots.some(s =>
        String(s.strip_id) === this.filterStripId &&
        (bracket === 'main' ? (s.bracket === 'main' || !s.bracket) : s.bracket === bracket) &&
        s.tableau === tableau
      );
    },

    boutVisible(round, bout) {
      if (!this.filterStripId || !round.stripSlot) return true;
      const { bracket, tableau } = round.stripSlot;
      const slot = this.deSlots.find(s =>
        String(s.strip_id) === this.filterStripId &&
        (bracket === 'main' ? (s.bracket === 'main' || !s.bracket) : s.bracket === bracket) &&
        s.tableau === tableau
      );
      if (!slot) return false;
      const [lo, hi] = this._partitionRange(slot.partition, tableau);
      return bout.tableau_position >= lo && bout.tableau_position <= hi;
    },

    showNotice(text, error = false) {
      this.notice = { text, error };
      setTimeout(() => { this.notice = { text: '', error: false }; }, 4000);
    },
  };
}
</script>
