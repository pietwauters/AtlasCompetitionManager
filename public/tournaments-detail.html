<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details — Atlas</title>
    <script src="/js/htmx.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme-init.js"></script>
</head>

<body>
    <header x-data="navApp()" x-init="initNav()">
      <a href="/index.html"><strong>Atlas</strong></a>
      <template x-for="comp in activeComps" :key="comp.phase_id">
        <a :href="phaseLink(comp)" x-text="compLabel(comp)" class="nav-comp-link"></a>
      </template>
      <div class="nav-right">
        <a href="/strips.html">Strips</a>
        <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
        <a href="/people.html">People</a>
        <a href="/clubs.html">Clubs</a>
        <a href="/admin.html">Admin</a>
      </div>
    </header>
    <main class="layout-data">
        <div class="card" id="tournament-detail">
            <span class="loading">Loading…</span>
        </div>
        <div class="card" id="tournament-referees">
            <span class="loading">Loading…</span>
        </div>
        <div class="card" id="tournament-pool-refs">
            <span class="loading">Loading…</span>
        </div>
    </main>
    <script>
        // Get tournament id from URL
        function getTournamentId() {
            // Support both /tournaments-detail.html?tournament=ID and /tournaments/ID
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('tournament')) return urlParams.get('tournament');
            const m = window.location.pathname.match(/tournaments\/(\d+)/);
            return m ? m[1] : null;
        }

        // ── Referee roster (tournament-wide) ────────────────────────────────
        let lastTournamentRoster = [];
        let lastEligibleTournamentReferees = [];
        let selectedTournamentRefIds = [];
        let tournamentRefClubFilter = '';

        async function loadTournamentReferees() {
            const id = getTournamentId();
            if (!id) return;
            const [roster, eligible] = await Promise.all([
                fetch(`/api/tournaments/${id}/referees`).then(r => r.json()),
                fetch(`/api/tournaments/${id}/referees/eligible`).then(r => r.json()),
            ]);
            lastTournamentRoster = roster;
            lastEligibleTournamentReferees = eligible;
            renderTournamentReferees();
        }

        function renderTournamentReferees() {
            const roster = lastTournamentRoster;
            const clubs = [...new Set(lastEligibleTournamentReferees.map(r => r.club_name).filter(Boolean))].sort();
            let eligible = lastEligibleTournamentReferees;
            if (tournamentRefClubFilter) eligible = eligible.filter(r => r.club_name === tournamentRefClubFilter);

            const rosterRows = roster.length
                ? roster.map((r, i) => `
                    <tr>
                        <td data-label="Rank" style="white-space:nowrap">
                            <span style="display:inline-block;min-width:1.4rem;text-align:right">${r.rank_order || '—'}</span>
                            <button style="font-size:.7rem;padding:.05rem .3rem" ${i === 0 ? 'disabled' : ''} onclick="moveTournamentReferee(${r.referee_id},'up')">▲</button>
                            <button style="font-size:.7rem;padding:.05rem .3rem" ${i === roster.length - 1 ? 'disabled' : ''} onclick="moveTournamentReferee(${r.referee_id},'down')">▼</button>
                        </td>
                        <td data-label="Name">${esc(r.last_name)}, ${esc(r.first_name)}</td>
                        <td data-label="Club">${esc(r.club_name || '—')}</td>
                        <td data-label="Nationality">${esc(r.nationality || '—')}</td>
                        <td data-label="Level">${esc(r.level || '—')}</td>
                        <td data-label="Actions"><button class="danger" onclick="removeTournamentReferee(${r.referee_id})">✕</button></td>
                    </tr>`).join('')
                : `<tr><td colspan="6" style="text-align:center;color:#999;padding:1rem">No referees yet. Add from the list below.</td></tr>`;

            const eligibleRows = eligible.length
                ? eligible.map(r => `
                    <tr class="elig-row${r.is_registered ? ' registered' : ''}">
                        <td>${r.is_registered
                            ? '<span class="badge badge-registered">✓ added</span>'
                            : `<input type="checkbox" ${selectedTournamentRefIds.includes(r.referee_id) ? 'checked' : ''} onchange="toggleTournamentRefSelect(${r.referee_id}, this.checked)">`}</td>
                        <td>${esc(r.last_name)}, ${esc(r.first_name)}</td>
                        <td>${esc(r.club_name || '—')}</td>
                        <td>${esc(r.nationality || '—')}</td>
                        <td>${esc(r.level || '—')}</td>
                    </tr>`).join('')
                : `<tr><td colspan="5" style="text-align:center;color:#999;padding:1rem">No referees found.</td></tr>`;

            document.getElementById('tournament-referees').innerHTML = `
                <h2 style="margin-top:0;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
                    <span>Referees</span>
                    <span style="font-weight:400;font-size:.85rem;color:#888">(${roster.length})</span>
                    <button style="margin-left:auto;font-size:.78rem;padding:.25rem .6rem" ${roster.length ? '' : 'disabled'}
                            onclick="autoRankTournamentReferees()" title="Rank by referee level (t.50.3: best referees per weapon)">
                        ⚡ Auto-rank by level
                    </button>
                </h2>
                <table class="table-responsive"><thead><tr><th>Rank</th><th>Name</th><th>Club</th><th>Nationality</th><th>Level</th><th></th></tr></thead>
                <tbody>${rosterRows}</tbody></table>

                <h3 style="margin:1.5rem 0 .5rem">Add referees</h3>
                <div class="toolbar">
                    <select style="flex:1;min-width:100px" onchange="setTournamentRefClubFilter(this.value)">
                        <option value="">All clubs</option>
                        ${clubs.map(c => `<option value="${esc(c)}" ${c === tournamentRefClubFilter ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                    </select>
                    <button class="primary" ${selectedTournamentRefIds.length ? '' : 'disabled'} onclick="addSelectedTournamentReferees()">${
                        selectedTournamentRefIds.length ? 'Add ' + selectedTournamentRefIds.length + ' selected' : 'Select referees'
                    }</button>
                </div>
                <table class="table-responsive"><thead><tr><th></th><th>Name</th><th>Club</th><th>Nationality</th><th>Level</th></tr></thead>
                <tbody>${eligibleRows}</tbody></table>
            `;
        }

        function setTournamentRefClubFilter(v) { tournamentRefClubFilter = v; renderTournamentReferees(); }
        function toggleTournamentRefSelect(id, checked) {
            id = Number(id);
            if (checked) { if (!selectedTournamentRefIds.includes(id)) selectedTournamentRefIds.push(id); }
            else { selectedTournamentRefIds = selectedTournamentRefIds.filter(x => x !== id); }
            renderTournamentReferees();
        }
        async function addSelectedTournamentReferees() {
            const id = getTournamentId();
            if (!id || !selectedTournamentRefIds.length) return;
            const r = await fetch(`/api/tournaments/${id}/referees/bulk`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ referee_ids: selectedTournamentRefIds }),
            });
            const data = await r.json();
            if (!r.ok) { alert(data.error || 'Add failed'); return; }
            selectedTournamentRefIds = [];
            await loadTournamentReferees();
        }
        async function removeTournamentReferee(refereeId) {
            const id = getTournamentId();
            if (!id) return;
            if (!confirm('Remove this referee from the tournament?')) return;
            const r = await fetch(`/api/tournaments/${id}/referees/${refereeId}`, { method: 'DELETE' });
            if (!r.ok) { const d = await r.json(); alert(d.error || 'Remove failed'); return; }
            await loadTournamentReferees();
        }
        async function autoRankTournamentReferees() {
            const id = getTournamentId();
            if (!id) return;
            const r = await fetch(`/api/tournaments/${id}/referees/auto-rank`, { method: 'POST' });
            if (!r.ok) { const d = await r.json(); alert(d.error || 'Auto-rank failed'); return; }
            await loadTournamentReferees();
        }
        async function moveTournamentReferee(refereeId, direction) {
            const id = getTournamentId();
            if (!id) return;
            const r = await fetch(`/api/tournaments/${id}/referees/${refereeId}/reorder`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direction }),
            });
            if (!r.ok) { const d = await r.json(); alert(d.error || 'Move failed'); return; }
            await loadTournamentReferees();
        }
        // ── Combine pool rounds — auto-assign referees across competitions ──
        let combinablePhases = [];
        let selectedPhaseIds = [];
        let allReferees = [];
        let lastCombineResult = null;
        let lastPoolLabels = {};

        async function loadCombinablePoolPhases() {
            const id = getTournamentId();
            if (!id) return;
            const [phases, refs] = await Promise.all([
                fetch(`/api/tournaments/${id}/pool-phases`).then(r => r.json()),
                fetch('/api/people?role=referee').then(r => r.json()).catch(() => []),
            ]);
            combinablePhases = phases;
            allReferees = refs;
            renderCombinablePoolPhases();
        }

        function poolPhaseLabel(p) {
            return `${p.competition_name} (${p.weapon}/${p.gender}) — Round ${p.phase_order}`;
        }
        function refereeNameById(id) {
            const r = allReferees.find(x => x.referee_id == id);
            return r ? `${r.last_name}, ${r.first_name}` : `Referee ${id}`;
        }
        function poolLabel(poolId) {
            return lastPoolLabels[poolId] || ('pool #' + poolId);
        }
        function poolBlockingDetail(p) {
            const parts = [];
            if (p.nationalities.length) parts.push('nationality ' + p.nationalities.join(', '));
            if (p.clubs.length) parts.push('club ' + p.clubs.map(c => c.club_name).join(', '));
            return parts.join(' · ') || '—';
        }
        function blockingSummary(s) {
            const nats  = [...new Set(s.pools.flatMap(p => p.nationalities))];
            const clubs = [...new Set(s.pools.flatMap(p => p.clubs.map(c => c.club_name)))];
            const parts = [];
            if (nats.length)  parts.push('nationality ' + nats.join(', '));
            if (clubs.length) parts.push('club ' + clubs.join(', '));
            return parts.join(' and ') || 'nothing in particular';
        }

        function renderCombinablePoolPhases() {
            const rows = combinablePhases.length
                ? combinablePhases.map(p => `
                    <label style="display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border:1px solid #ddd;border-radius:5px;margin-bottom:.4rem;cursor:pointer">
                        <input type="checkbox" ${selectedPhaseIds.includes(p.phase_id) ? 'checked' : ''} onchange="togglePhaseSelect(${p.phase_id}, this.checked)">
                        <span>${esc(poolPhaseLabel(p))}</span>
                        <span style="margin-left:auto;font-size:.8rem;color:#888">${p.pools_with_referee}/${p.pool_count} pool(s) have a referee</span>
                    </label>`).join('')
                : `<p class="empty">No pool phases in this tournament's competitions yet.</p>`;

            document.getElementById('tournament-pool-refs').innerHTML = `
                <h2 style="margin-top:0">Combine pool rounds — auto-assign referees</h2>
                <p style="font-size:.85rem;color:#666;margin:0 0 .75rem">
                    Select the pool rounds that run at the same time — across one or more of this
                    tournament's competitions — to solve them together from one shared pool of
                    referees, instead of each competition drawing only from its own roster.
                </p>
                ${rows}
                <div style="margin-top:.5rem">
                    <button class="primary" ${selectedPhaseIds.length ? '' : 'disabled'} onclick="runCombinedAutoAssign()">
                        ⚡ Auto-assign referees across ${selectedPhaseIds.length} selected round(s)
                    </button>
                </div>
                <div id="combine-result" style="margin-top:1rem"></div>
            `;
            if (lastCombineResult) renderCombineResult();
        }

        function togglePhaseSelect(id, checked) {
            id = Number(id);
            if (checked) { if (!selectedPhaseIds.includes(id)) selectedPhaseIds.push(id); }
            else { selectedPhaseIds = selectedPhaseIds.filter(x => x !== id); }
            renderCombinablePoolPhases();
        }

        async function runCombinedAutoAssign() {
            const id = getTournamentId();
            if (!id || !selectedPhaseIds.length) return;
            const r = await fetch(`/api/tournaments/${id}/auto-assign-referees`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phase_ids: selectedPhaseIds }),
            });
            const data = await r.json();
            if (!r.ok) { alert(data.error || 'Auto-assign failed'); return; }
            lastCombineResult = data;

            // Friendly "Competition Pool N" labels for the pool ids referenced
            // in the result, built from the phases we just solved.
            lastPoolLabels = {};
            for (const phaseId of selectedPhaseIds) {
                const phaseInfo = combinablePhases.find(p => p.phase_id === phaseId);
                const pools = await fetch(`/api/phases/${phaseId}/pools`).then(r => r.json()).catch(() => []);
                for (const pool of pools) {
                    lastPoolLabels[pool.id] = (phaseInfo ? phaseInfo.competition_name + ' ' : '') + 'Pool ' + pool.pool_number;
                }
            }

            await loadCombinablePoolPhases();
        }

        function renderCombineResult() {
            const data = lastCombineResult;
            const el = document.getElementById('combine-result');
            if (!el) return;

            let html = `<div style="font-size:.9rem;margin-bottom:.5rem">${data.assigned.length} pool(s) assigned.`;
            const withConflict = data.assigned.filter(a => a.conflicts > 0).length;
            if (withConflict) html += ` <span style="color:#856404">${withConflict} had an unavoidable nationality/club conflict.</span>`;
            html += `</div>`;

            if (data.shortfalls && data.shortfalls.length) {
                html += `<div style="font-size:.85rem;font-weight:600;margin-bottom:.35rem">Why some pools couldn't get a clean referee</div>`;
                html += data.shortfalls.map(s => `
                    <div style="font-size:.85rem;padding:.5rem .6rem;background:#fde8e8;border:1px solid #f1a9a9;border-radius:5px;margin-bottom:.4rem">
                        <div>${s.pools.map(p => poolLabel(p.pool_id)).join(', ')} could only draw from
                        <strong>${s.compatible_referee_ids.length}</strong> referee(s) satisfying
                        ${s.threshold === 0 ? 'a fully clean assignment' : ('at most ' + s.threshold + ' violated criterion/criteria')}.</div>
                        ${s.pools.map(p => `
                            <div style="font-size:.8rem;color:#555;margin:.15rem 0 0 .5rem">
                                ${esc(poolLabel(p.pool_id))}: ${esc(poolBlockingDetail(p))}
                            </div>`).join('')}
                        <div style="color:#922b21;margin-top:.35rem">Short by <strong>${s.shortfall}</strong> — add ${s.shortfall} more
                        referee(s) avoiding ${esc(blockingSummary(s))} to resolve this
                        (${s.compatible_referee_ids.map(refereeNameById).join(', ') || 'none currently qualify'} already do).</div>
                    </div>`).join('');
            }

            if (data.unassigned && data.unassigned.length) {
                html += `<div style="font-size:.85rem;color:#922b21">
                    ${data.unassigned.length} pool(s) got no referee at all: ${data.unassigned.map(poolLabel).join(', ')}.
                    Not enough referees registered across the selected competitions.</div>`;
            }

            el.innerHTML = html;
        }

        async function loadTournamentDetail() {
            const id = getTournamentId();
            if (!id) return;
            const r = await fetch(`/api/tournaments/${id}`);
            if (!r.ok) { document.getElementById('tournament-detail').innerHTML = '<p class="empty">Tournament not found.</p>'; return; }
            const t = await r.json();
            let html = `<h2 style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
                <span>${esc(t.name)}</span>
                <a href="/schedule-planner.html?tournament_id=${id}" style="font-size:.78rem;font-weight:400">📅 Schedule planner</a>
            </h2>`;
            html += `<div style='margin-bottom:1rem;color:#555;'>${esc(t.city)}, ${esc(t.country)} | ${t.date_start || ''}${t.date_end ? ' – ' + t.date_end : ''} | Level: ${esc(t.level || '')}</div>`;
            if (!t.competitions || !t.competitions.length) {
                html += `<p class='empty'>No competitions linked to this tournament.</p>`;
            } else {
                html += `<table class="table-responsive"><thead><tr><th>Name</th><th>Weapon</th><th>Gender</th><th>Status</th></tr></thead><tbody>` +
                    t.competitions.map(c => `<tr>
                    <td data-label="Name"><a class="row-link" href="/competitions/${c.id}">${esc(c.name)}</a></td>
                    <td data-label="Weapon">${esc(c.weapon)}</td>
                    <td data-label="Gender">${esc(c.gender)}</td>
                    <td data-label="Status">${esc(c.status)}</td>
                </tr>`).join('') + '</tbody></table>';
            }
            document.getElementById('tournament-detail').innerHTML = html;
        }
        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        window.addEventListener('DOMContentLoaded', loadTournamentDetail);
        window.addEventListener('DOMContentLoaded', loadTournamentReferees);
        window.addEventListener('DOMContentLoaded', loadCombinablePoolPhases);
    </script>
    <script src="/js/nav.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
