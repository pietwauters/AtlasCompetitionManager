<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Strips</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
  <style>
    .form-row{margin-top:1rem;padding-top:1rem;border-top:1px solid #eee}
    .form-row input{width:8rem}
    .badge-idle{background:#d6d8db;color:#383d41}
    .badge-assigned{background:#d4edda;color:#155724}
    .badge-maintenance{background:#fde8e8;color:#922b21}
    .badge-online{background:#d4edda;color:#155724}
    .badge-offline{background:#d6d8db;color:#383d41}
    .name-input{font-size:.9rem;width:100%;padding:.25rem .4rem;border:1px solid transparent;border-radius:4px;background:transparent;transition:border-color .15s,background .15s}
    .name-input:hover{border-color:#ccc;background:var(--clr-th-bg)}
    .name-input:focus{border-color:#1a6bab;background:var(--clr-surface);outline:none}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       class="nav-comp-link"></a>
  </template>
  <div class="nav-right">
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main class="layout-data">
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <div class="card">
    <div class="toolbar">
      <h2 style="margin:0;flex:1">Pistes / Strips</h2>
      <a href="/piste-qr.html" class="btn" style="font-size:.85rem">QR codes →</a>
    </div>

    <table>
      <thead><tr>
        <th>#</th><th>Name</th><th>Status</th><th>Network</th><th>Current bout</th><th></th>
      </tr></thead>
      <tbody>
        <template x-for="s in strips" :key="s.id">
          <tr>
            <td x-text="s.strip_number"></td>
            <td>
              <input class="name-input"
                     :value="s.name||''"
                     @change="rename(s, $event.target.value)"
                     @keydown.enter="$event.target.blur()"
                     placeholder="click to add name">
            </td>
            <td><span class="badge" :class="'badge-'+s.status" x-text="s.status"></span></td>
            <td><span class="badge" :class="'badge-'+s.network_state" x-text="s.network_state"></span></td>
            <td style="font-size:.85rem;color:#555"
                x-text="s.bout ? '#'+s.bout.bout_order+': '+s.bout.left+' — '+s.bout.right : '—'"></td>
            <td>
              <button class="danger" @click="deleteStrip(s)">Delete</button>
            </td>
          </tr>
        </template>
        <tr x-show="strips.length===0">
          <td colspan="5" style="text-align:center;color:#999;padding:1.5rem">No strips yet. Add one below.</td>
        </tr>
      </tbody>
    </table>

    <!-- Add form -->
    <div class="form-row">
      <label>Strip number *
        <input type="number" x-model="newNumber" placeholder="1" min="1">
      </label>
      <label>Name (optional)
        <input x-model="newName" placeholder="Piste 1">
      </label>
      <button class="primary" @click="addStrip()" style="align-self:flex-end">+ Add strip</button>
      <button @click="addMultiple()" style="align-self:flex-end" title="Add strips numbered 1 to N">Add strips 1 to N…</button>
    </div>
  </div>
</main>
<script>
function app() {
  return {
    strips: [],
    newNumber: '', newName: '',
    notice: {text:'',error:false},

    async init() {
      await this.load();
      const es = new EventSource('/api/strips/events');
      window.addEventListener('beforeunload', () => es.close());
      es.addEventListener('piste-state', e => {
        const p = JSON.parse(e.data);
        this.strips = this.strips.map(s => s.name === p.pisteId
          ? { ...s, network_state: p.apparatusOnline ? 'online' : 'offline',
                    boutId: p.boutId, slotId: p.slotId, bout: p.bout }
          : s);
      });
    },

    async load() {
      this.strips = await fetch('/api/strips').then(r=>r.json());
    },

    async addStrip() {
      if(!this.newNumber){this.showNotice('Strip number is required',true);return;}
      const r = await fetch('/api/strips',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({strip_number:Number(this.newNumber), name:this.newName||null})
      });
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Add failed',true);return;}
      this.showNotice('Strip '+data.strip_number+' added');
      this.newNumber=''; this.newName='';
      await this.load();
    },

    async addMultiple() {
      const n = Number(prompt('Add strips numbered 1 to:'));
      if(!n||n<1)return;
      const existing = new Set(this.strips.map(s=>s.strip_number));
      for(let i=1;i<=n;i++){
        if(!existing.has(i)){
          await fetch('/api/strips',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({strip_number:i,name:String(i)})});
        }
      }
      this.showNotice('Strips 1–'+n+' ready');
      await this.load();
    },

    async rename(s, name) {
      await fetch('/api/strips/'+s.id,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name: name||null})
      });
      await this.load();
    },

    async deleteStrip(s) {
      if(!confirm('Delete strip '+s.strip_number+'?'))return;
      const r = await fetch('/api/strips/'+s.id,{method:'DELETE'});
      if(!r.ok){this.showNotice('Delete failed — strip may be in use',true);return;}
      this.showNotice('Deleted');
      await this.load();
    },

    showNotice(text,error=false){
      this.notice={text,error};
      setTimeout(()=>{this.notice={text:'',error:false};},3000);
    },
  };
}
</script>
<script src="/js/nav.js"></script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
