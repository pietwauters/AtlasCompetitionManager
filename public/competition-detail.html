<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition — Atlas</title>
    <script src="/js/htmx.min.js"></script>
    <script src="/js/alpinejs.min.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <strong>Atlas</strong>
        <a href="/">Home</a>
        <a href="/competitions">Competitions</a>
        <span id="header-name" style="margin-left:auto;opacity:.7;font-size:.9rem"></span>
    </header>
    <main>
        <div class="card" id="comp-card">
            <div style="color:#888">Loading…</div>
        </div>

        <div class="card" x-data="phaseMgr()" x-init="init()" id="phases-card" style="display:none">
            <template x-if="error">
                <div class="notification" x-text="error"
                    style="margin-bottom:1rem;padding:.7rem 1.2rem;background:#fff3cd;border:1px solid #ffeeba;border-radius:6px;color:#856404;font-size:1rem">
                </div>
            </template>
            <h3 style="margin-top:0">Phases</h3>

            <!-- Phase list -->
            <template x-if="phases.length === 0">
                <p class="phases-placeholder">No phases yet. Add one below.</p>
            </template>
            <template x-for="ph in phases" :key="ph.id">
                <div class="phase-row">
                    <div class="label">
                        <strong x-text="'Phase ' + ph.phase_order + ' — ' + ph.rule_doc"></strong>
                        <small x-text="'(' + ph.type + ', ' + (ph.pool_count ?? 0) + ' pools)'"></small>
                        <span class="badge" :class="'badge-' + ph.status" x-text="ph.status"
                            style="margin-left:.4rem"></span>
                    </div>
                    <a :href="'/competitions/' + compId + '/phases/' + ph.id + '/view'"
                        style="padding:.35rem .8rem;background:#eaf0fb;color:#1a6bab;border-radius:5px;font-size:.85rem;text-decoration:none"
                        x-show="ph.pool_count > 0">View pools</a>
                    <button class="success" @click="generate(ph.id)" x-show="ph.status === 'pending'"
                        :disabled="busy">Generate pools</button>
                    <button class="primary" @click="() => closePhase(ph.id)" x-show="ph.status !== 'finished'"
                        :disabled="busy">Close Phase</button>
                    <button class="danger" @click="reopenPhase(ph.id)" x-show="ph.status === 'finished'"
                        :disabled="busy">Reopen Phase</button>
                    <button class="primary" @click="simulatePhase(ph.id)" x-show="ph.status === 'active'"
                        :disabled="busy">Simulate Results</button>
                    <button class="danger" @click="deletePhase(ph.id)" x-show="ph.status !== 'finished'"
                        :disabled="busy">Delete</button>
                </div>
            </template>

            <!-- Add phase form -->
            <div class="add-phase-form">
                <select x-model="selectedRule">
                    <option value="">-- select rule --</option>
                    <template x-for="r in rules" :key="r.filename">
                        <option :value="r.filename" x-text="r.description + ' (' + r.filename + ')'"></option>
                    </template>
                </select>
                <button class="primary" @click="addPhase()" :disabled="!selectedRule || busy">Add Phase</button>
            </div>


            <!-- Pool configuration choice (shown when generate returns multiple options) -->
            <div x-show="pendingChoice && pendingChoice.options"
                style="margin-top:1.2rem;padding:1rem 1.2rem;background:#f8f9fa;border-radius:6px;border:1px solid #dee2e6">
                <h4 style="margin-top:0;margin-bottom:.8rem">Choose pool configuration</h4>
                <template x-for="(opt, idx) in (pendingChoice?.options ?? [])" :key="idx">
                    <label style="display:block;padding:.35rem 0;cursor:pointer;font-size:.92rem">
                        <input type="radio" :value="idx" x-model.number="chosenOptionIdx" style="margin-right:.5rem">
                        <span x-text="describeOption(opt)"></span>
                    </label>
                </template>
                <div style="margin-top:.9rem;display:flex;gap:.6rem">
                    <button class="primary" @click="confirmChoice()" :disabled="busy">Confirm</button>
                    <button @click="cancelChoice()" :disabled="busy">Cancel</button>
                </div>
            </div>

            <!-- Block-seeding special options dialog -->
            <div x-show="blockSeedingDialog"
                style="margin-top:1.2rem;padding:1rem 1.2rem;background:#fffbe6;border-radius:6px;border:1px solid #ffe58f">
                <h4 style="margin-top:0;margin-bottom:.8rem">Number of fencers not divisible by 6</h4>
                <p x-text="blockSeedingDialog?.message"></p>
                <div style="margin-top:.7rem">
                    <label style="display:block;padding:.3rem 0;cursor:pointer;font-size:.92rem">
                        <input type="radio" value="drop" x-model="blockSeedingChoice" style="margin-right:.5rem">
                        Drop the lowest ranked <span x-text="blockSeedingDialog?.options?.drop?.length"></span>
                        fencer(s)
                    </label>
                    <template x-if="blockSeedingDialog?.options?.redistribute">
                        <label style="display:block;padding:.3rem 0;cursor:pointer;font-size:.92rem">
                            <input type="radio" value="redistribute" x-model="blockSeedingChoice"
                                style="margin-right:.5rem">
                            Redistribute remainder: <span
                                x-text="blockSeedingDialog?.options?.redistribute.join(', ')"></span> per pool
                        </label>
                    </template>
                </div>
                <div style="margin-top:.9rem;display:flex;gap:.6rem">
                    <button class="primary" @click="confirmBlockSeeding()"
                        :disabled="!blockSeedingChoice || busy">Confirm</button>
                    <button @click="cancelBlockSeeding()" :disabled="busy">Cancel</button>
                </div>
            </div>

            <!-- Advancement choice dialog -->
            <div x-show="advancementChoiceDialog"
                style="margin-top:1.2rem;padding:1rem 1.2rem;background:#eaf0fb;border-radius:6px;border:1px solid #b5c9e8">
                <h4 style="margin-top:0;margin-bottom:.8rem"
                    x-text="advancementChoiceDialog?.label || 'Select advancement option'"></h4>
                <template x-for="(choice, idx) in (advancementChoiceDialog?.choices ?? [])" :key="idx">
                    <div style="margin-bottom:0.5rem">
                        <label style="display:inline-block;padding:.35rem 0;cursor:pointer;font-size:.92rem">
                            <input type="radio" :value="idx" x-model.number="chosenAdvancementIdx"
                                style="margin-right:.5rem">
                            <span x-text="choice.label"></span>
                        </label>
                        <template x-if="choice.method === 'percentage'">
                            <span>
                                <input type="number" min="1" max="100" step="1" style="margin-left:1.2rem;width:4em"
                                    placeholder="%" x-model.number="choice._value" @click.stop
                                    @input="choice._value = $event.target.valueAsNumber > 0 ? $event.target.valueAsNumber : null">
                                <span style="font-size:.85em;color:#888;margin-left:.3em">%</span>
                                <input type="text" style="margin-left:1.2rem;width:5em" placeholder="Round to"
                                    x-model="choice._roundTo" @click.stop>
                                <span style="font-size:.85em;color:#888;margin-left:.3em">(optional: round up to
                                    multiple)</span>
                            </span>
                        </template>
                        <template x-if="choice.method === 'count' && (choice.value === '?' || choice._value === '?')">
                            <span>
                                <input type="number" min="1" step="1" style="margin-left:1.2rem;width:4em"
                                    placeholder="Count" x-model.number="choice._value" @click.stop
                                    @input="choice._value = $event.target.valueAsNumber > 0 ? $event.target.valueAsNumber : null">
                                <span style="font-size:.85em;color:#888;margin-left:.3em">fencers</span>
                            </span>
                        </template>
                    </div>
                </template>
                <div style="margin-top:.9rem;display:flex;gap:.6rem">
                    <button class="primary" @click="confirmAdvancementChoice()" :disabled="busy">Confirm</button>
                    <button @click="cancelAdvancementChoice()" :disabled="busy">Cancel</button>
                </div>
            </div>

            <p class="error-msg" x-text="error" x-show="error"></p>
        </div>
    </main>

    <script>
        const compId = location.pathname.split('/')[2];

        fetch(`/api/competitions/${compId}`)
            .then(r => r.json())
            .then(render)
            .catch(() => { document.getElementById('comp-card').innerHTML = '<p>Error loading competition.</p>'; });

        function render(c) {
            const weaponLabel = { foil: 'Foil', epee: 'Épée', sabre: 'Sabre' };
            const genderLabel = { M: 'Men', F: 'Women', X: 'Mixed' };
            const badgeClass = { draft: 'badge-draft', active: 'badge-active', finished: 'badge-finished' };
            document.getElementById('header-name').textContent = c.name;
            document.title = `${c.name} — Atlas`;
            document.getElementById('comp-card').innerHTML = `
                <h2>${esc(c.name)} <span class="badge ${badgeClass[c.status] || ''}">${c.status}</span></h2>
                <div class="meta">
                    <span><strong>Weapon:</strong> ${weaponLabel[c.weapon] || c.weapon}</span>
                    <span><strong>Gender:</strong> ${genderLabel[c.gender] || c.gender}</span>
                    <span><strong>Fencers:</strong> ${c.competitor_count}</span>
                </div>
                <div class="actions">
                    <a class="primary" href="/competitions/${c.id}/fencers">Manage Fencers</a>
                    <a class="primary" href="/competitions/${c.id}/fencers/roster" style="background:#1e8449">Roster / Presence</a>
                    <a class="primary" href="/competitions/${c.id}/results" style="background:#6c3483">Results</a>
                    ${c.status === 'draft'
                    ? `<button class="success" onclick="activate()">Activate Competition</button>
                           <button class="danger" onclick="deleteCompetition()" style="margin-left:0.7em">Delete Competition</button>`
                    : ''}
                    ${c.status === 'finished'
                    ? `<button class="danger" onclick="deleteCompetition(true)" style="margin-left:0.7em">Delete Competition</button>`
                    : ''}
                    ${c.status !== 'finished' && c.status !== 'draft'
                    ? `<button class="danger" onclick="finishCompetition()">Finish Competition</button>`
                    : ''}
                </div>
            `;
            document.getElementById('phases-card').style.display = '';
        }

        async function activate() {
            if (!confirm('Activate this competition? You will not be able to delete it.')) return;
            const r = await fetch(`/api/competitions/${compId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'active' })
            });
            if (r.ok) location.reload();
        }

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // Delete competition handler (global)
            async function deleteCompetition(isFinished) {
                let msg = 'Delete this competition? This cannot be undone.';
                if (isFinished) msg = 'Delete this finished competition? All results and history will be lost. This cannot be undone.';
                if (!confirm(msg)) return;
                const r = await fetch(`/api/competitions/${compId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (r.ok) window.location.href = '/competitions';
                else alert('Failed to delete competition. Only draft or finished competitions can be deleted.');
            }

            // Finish competition handler (global)
            async function finishCompetition() {
                if (!confirm('Finish this competition? All remaining active fencers will be marked as finished and final rankings assigned.')) return;
                const r = await fetch(`/api/competitions/${compId}/finish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (r.ok) location.reload();
                else alert('Failed to finish competition.');
            }
        }

        // -------------------------------------------------------------------
        // Alpine component: phase manager
        // -------------------------------------------------------------------
        function phaseMgr() {
            return {
                async simulatePhase(phaseId) {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/simulate`, { method: 'POST' });
                        const d = await r.json();
                        if (!r.ok || d.error) {
                            this.error = d.error || 'Failed to simulate results.';
                            return;
                        }
                        await this.loadPhases();
                        this.error = `Simulated results for ${d.updated} bout(s).`;
                    } finally {
                        this.busy = false;
                    }
                },
                reopenPhase: async function (phaseId) {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/reopen`, { method: 'POST' });
                        const d = await r.json();
                        if (!r.ok || d.error) {
                            this.error = d.error || 'Failed to reopen phase.';
                            return;
                        }
                        await this.loadPhases();
                        this.error = 'Phase reopened.';
                    } finally {
                        this.busy = false;
                    }
                },
                closePhase: async function (phaseId) {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/close`, { method: 'POST' });
                        const d = await r.json();
                        if (!r.ok || d.error) {
                            this.error = d.error || 'Failed to close phase.';
                            return;
                        }
                        await this.loadPhases();
                        if (d.eliminated !== undefined) {
                            this.error = `Phase closed. ${d.eliminated} fencer(s) eliminated.`;
                        } else {
                            this.error = 'Phase closed.';
                        }
                    } finally {
                        this.busy = false;
                    }
                },
                phases: [],
                rules: [],
                selectedRule: '',
                busy: false,
                error: '',
                pendingChoice: null,   // { phaseId, options: [[7,7,6], ...] }
                chosenOptionIdx: 0,
                blockSeedingDialog: null, // { phaseId, message, options }
                blockSeedingChoice: '',
                advancementChoiceDialog: null, // { phaseId, choices, label }
                chosenAdvancementIdx: 0,

                async init() {
                    await Promise.all([this.loadPhases(), this.loadRules()]);
                },

                async loadPhases() {
                    const r = await fetch(`/api/competitions/${compId}/phases`);
                    this.phases = await r.json();
                },

                async loadRules() {
                    const r = await fetch('/api/rules');
                    this.rules = await r.json();
                },

                async addPhase() {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ rule_doc: this.selectedRule }),
                        });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        this.selectedRule = '';
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                async generate(phaseId) {
                    this.error = '';
                    this.busy = true;
                    try {
                        // Fetch the rule for this phase to check for advancement prompt/choices
                        const phase = this.phases.find(p => p.id === phaseId);
                        let rule = null;
                        if (phase && phase.rule_doc) {
                            const ruleResp = await fetch(`/api/rules/${phase.rule_doc}`);
                            if (ruleResp.ok) rule = await ruleResp.json();
                        }
                        if (rule && rule.advancement && rule.advancement.prompt && Array.isArray(rule.advancement.choices)) {
                            // Deep clone choices and initialize _value/_roundTo for percentage
                            const clonedChoices = rule.advancement.choices.map(c => {
                                const cc = { ...c };
                                if (cc.method === 'percentage') {
                                    cc._value = cc.value;
                                    // Always define _roundTo for reactivity
                                    cc._roundTo = (typeof cc.roundTo !== 'undefined') ? cc.roundTo : '';
                                }
                                return cc;
                            });
                            this.advancementChoiceDialog = {
                                phaseId,
                                choices: clonedChoices,
                                label: rule.advancement.label || 'Select advancement option'
                            };
                            this.chosenAdvancementIdx = 0;
                            this.busy = false;
                            return;
                        }
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/generate`, { method: 'POST' });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        if (d.status === 'choose') {
                            this.pendingChoice = { phaseId, options: d.options };
                            this.chosenOptionIdx = 0;
                            return;
                        }
                        if (d.status === 'block-seeding-options') {
                            this.blockSeedingDialog = { phaseId, message: d.message, options: d.options };
                            this.blockSeedingChoice = '';
                            return;
                        }
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                async confirmAdvancementChoice() {
                    if (!this.advancementChoiceDialog) return;
                    const { phaseId, choices } = this.advancementChoiceDialog;
                    // Clone the selected choice to avoid mutating the rule
                    const selected = { ...choices[this.chosenAdvancementIdx] };
                    // Always copy user input for count and percentage
                    if (selected.method === 'count') {
                        if (selected._value && selected._value > 0) {
                            selected.value = selected._value;
                        }
                    } else if (selected.method === 'percentage') {
                        if (selected._value && selected._value > 0 && selected._value <= 100) {
                            selected.value = selected._value;
                        }
                        if (selected._roundTo && selected._roundTo > 1) {
                            selected.roundTo = selected._roundTo;
                        } else {
                            delete selected.roundTo;
                        }
                    }
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/generate`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ advancementChoice: selected })
                        });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        this.advancementChoiceDialog = null;
                        if (d.status === 'choose') {
                            this.pendingChoice = { phaseId, options: d.options };
                            this.chosenOptionIdx = 0;
                            return;
                        }
                        if (d.status === 'block-seeding-options') {
                            this.blockSeedingDialog = { phaseId, message: d.message, options: d.options };
                            this.blockSeedingChoice = '';
                            return;
                        }
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                cancelAdvancementChoice() {
                    this.advancementChoiceDialog = null;
                },
                async confirmBlockSeeding() {
                    if (!this.blockSeedingDialog || !this.blockSeedingChoice) return;
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${this.blockSeedingDialog.phaseId}/generate`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ blockChoice: this.blockSeedingChoice })
                        });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        this.blockSeedingDialog = null;
                        this.blockSeedingChoice = '';
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                cancelBlockSeeding() {
                    this.blockSeedingDialog = null;
                    this.blockSeedingChoice = '';
                },

                async confirmChoice() {
                    const { phaseId, options } = this.pendingChoice;
                    const poolSizes = options[this.chosenOptionIdx];
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/generate`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ poolSizes }),
                        });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        this.pendingChoice = null;
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                cancelChoice() {
                    this.pendingChoice = null;
                },

                describeOption(sizes) {
                    const counts = {};
                    sizes.forEach(s => counts[s] = (counts[s] || 0) + 1);
                    const parts = Object.entries(counts)
                        .sort((a, b) => b[0] - a[0])
                        .map(([s, c]) => `${c} pool${c > 1 ? 's' : ''} of ${s}`);
                    return parts.join(' + ') + ` (${sizes.length} pool${sizes.length > 1 ? 's' : ''} total)`;
                },

                async deletePhase(phaseId) {
                    if (!confirm('Delete this phase and all its pools/bouts?')) return;
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}`, { method: 'DELETE' });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },
            };
        }
    </script>
    </script>
    <script>
        // Delete competition handler (global)
        async function deleteCompetition(isFinished) {
            let msg = 'Delete this competition? This cannot be undone.';
            if (isFinished) msg = 'Delete this finished competition? All results and history will be lost. This cannot be undone.';
            if (!confirm(msg)) return;
            const r = await fetch(`/api/competitions/${compId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });
            if (r.ok) window.location.href = '/competitions';
            else alert('Failed to delete competition. Only draft or finished competitions can be deleted.');
        }

        // Finish competition handler (global)
        async function finishCompetition() {
            if (!confirm('Finish this competition? All remaining active fencers will be marked as finished and final rankings assigned.')) return;
            const r = await fetch(`/api/competitions/${compId}/finish`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            if (r.ok) location.reload();
            else alert('Failed to finish competition.');
        }
    </script>
</body>

</html>
