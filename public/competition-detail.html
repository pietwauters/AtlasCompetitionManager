<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Competition</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th{text-align:left;padding:.5rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd}
    td{padding:.5rem .75rem;border-bottom:1px solid #eee;vertical-align:middle}
    tr:hover td{background:#f9f9f9}
    .toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
    .toolbar input[type=search]{flex:1;min-width:160px;padding:.4rem .7rem;border:1px solid #ccc;border-radius:5px;font-size:.9rem}
    .badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:10px;font-weight:600;margin-right:.2rem}
    .badge-draft{background:#fef3cd;color:#856404}
    .badge-active{background:#d4edda;color:#155724}
    .badge-finished{background:#d6d8db;color:#383d41}
    .badge-registered{background:#d6eaf8;color:#1a6bab}
    .notice-bar{padding:.6rem 1rem;border-radius:5px;margin-bottom:1rem;font-size:.9rem}
    .notice-ok{background:#d5f5e3;color:#1e5631}
    .notice-err{background:#fde8e8;color:#922b21}
    .comp-header{display:flex;gap:1.5rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.25rem}
    .comp-header h2{margin:0}
    .comp-meta{font-size:.85rem;color:#555}
    .comp-meta span{margin-right:1rem}
    .seed-input{width:3.5rem;padding:.2rem .3rem;border:1px solid #ccc;border-radius:3px;font-size:.85rem;text-align:center}
    .elig-row.registered td{color:#aaa}
    .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
    @media(max-width:720px){.panel-grid{grid-template-columns:1fr}}
    .phase-row{display:flex;align-items:center;gap:.75rem;padding:.5rem 0;border-bottom:1px solid #eee;flex-wrap:wrap}
    .phase-row:last-child{border-bottom:none}
    .badge-pending{background:#fef3cd;color:#856404}
    .badge-finished{background:#d6d8db;color:#383d41}
    select.inline{padding:.35rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:.85rem}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/people.html">People</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <div class="card" x-show="comp">
    <div class="comp-header">
      <h2 x-text="comp?.name"></h2>
      <span class="badge" :class="'badge-'+(comp?.status||'')" x-text="comp?.status"></span>
      <a href="/tournaments.html" style="font-size:.85rem;color:#888">← Back to events</a>
      <a :href="'/checkin.html?id='+compId" style="font-size:.85rem;color:#1a6bab">✓ Check-in</a>
      <a :href="'/results.html?id='+compId" style="font-size:.85rem;color:#1a6bab">📋 Results</a>
    </div>
    <div class="comp-meta">
      <span x-text="{foil:'Foil',epee:'Épée',sabre:'Sabre'}[comp?.weapon]||comp?.weapon"></span>
      <span x-text="{M:'Men',F:'Women',X:'Mixed'}[comp?.gender]||comp?.gender"></span>
      <span x-text="comp?.date||'No date set'"></span>
      <span x-show="comp?.age_categories?.length">Age: <strong x-text="comp?.age_categories?.map(a=>a.code).join(', ')"></strong></span>
      <span x-show="comp?.tournament_name">Tournament: <strong x-text="comp?.tournament_name"></strong></span>
    </div>
    <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button @click="autoSeed()">⚡ Auto-seed by ranking</button>
      <button class="success" x-show="comp?.status==='draft'" @click="setStatus('active')">▶ Start competition</button>
      <button x-show="comp?.status==='active'" @click="setStatus('draft')">⏸ Back to draft</button>
      <button x-show="comp?.status==='active'"
              style="background:#fff3cd;color:#856404;border-color:#ffc107"
              @click="closeCompetition()">✓ Close competition</button>
      <button x-show="comp?.status==='finished'"
              style="background:#f8d7da;color:#721c24;border-color:#f5c6cb"
              @click="setStatus('active')">↩ Reopen competition</button>
    </div>
  </div>

  <!-- ── Phases ───────────────────────────────────── -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem">
      <h2 style="margin:0;flex:1">Rounds</h2>
      <button class="primary" @click="phaseFormOpen=!phaseFormOpen" x-show="comp?.status!=='finished'">+ New round</button>
    </div>

    <!-- Existing phases -->
    <div x-show="phases.length===0" style="color:#999;font-size:.9rem;padding:.5rem 0">No rounds yet.</div>
    <template x-for="ph in phases" :key="ph.id">
      <div class="phase-row">
        <span class="badge" :class="'badge-'+ph.status" x-text="ph.status"></span>
        <span style="font-size:.72rem;padding:.15rem .45rem;border-radius:10px;font-weight:600;background:#e8eaf6;color:#3949ab" x-text="ph.type==='de'?'DE':'Pool'"></span>
        <span style="font-weight:600;font-size:.9rem" x-text="ph.rule_doc.replace('.json','')"></span>
        <span x-show="ph.type!=='de'" style="font-size:.82rem;color:#666" x-text="'Pools: '+(ph.pool_count||0)+'  Bouts: '+(ph.bouts_complete||0)+'/'+(ph.bouts_total||0)"></span>
        <a :href="(ph.type==='de'?'/de.html':'/phase.html')+'?id='+ph.id" class="primary" style="display:inline-block;padding:.3rem .8rem;border-radius:4px;background:#1a6bab;color:#fff;text-decoration:none;font-size:.82rem">Open</a>
        <button class="danger" style="font-size:.8rem" @click="deletePhase(ph)">Delete</button>
      </div>
    </template>

    <!-- New phase form -->
    <div x-show="phaseFormOpen" style="margin-top:1rem;padding-top:1rem;border-top:1px solid #eee">
      <!-- Phase type selector -->
      <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
        <button :class="newPhaseType==='pool'?'primary':''" @click="newPhaseType='pool';poolOptions=null;chosenSizes=null;deOptions=null;newRuleDoc=''">Pool round</button>
        <button :class="newPhaseType==='de'?'primary':''" @click="newPhaseType='de';poolOptions=null;chosenSizes=null;deOptions=null;newRuleDoc=''">DE round</button>
      </div>

      <!-- Pool phase form -->
      <div x-show="newPhaseType==='pool'">
        <div style="display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap">
          <label style="font-size:.85rem;display:flex;flex-direction:column;gap:.2rem">Rule document
            <select class="inline" x-model="newRuleDoc" @change="poolOptions=null;chosenSizes=null">
              <option value="">— choose —</option>
              <template x-for="r in poolRules" :key="r.filename">
                <option :value="r.filename" x-text="r.description+' ('+r.filename+')'"></option>
              </template>
            </select>
          </label>
          <label style="font-size:.85rem;display:flex;flex-direction:column;gap:.2rem">Separation
            <select class="inline" x-model="poolSeparation">
              <option value="club">Club (local competitions)</option>
              <option value="nationality">Nationality (international)</option>
              <option value="nationality,club">Nationality + Club (FIE standard)</option>
              <option value="">None</option>
            </select>
          </label>
          <button @click="fetchPoolOptions()" :disabled="!newRuleDoc">Calculate pool options</button>
        </div>
        <div x-show="poolOptions" style="margin-top:.75rem">
          <div style="font-size:.85rem;color:#555;margin-bottom:.4rem"
               x-text="'For '+(poolOptions?.fencerCount||0)+' active competitors:'"></div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <template x-for="(opt, i) in poolOptions?.options||[]" :key="i">
              <button
                :class="chosenSizes===opt?'primary':''"
                @click="chosenSizes=opt"
                x-text="formatOption(opt) + (i===poolOptions?.recommended?' (recommended)':'')"
                style="font-size:.85rem">
              </button>
            </template>
          </div>
          <div style="margin-top:.75rem">
            <button class="success" :disabled="!chosenSizes" @click="createPhase()">Create pools</button>
          </div>
        </div>
      </div>

      <!-- DE phase form -->
      <div x-show="newPhaseType==='de'">
        <div style="display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap">
          <label style="font-size:.85rem;display:flex;flex-direction:column;gap:.2rem">Rule document
            <select class="inline" x-model="newRuleDoc" @change="deOptions=null">
              <option value="">— choose —</option>
              <template x-for="r in deRules" :key="r.filename">
                <option :value="r.filename" x-text="r.description+' ('+r.filename+')'"></option>
              </template>
            </select>
          </label>
          <button @click="fetchDeOptions()" :disabled="!newRuleDoc">Preview bracket</button>
        </div>
        <!-- Seeding method — only relevant when multiple pool phases exist -->
        <div x-show="deOptions && deOptions.finishedPoolPhases > 1"
             style="margin-top:.75rem;font-size:.85rem;display:flex;flex-direction:column;gap:.3rem">
          <strong style="font-size:.85rem">DE seeding</strong>
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
            <input type="radio" x-model="deSeedingMethod" value="last">
            Use last pool round ranking only
          </label>
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer">
            <input type="radio" x-model="deSeedingMethod" value="combined">
            Combined ranking across all pool rounds (aggregate V/M, indicator, touches)
          </label>
        </div>
        <div x-show="deOptions" style="margin-top:.75rem;font-size:.85rem;color:#555">
          <span x-text="deOptions?.N+' competitors → '+deOptions?.tableauSize+'-person tableau'"></span>
          <span x-show="deOptions?.byeCount>0" style="color:#856404;margin-left:.5rem"
                x-text="'('+deOptions?.byeCount+' bye'+(deOptions?.byeCount>1?'s':'')+' for top seed'+(deOptions?.byeCount>1?'s':'')+')'" ></span>
        </div>
        <div x-show="deOptions" style="margin-top:.75rem">
          <button class="success" :disabled="!newRuleDoc" @click="createDE()">Create DE bracket</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-grid">
    <!-- Registered competitors -->
    <div class="card">
      <h2 style="margin-top:0">
        Competitors
        <span style="font-weight:400;font-size:.85rem;color:#888" x-text="'('+competitors.length+')'"></span>
      </h2>
      <table>
        <thead><tr><th>Seed</th><th>Name</th><th>Club</th><th>Age</th><th></th></tr></thead>
        <tbody>
          <template x-for="c in competitors" :key="c.competitor_id">
            <tr>
              <td><input class="seed-input" type="number" min="1" :value="c.initial_seed||''" @change="updateSeed(c,$event.target.value)"></td>
              <td x-text="c.last_name+', '+c.first_name"></td>
              <td x-text="c.club_name||'—'"></td>
              <td x-text="calcAge(c.date_of_birth)"></td>
              <td><button class="danger" @click="removeCompetitor(c)">✕</button></td>
            </tr>
          </template>
          <tr x-show="competitors.length===0">
            <td colspan="5" style="text-align:center;color:#999;padding:1rem">No competitors yet. Add fencers from the right panel.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Eligible fencers -->
    <div class="card">
      <h2 style="margin-top:0">Add fencers</h2>
      <div class="toolbar">
        <select x-model="eligClub" style="flex:1;min-width:100px">
          <option value="">All clubs</option>
          <template x-for="c in eligClubs" :key="c"><option :value="c" x-text="c"></option></template>
        </select>
        <select x-model="eligGender">
          <option value="">All genders</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
          <option value="X">Mixed</option>
        </select>
        <select x-model="eligAge">
          <option value="">All ages</option>
          <template x-for="a in eligAges" :key="a"><option :value="a" x-text="a"></option></template>
        </select>
        <button class="primary" @click="addSelected()" :disabled="selectedIds.length===0"
          x-text="selectedIds.length?'Add '+selectedIds.length+' selected':'Select fencers'"></button>
      </div>
      <div style="margin-bottom:.5rem;font-size:.85rem">
        <label style="cursor:pointer">
          <input type="checkbox" @change="toggleSelectAll($event.target.checked)" :checked="allEligibleSelected()">
          Select all unregistered
        </label>
      </div>
      <table>
        <thead><tr>
          <th></th>
          <th @click="eligSort('name')" style="cursor:pointer;user-select:none">Name <span x-text="eligSortIcon('name')"></span></th>
          <th @click="eligSort('club')" style="cursor:pointer;user-select:none">Club <span x-text="eligSortIcon('club')"></span></th>
          <th @click="eligSort('age')"  style="cursor:pointer;user-select:none">Age  <span x-text="eligSortIcon('age')"></span></th>
          <th @click="eligSort('rank')" style="cursor:pointer;user-select:none">Ranking <span x-text="eligSortIcon('rank')"></span></th>
        </tr></thead>
        <tbody>
          <template x-for="f in filteredEligible" :key="f.fencer_id">
            <tr :class="'elig-row'+(f.is_registered?' registered':'')">
              <td>
                <template x-if="!f.is_registered">
                  <input type="checkbox" :checked="selectedIds.includes(f.fencer_id)" @change="toggleSelect(f.fencer_id,$event.target.checked)">
                </template>
                <span class="badge badge-registered" x-show="f.is_registered">✓ added</span>
              </td>
              <td x-text="f.last_name+', '+f.first_name"></td>
              <td x-text="f.club_name||'—'"></td>
              <td x-text="f.age||calcAge(f.date_of_birth)"></td>
              <td x-text="f.ranking||'—'"></td>
            </tr>
          </template>
          <tr x-show="filteredEligible.length===0">
            <td colspan="5" style="text-align:center;color:#999;padding:1rem">No eligible fencers found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
function app() {
  const compId = new URLSearchParams(window.location.search).get('id');
  return {
    compId, comp:null, competitors:[], eligible:[], selectedIds:[],
    eligClub:'', eligGender:'', eligAge:'', eligSortKey:'rank', eligSortDir:1,
    phases:[], poolRules:[], deRules:[], phaseFormOpen:false,
    newPhaseType:'pool', newRuleDoc:'', poolSeparation:'club',
    poolOptions:null, chosenSizes:null, deOptions:null, deSeedingMethod:'last',
    notice:{text:'',error:false},

    get eligClubs() {
      return [...new Set(this.eligible.map(f=>f.club_name).filter(Boolean))].sort();
    },
    get eligAges() {
      return [...new Set(this.eligible.map(f=>f.age).filter(Boolean))].sort((a,b)=>a-b);
    },
    get filteredEligible() {
      let list = this.eligible;
      if (this.eligClub)   list = list.filter(f => f.club_name === this.eligClub);
      if (this.eligGender) list = list.filter(f => f.gender === this.eligGender);
      if (this.eligAge)    list = list.filter(f => f.age == this.eligAge);
      const k = this.eligSortKey, d = this.eligSortDir;
      return [...list].sort((a,b) => {
        let av, bv;
        if (k==='name')  { av=a.last_name+a.first_name; bv=b.last_name+b.first_name; }
        else if (k==='club') { av=a.club_name||''; bv=b.club_name||''; }
        else if (k==='age')  { av=a.age||999; bv=b.age||999; }
        else                 { av=a.ranking||9999; bv=b.ranking||9999; }
        return av<bv ? -d : av>bv ? d : 0;
      });
    },
    eligSort(key) {
      if (this.eligSortKey===key) this.eligSortDir=-this.eligSortDir;
      else { this.eligSortKey=key; this.eligSortDir=1; }
    },
    eligSortIcon(key) {
      if (this.eligSortKey!==key) return '↕';
      return this.eligSortDir===1 ? '↑' : '↓';
    },

    async init() {
      if(!compId){this.showNotice('No competition ID in URL',true);return;}
      await Promise.all([this.loadComp(),this.loadCompetitors(),this.loadEligible(),this.loadPhases(),this.loadRules()]);
    },

    async loadComp() {
      this.comp=await fetch('/api/competitions/'+compId).then(r=>r.json());
      document.title='Atlas — '+(this.comp.name||'Competition');
    },
    async loadCompetitors() {
      this.competitors=await fetch('/api/competitions/'+compId+'/competitors').then(r=>r.json());
      this.competitors.sort((a,b)=>(a.initial_seed||999)-(b.initial_seed||999)||a.last_name.localeCompare(b.last_name));
    },
    async loadEligible() {
      this.eligible=await fetch('/api/competitions/'+compId+'/eligible-fencers').then(r=>r.json());
    },

    async addSelected() {
      if(!this.selectedIds.length)return;
      const r=await fetch('/api/competitions/'+compId+'/competitors/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fencer_ids:this.selectedIds})});
      const data=await r.json();
      if(!r.ok){this.showNotice(data.error||'Add failed',true);return;}
      this.showNotice('Added '+data.added+' fencer(s)');
      this.selectedIds=[];
      await Promise.all([this.loadCompetitors(),this.loadEligible()]);
    },

    async removeCompetitor(c) {
      if(!confirm('Remove '+c.first_name+' '+c.last_name+' from this competition?'))return;
      const r=await fetch('/api/competitions/'+compId+'/competitors/'+c.competitor_id,{method:'DELETE'});
      if(!r.ok){this.showNotice('Remove failed',true);return;}
      this.showNotice('Removed '+c.first_name+' '+c.last_name);
      await Promise.all([this.loadCompetitors(),this.loadEligible()]);
    },

    async updateSeed(c,value) {
      await fetch('/api/competitions/'+compId+'/competitors/'+c.competitor_id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({initial_seed:value?Number(value):null})});
      await this.loadCompetitors();
    },

    async autoSeed() {
      const r=await fetch('/api/competitions/'+compId+'/competitors/auto-seed',{method:'POST'});
      const data=await r.json();
      if(!r.ok){this.showNotice('Auto-seed failed',true);return;}
      this.showNotice('Seeds assigned for '+data.seeded+' competitor(s)');
      await this.loadCompetitors();
    },

    async setStatus(status) {
      await fetch('/api/competitions/'+compId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
      await this.loadComp();
    },

    async closeCompetition() {
      if (!confirm('Close this competition? It will be marked as finished and removed from the active dashboard. You can reopen it later.')) return;
      await this.setStatus('finished');
    },

    toggleSelect(id,checked){ if(checked){if(!this.selectedIds.includes(id))this.selectedIds.push(id);}else{this.selectedIds=this.selectedIds.filter(x=>x!==id);} },
    toggleSelectAll(checked){ this.selectedIds=checked?this.filteredEligible.filter(f=>!f.is_registered).map(f=>f.fencer_id):[]; },
    allEligibleSelected() { const u=this.filteredEligible.filter(f=>!f.is_registered); return u.length>0&&u.every(f=>this.selectedIds.includes(f.fencer_id)); },
    calcAge(dob){ if(!dob)return'—'; return new Date().getFullYear()-new Date(dob).getFullYear(); },
    async loadPhases() {
      this.phases = await fetch('/api/competitions/'+compId+'/phases').then(r=>r.json()).catch(()=>[]);
    },
    async loadRules() {
      const [pool, de] = await Promise.all([
        fetch('/api/rules?type=pool').then(r=>r.json()).catch(()=>[]),
        fetch('/api/rules?type=de').then(r=>r.json()).catch(()=>[]),
      ]);
      this.poolRules = pool;
      this.deRules   = de;
    },
    async fetchPoolOptions() {
      this.poolOptions=null; this.chosenSizes=null;
      const r = await fetch('/api/competitions/'+compId+'/phases/pool-options?rule_doc='+encodeURIComponent(this.newRuleDoc));
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Failed',true);return;}
      this.poolOptions = data;
      this.chosenSizes = data.options[data.recommended];
    },
    async fetchDeOptions() {
      this.deOptions = null;
      const r = await fetch('/api/competitions/'+compId+'/phases/de-options');
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error||'Failed', true); return; }
      this.deOptions = data;
    },
    async createDE() {
      const r = await fetch('/api/competitions/'+compId+'/phases/create-de', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ rule_doc: this.newRuleDoc, seeding_method: this.deSeedingMethod })
      });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error||'Create failed', true); return; }
      this.showNotice('DE bracket created');
      this.phaseFormOpen=false; this.deOptions=null; this.newRuleDoc='';
      await this.loadPhases();
    },
    async createPhase() {
      const sep = this.poolSeparation ? this.poolSeparation.split(',') : [];
      const r = await fetch('/api/competitions/'+compId+'/phases',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rule_doc:this.newRuleDoc, chosen_sizes:this.chosenSizes, separation:sep})
      });
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Create failed',true);return;}
      this.showNotice('Round created with '+this.chosenSizes.length+' pools');
      this.phaseFormOpen=false; this.poolOptions=null; this.chosenSizes=null; this.newRuleDoc='';
      await this.loadPhases();
    },
    async deletePhase(ph) {
      if(!confirm('Delete this round and all its pools and bouts?'))return;
      const r = await fetch('/api/competitions/'+compId+'/phases/'+ph.id,{method:'DELETE'});
      if(!r.ok){this.showNotice('Delete failed',true);return;}
      this.showNotice('Round deleted'); await this.loadPhases();
    },
    formatOption(opt) {
      const counts={};
      for(const s of opt) counts[s]=(counts[s]||0)+1;
      return Object.entries(counts).map(([s,n])=>n+'×'+s).join(' + ');
    },

    showNotice(text,error=false){ this.notice={text,error}; setTimeout(()=>{this.notice={text:'',error:false};},4000); },
  };
}
