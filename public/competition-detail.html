<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition — Atlas</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        header {
            background: #1a1a2e;
            color: #fff;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header a {
            color: #aad4f5;
            text-decoration: none;
            font-size: 0.9rem;
        }

        main {
            max-width: 860px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
        }

        h2 {
            margin-top: 0;
        }

        .meta {
            display: flex;
            gap: 2rem;
            font-size: .9rem;
            color: #555;
            margin-bottom: 1.2rem;
        }

        .meta span strong {
            color: #1a1a2e;
        }

        .badge {
            display: inline-block;
            padding: .15rem .55rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-draft {
            background: #e8ecf0;
            color: #555;
        }

        .badge-active {
            background: #d4efdf;
            color: #1e8449;
        }

        .badge-finished {
            background: #eaf0fb;
            color: #1a6bab;
        }

        .actions a,
        .actions button {
            display: inline-block;
            margin-right: .6rem;
            padding: .45rem 1rem;
            border-radius: 5px;
            font-size: .9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .actions a.primary {
            background: #1a6bab;
            color: #fff;
        }

        .actions a.primary:hover {
            background: #155594;
        }

        .actions button.success {
            background: #1e8449;
            color: #fff;
            border: none;
        }

        .actions button.success:hover {
            background: #196b3c;
        }

        .phases-placeholder {
            color: #888;
            font-style: italic;
        }

        .phase-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: .6rem 0;
            border-bottom: 1px solid #eee;
        }

        .phase-row:last-child {
            border-bottom: none;
        }

        .phase-row .label {
            flex: 1;
            font-size: .92rem;
        }

        .phase-row .label small {
            color: #888;
            margin-left: .4rem;
        }

        select,
        button {
            font-size: .9rem;
            padding: .4rem .8rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        button.primary {
            background: #1a6bab;
            color: #fff;
            border: none;
        }

        button.primary:hover {
            background: #155594;
        }

        button.success {
            background: #1e8449;
            color: #fff;
            border: none;
        }

        button.success:hover {
            background: #196b3c;
        }

        button.danger {
            background: #c0392b;
            color: #fff;
            border: none;
        }

        button.danger:hover {
            background: #a93226;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        .add-phase-form {
            display: flex;
            gap: .6rem;
            align-items: center;
            margin-top: 1rem;
        }

        .error-msg {
            color: #c0392b;
            font-size: .85rem;
            margin-top: .4rem;
        }
    </style>
</head>

<body>
    <header>
        <strong>Atlas</strong>
        <a href="/">Home</a>
        <a href="/competitions">Competitions</a>
        <span id="header-name" style="margin-left:auto;opacity:.7;font-size:.9rem"></span>
    </header>
    <main>
        <div class="card" id="comp-card">
            <div style="color:#888">Loading…</div>
        </div>

        <div class="card" x-data="phaseMgr()" x-init="init()" id="phases-card" style="display:none">
            <h3 style="margin-top:0">Phases</h3>

            <!-- Phase list -->
            <template x-if="phases.length === 0">
                <p class="phases-placeholder">No phases yet. Add one below.</p>
            </template>
            <template x-for="ph in phases" :key="ph.id">
                <div class="phase-row">
                    <div class="label">
                        <strong x-text="'Phase ' + ph.phase_order + ' — ' + ph.rule_doc"></strong>
                        <small x-text="'(' + ph.type + ', ' + (ph.pool_count ?? 0) + ' pools)'"></small>
                        <span class="badge" :class="'badge-' + ph.status" x-text="ph.status"
                            style="margin-left:.4rem"></span>
                    </div>
                    <a :href="'/competitions/' + compId + '/phases/' + ph.id"
                        style="padding:.35rem .8rem;background:#eaf0fb;color:#1a6bab;border-radius:5px;font-size:.85rem;text-decoration:none"
                        x-show="ph.pool_count > 0">View pools</a>
                    <button class="success" @click="generate(ph.id)" x-show="ph.status === 'pending'"
                        :disabled="busy">Generate pools</button>
                    <button class="danger" @click="deletePhase(ph.id)" x-show="ph.status !== 'finished'"
                        :disabled="busy">Delete</button>
                </div>
            </template>

            <!-- Add phase form -->
            <div class="add-phase-form">
                <select x-model="selectedRule">
                    <option value="">-- select rule --</option>
                    <template x-for="r in rules" :key="r.filename">
                        <option :value="r.filename" x-text="r.description + ' (' + r.filename + ')'"></option>
                    </template>
                </select>
                <button class="primary" @click="addPhase()" :disabled="!selectedRule || busy">Add Phase</button>
            </div>
            <p class="error-msg" x-text="error" x-show="error"></p>
        </div>
    </main>

    <script>
        const compId = location.pathname.split('/')[2];

        fetch(`/api/competitions/${compId}`)
            .then(r => r.json())
            .then(render)
            .catch(() => { document.getElementById('comp-card').innerHTML = '<p>Error loading competition.</p>'; });

        function render(c) {
            const weaponLabel = { foil: 'Foil', epee: 'Épée', sabre: 'Sabre' };
            const genderLabel = { M: 'Men', F: 'Women', X: 'Mixed' };
            const badgeClass = { draft: 'badge-draft', active: 'badge-active', finished: 'badge-finished' };
            document.getElementById('header-name').textContent = c.name;
            document.title = `${c.name} — Atlas`;
            document.getElementById('comp-card').innerHTML = `
        <h2>${esc(c.name)} <span class="badge ${badgeClass[c.status] || ''}">${c.status}</span></h2>
        <div class="meta">
          <span><strong>Weapon:</strong> ${weaponLabel[c.weapon] || c.weapon}</span>
          <span><strong>Gender:</strong> ${genderLabel[c.gender] || c.gender}</span>
          <span><strong>Fencers:</strong> ${c.competitor_count}</span>
        </div>
        <div class="actions">
          <a class="primary" href="/competitions/${c.id}/fencers">Manage Fencers</a>
          ${c.status === 'draft'
                    ? `<button class="success" onclick="activate()">Activate Competition</button>`
                    : ''}
        </div>
      `;
            document.getElementById('phases-card').style.display = '';
        }

        async function activate() {
            if (!confirm('Activate this competition? You will not be able to delete it.')) return;
            const r = await fetch(`/api/competitions/${compId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'active' })
            });
            if (r.ok) location.reload();
        }

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // -------------------------------------------------------------------
        // Alpine component: phase manager
        // -------------------------------------------------------------------
        function phaseMgr() {
            return {
                phases: [],
                rules: [],
                selectedRule: '',
                busy: false,
                error: '',

                async init() {
                    await Promise.all([this.loadPhases(), this.loadRules()]);
                },

                async loadPhases() {
                    const r = await fetch(`/api/competitions/${compId}/phases`);
                    this.phases = await r.json();
                },

                async loadRules() {
                    const r = await fetch('/api/rules');
                    this.rules = await r.json();
                },

                async addPhase() {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ rule_doc: this.selectedRule }),
                        });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        this.selectedRule = '';
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                async generate(phaseId) {
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}/generate`, { method: 'POST' });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },

                async deletePhase(phaseId) {
                    if (!confirm('Delete this phase and all its pools/bouts?')) return;
                    this.error = '';
                    this.busy = true;
                    try {
                        const r = await fetch(`/api/competitions/${compId}/phases/${phaseId}`, { method: 'DELETE' });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error; return; }
                        await this.loadPhases();
                    } finally {
                        this.busy = false;
                    }
                },
            };
        }
    </script>
</body>

</html>
