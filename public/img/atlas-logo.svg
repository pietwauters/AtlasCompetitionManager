<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 111">

  <!-- Sphere -->
  <circle cx="202" cy="48" r="43" fill="#1a2c5e"/>
  <!-- Highlight: small rotated ellipse, upper-left of sphere -->
  <ellipse cx="187" cy="31" rx="12" ry="8" fill="white" opacity="0.8"
           transform="rotate(-15 187 31)"/>

  <!-- Fencer -->
  <!-- Head -->
  <circle cx="38" cy="19" r="6" fill="#1a2c5e"/>
  <!-- Torso: shoulder to hip, leaning forward -->
  <line x1="42" y1="25" x2="60" y2="52"
        stroke="#1a2c5e" stroke-width="5" stroke-linecap="round"/>
  <!-- Sword arm: shoulder to grip -->
  <line x1="50" y1="33" x2="88" y2="35"
        stroke="#1a2c5e" stroke-width="4" stroke-linecap="round"/>
  <!-- Foil guard (disc at grip) -->
  <circle cx="91" cy="35" r="3.5" fill="#1a2c5e"/>
  <!-- Foil blade: guard to sphere surface -->
  <line x1="94" y1="35" x2="159" y2="45"
        stroke="#1a2c5e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Front leg: lunge forward -->
  <polyline points="60,52 78,64 86,80"
            stroke="#1a2c5e" stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>
  <!-- Back leg: extended rearward -->
  <polyline points="60,52 47,63 34,78"
            stroke="#1a2c5e" stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>

  <!-- Decorative arc below fencer -->
  <path d="M 18 88 Q 90 103 165 83"
        stroke="#1a2c5e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

</svg>
