<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Tournaments & Competitions</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       class="nav-comp-link"></a>
  </template>
  <div class="nav-right">
    <a href="/tournaments.html">Events</a>
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main class="layout-data">
  <div class="notice-bar notice-ok" x-show="notice.text && !notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text &&  notice.error" x-text="notice.text"></div>

  <div class="tabs">
    <button class="tab" :class="{active:tab==='competitions'}" @click="tab='competitions'">Competitions</button>
    <button class="tab" :class="{active:tab==='tournaments'}"  @click="tab='tournaments'">Tournaments</button>
  </div>

  <!-- COMPETITIONS -->
  <div x-show="tab==='competitions'">
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;flex:1">Competitions</h2>
        <label><input type="checkbox" x-model="hideFinished"> Hide finished</label>
        <button @click="openFieImport()">Import FIE XML</button>
        <button class="primary" @click="openCompForm()">+ New competition</button>
      </div>
      <table class="table-responsive">
        <thead><tr><th>Name</th><th>Weapon</th><th>Gender</th><th>Age categories</th><th>Date</th><th>Tournament</th><th>Fencers</th>
          <th title="In preparation / Running are derived live from fencer check-in and phase activity — not a stored flag. Closed/Archived are set by the director.">Status</th>
        <th></th></tr></thead>
        <tbody>
          <template x-for="c in visibleCompetitions" :key="c.id">
            <tr>
              <td data-label="Name"><a class="comp-link" :href="'/competition-detail.html?id='+c.id" x-text="c.name"></a></td>
              <td data-label="Weapon" x-text="c.weapon"></td>
              <td data-label="Gender" x-text="c.gender"></td>
              <td data-label="Age categories" x-text="c.age_cats||'—'"></td>
              <td data-label="Date" x-text="c.date||'—'"></td>
              <td data-label="Tournament" x-text="c.tournament_name||'—'"></td>
              <td data-label="Fencers" x-text="c.competitor_count"></td>
              <td data-label="Status"><span class="badge" :class="compStage(c).cls" x-text="compStage(c).label"></span></td>
              <td data-label="">
                <div class="row-actions">
                  <button @click="editComp(c)">Edit</button>
                  <button x-show="c.status!=='archived'" @click="archiveComp(c)" title="Hide this competition without deleting its data">Archive</button>
                  <button x-show="c.status==='archived'" @click="restoreComp(c)" title="Unhide this competition">Restore</button>
                  <button class="danger" @click="deleteComp(c)">Delete</button>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="visibleCompetitions.length===0"><td colspan="9" style="text-align:center;color:#999;padding:1.5rem">No competitions yet.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="modal-backdrop" x-show="fieImportOpen" @click.self="fieImportOpen=false">
      <div class="modal-box">
        <h2 style="margin:0 0 1rem">Import FIE XML</h2>
        <div class="form-grid">
          <div class="full" style="display:flex;flex-direction:column;gap:.2rem;font-size:.85rem">
            XML file *
            <input type="file" accept=".xml" @change="fieReadFile($event)" style="padding:.3rem 0;font-size:.9rem">
            <span x-show="fieForm.fileName" x-text="'Selected: '+fieForm.fileName" style="font-size:.8rem;color:#555"></span>
          </div>
          <label>Attach to existing tournament (optional)
            <select x-model="fieForm.tournamentId">
              <option value="">— Auto-create from XML —</option>
              <template x-for="t in tournaments" :key="t.id">
                <option :value="t.id" x-text="t.name"></option>
              </template>
            </select>
          </label>
          <div class="form-actions">
            <button class="primary" @click="submitFieImport()" :disabled="fieImportLoading || !fieForm.xmlText"
              x-text="fieImportLoading ? 'Importing…' : 'Import'"></button>
            <button @click="fieImportOpen=false">Cancel</button>
          </div>
          <div class="full" x-show="fieImportResult" style="background:#d5f5e3;color:#1e5631;padding:.75rem 1rem;border-radius:5px;font-size:.9rem">
            <div>
              <strong x-text="(fieImportResult?.created||0)+' created, '+(fieImportResult?.updated||0)+' updated'"></strong>
              <span x-show="fieImportResult?.skipped" x-text="' · '+(fieImportResult?.skipped)+' skipped'"></span>
            </div>
            <div x-show="fieImportResult?.warnings?.length" style="margin-top:.4rem;color:#856404">
              <template x-for="w in (fieImportResult?.warnings||[])" :key="w">
                <div x-text="w"></div>
              </template>
            </div>
            <div style="margin-top:.5rem">
              <a class="comp-link" :href="'/competition-detail.html?id='+fieImportResult?.competition_id">Go to competition →</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" x-show="compFormOpen" @click.self="compFormOpen=false">
    <div class="modal-box">
      <h2 x-text="compForm.id?'Edit competition':'New competition'" style="margin:0 0 1rem"></h2>
      <div class="form-grid">
        <label class="full">Name * <input x-model="compForm.name" placeholder="U17 Foil Men"></label>
        <label>Weapon * <select x-model="compForm.weapon"><option value="">—</option><option value="foil">Foil</option><option value="epee">Épée</option><option value="sabre">Sabre</option></select></label>
        <label>Gender * <select x-model="compForm.gender"><option value="">—</option><option value="M">Male</option><option value="F">Female</option><option value="X">Mixed / Open</option></select></label>
        <label>Date <input type="date" x-model="compForm.date"></label>
        <label>Tournament (optional) <select x-model="compForm.tournament_id"><option value="">— Standalone —</option><template x-for="t in tournaments" :key="t.id"><option :value="t.id" x-text="t.name"></option></template></select></label>
        <label style="flex-direction:row;align-items:center;gap:.4rem;cursor:pointer">
          <input type="checkbox" x-model="compForm.is_team">
          Team competition
        </label>
        <div class="section-title">Age categories</div>
        <div class="full" style="display:flex;flex-wrap:wrap;gap:.5rem">
          <template x-for="ac in ageCategories" :key="ac.id">
            <label style="flex-direction:row;align-items:center;gap:.3rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" :checked="compForm.age_category_ids.includes(ac.id)" @change="toggleAgeCat(ac.id,$event.target.checked)">
              <span x-text="ac.label + (ac.max_age?' (≤'+ac.max_age+'yr)':'') + (ac.min_age?' (≥'+ac.min_age+'yr)':'')"></span>
            </label>
          </template>
        </div>
        <div class="form-actions">
          <button class="primary" @click="saveComp()">Save</button>
          <button @click="compFormOpen=false">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOURNAMENTS -->
  <div x-show="tab==='tournaments'">
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;flex:1">Tournaments</h2>
        <button class="primary" @click="openTournForm()">+ New tournament</button>
      </div>
      <div x-show="tournaments.length===0" style="color:#999;font-size:.9rem;padding:.5rem 0">No tournaments yet.</div>
      <template x-for="t in tournamentGroups" :key="t.id">
        <div style="border:1px solid #ddd;border-radius:6px;margin-bottom:1rem;overflow:hidden">
          <!-- Tournament header -->
          <div style="background:#f0f2f5;padding:.6rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
            <strong x-text="t.name" style="font-size:1rem;flex:1"></strong>
            <span style="font-size:.82rem;color:#555" x-show="t.city" x-text="t.city"></span>
            <span style="font-size:.82rem;color:#555" x-show="t.date_start" x-text="formatDates(t)"></span>
            <span style="font-size:.82rem;color:#555" x-show="t.level" x-text="t.level"></span>
            <span class="badge" :class="'badge-'+t.status" x-text="t.status"></span>
            <a :href="'/schedule-planner.html?tournament_id='+t.id" style="font-size:.82rem">📅 Schedule planner</a>
            <button @click="editTourn(t)" style="font-size:.82rem">Edit</button>
            <button class="danger" @click="deleteTourn(t)" style="font-size:.82rem">Delete</button>
          </div>
          <!-- Competitions inside this tournament -->
          <div x-show="t.competitions.length===0" style="padding:.75rem 1rem;font-size:.85rem;color:#999">No competitions linked to this tournament.</div>
          <table class="table-responsive" x-show="t.competitions.length>0" style="margin:0">
            <thead><tr>
              <th>Name</th><th>Weapon</th><th>Gender</th><th>Age</th><th>Date</th><th>Fencers</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>
              <template x-for="c in t.competitions" :key="c.id">
                <tr>
                  <td data-label="Name"><a class="comp-link" :href="'/competition-detail.html?id='+c.id" x-text="c.name"></a></td>
                  <td data-label="Weapon" x-text="c.weapon"></td>
                  <td data-label="Gender" x-text="c.gender"></td>
                  <td data-label="Age" x-text="c.age_cats||'—'"></td>
                  <td data-label="Date" x-text="c.date||'—'"></td>
                  <td data-label="Fencers" x-text="c.competitor_count"></td>
                  <td data-label="Status"><span class="badge" :class="compStage(c).cls" x-text="compStage(c).label"></span></td>
                  <td data-label="">
                    <button @click="editComp(c);tab='competitions'">Edit</button>
                    <button @click="archiveComp(c)" title="Hide without deleting">Archive</button>
                    <button class="danger" @click="deleteComp(c)">Delete</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </div>
  <div class="modal-backdrop" x-show="tournFormOpen" @click.self="tournFormOpen=false">
    <div class="modal-box">
      <h2 x-text="tournForm.id?'Edit tournament':'New tournament'" style="margin:0 0 1rem"></h2>
      <div class="form-grid">
        <label class="full">Name * <input x-model="tournForm.name" placeholder="Spring Cup 2026"></label>
        <label>City <input x-model="tournForm.city" placeholder="Brussels"></label>
        <label>Country <input x-model="tournForm.country" placeholder="BEL"></label>
        <label>Start date <input type="date" x-model="tournForm.date_start"></label>
        <label>End date <input type="date" x-model="tournForm.date_end"></label>
        <label>Organizer <input x-model="tournForm.organizer"></label>
        <label>Level <input x-model="tournForm.level" placeholder="Regional, National…"></label>
        <div class="form-actions">
          <button class="primary" @click="saveTourn()">Save</button>
          <button @click="tournFormOpen=false">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
function app() {
  return {
    tab:'competitions', competitions:[], tournaments:[], ageCategories:[],
    fieImportOpen:false, fieImportLoading:false, fieImportResult:null,
    fieForm:{ tournamentId:'', xmlText:'', fileName:'' },

    get tournamentGroups() {
      return this.tournaments.map(t => ({
        ...t,
        competitions: this.visibleCompetitions.filter(c => c.tournament_id === t.id),
      }));
    },
    get visibleCompetitions() {
      if (!this.hideFinished) return this.competitions;
      return this.competitions.filter(c => c.status !== 'finished' && c.status !== 'archived');
    },
    notice:{text:'',error:false},
    hideFinished:true,
    compFormOpen:false, compForm:{id:null,name:'',weapon:'',gender:'',date:'',tournament_id:'',age_category_ids:[],is_team:false},
    tournFormOpen:false, tournForm:{id:null,name:'',city:'',country:'',date_start:'',date_end:'',organizer:'',level:''},

    async init() { await Promise.all([this.loadComps(),this.loadTourns(),this.loadAgeCats()]); },

    async loadComps() {
      const list = await fetch('/api/competitions?include_archived=1').then(r=>r.json());
      this.competitions = list.map(c => ({...c, age_cats: c.age_categories?.map(a=>a.code).join(', ')||''}));
    },
    // Derived, live display stage — not the raw stored status. "In preparation"
    // and "Running" both map to status='active'; the nav bar's own "running"
    // list uses the same fencer-check-in signal (see Competition.running()).
    compStage(c) {
      if (c.status === 'archived') return { label: 'Archived',      cls: 'badge-archived' };
      if (c.status === 'finished') return { label: 'Closed',        cls: 'badge-finished' };
      if (c.checked_in_count > 0)  return { label: 'Running',       cls: 'badge-active'   };
      return                              { label: 'In preparation', cls: 'badge-pending'  };
    },
    async loadTourns() { this.tournaments = await fetch('/api/tournaments').then(r=>r.json()); },
    async loadAgeCats() { this.ageCategories = await fetch('/api/age-categories').then(r=>r.json()); },

    openFieImport() {
      this.fieForm={ tournamentId:'', xmlText:'', fileName:'' };
      this.fieImportResult=null;
      this.fieImportOpen=true;
      this.compFormOpen=false;
    },
    fieReadFile(evt) {
      const file=evt.target.files[0];
      if(!file)return;
      this.fieForm.fileName=file.name;
      const reader=new FileReader();
      reader.onload=e=>{ this.fieForm.xmlText=e.target.result; };
      reader.readAsText(file);
    },
    async submitFieImport() {
      if(!this.fieForm.xmlText){this.showNotice('Select an XML file first',true);return;}
      this.fieImportLoading=true; this.fieImportResult=null;
      const body={xml:this.fieForm.xmlText};
      if(this.fieForm.tournamentId) body.tournament_id=Number(this.fieForm.tournamentId);
      const r=await fetch('/api/fie/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      this.fieImportLoading=false;
      const data=await r.json();
      if(!r.ok){this.showNotice(data.error||'Import failed',true);return;}
      this.fieImportResult=data;
      await Promise.all([this.loadComps(),this.loadTourns()]);
    },

    openCompForm() { this.compForm={id:null,name:'',weapon:'',gender:'',date:'',tournament_id:'',age_category_ids:[],is_team:false}; this.compFormOpen=true; },
    editComp(c) {
      this.compForm={id:c.id,name:c.name,weapon:c.weapon,gender:c.gender,date:c.date||'',tournament_id:c.tournament_id||'',age_category_ids:c.age_categories?.map(a=>a.id)||[],is_team:!!c.is_team};
      this.compFormOpen=true;
    },
    toggleAgeCat(id,checked) {
      if(checked){if(!this.compForm.age_category_ids.includes(id))this.compForm.age_category_ids.push(id);}
      else{this.compForm.age_category_ids=this.compForm.age_category_ids.filter(x=>x!==id);}
    },
    async saveComp() {
      const body={name:this.compForm.name,weapon:this.compForm.weapon,gender:this.compForm.gender,date:this.compForm.date||null,tournament_id:this.compForm.tournament_id||null,age_category_ids:this.compForm.age_category_ids,is_team:this.compForm.is_team?1:0};
      const url=this.compForm.id?'/api/competitions/'+this.compForm.id:'/api/competitions';
      const method=this.compForm.id?'PATCH':'POST';
      const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await r.json();
      if(!r.ok){this.showNotice(data.error||'Save failed',true);return;}
      this.showNotice('Saved: '+data.name);
      this.compFormOpen=false;
      await this.loadComps();
    },
    async archiveComp(c) {
      if(!confirm('Archive "'+c.name+'"?\nIt will be hidden from this list. Data is preserved.'))return;
      const r=await fetch('/api/competitions/'+c.id+'/archive',{method:'POST'});
      if(!r.ok){this.showNotice('Archive failed',true);return;}
      this.showNotice('Archived '+c.name); await this.loadComps();
    },
    async restoreComp(c) {
      const r=await fetch('/api/competitions/'+c.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'active'})});
      if(!r.ok){this.showNotice('Restore failed',true);return;}
      this.showNotice('Restored '+c.name); await this.loadComps();
    },
    async deleteComp(c) {
      if(!confirm('Permanently delete "'+c.name+'"?\nThis removes ALL data: competitors, phases, bouts. This cannot be undone.'))return;
      const r=await fetch('/api/competitions/'+c.id,{method:'DELETE'});
      if(!r.ok){this.showNotice('Delete failed',true);return;}
      this.showNotice('Deleted '+c.name); await this.loadComps();
    },

    openTournForm() { this.tournForm={id:null,name:'',city:'',country:'',date_start:'',date_end:'',organizer:'',level:''}; this.tournFormOpen=true; },
    editTourn(t) { this.tournForm={id:t.id,name:t.name,city:t.city||'',country:t.country||'',date_start:t.date_start||'',date_end:t.date_end||'',organizer:t.organizer||'',level:t.level||''}; this.tournFormOpen=true; },
    async saveTourn() {
      const url=this.tournForm.id?'/api/tournaments/'+this.tournForm.id:'/api/tournaments';
      const method=this.tournForm.id?'PATCH':'POST';
      const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(this.tournForm)});
      const data=await r.json();
      if(!r.ok){this.showNotice(data.error||'Save failed',true);return;}
      this.showNotice('Saved: '+data.name); this.tournFormOpen=false;
      await Promise.all([this.loadTourns(),this.loadComps()]);
    },
    async deleteTourn(t) {
      if(!confirm('Delete "'+t.name+'"? Competitions will become standalone.'))return;
      const r=await fetch('/api/tournaments/'+t.id,{method:'DELETE'});
      if(!r.ok){this.showNotice('Delete failed',true);return;}
      this.showNotice('Deleted '+t.name); await Promise.all([this.loadTourns(),this.loadComps()]);
    },

    formatDates(t) {
      if(!t.date_start&&!t.date_end)return'—';
      if(t.date_start===t.date_end||!t.date_end)return t.date_start;
      return t.date_start+' → '+t.date_end;
    },
    showNotice(text,error=false){ this.notice={text,error}; setTimeout(()=>{this.notice={text:'',error:false};},4000); },
  };
}
</script>
<script src="/js/nav.js"></script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
