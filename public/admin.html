<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/people.html">People</a>
    <a href="/admin.html" style="color:#aad4f5">Admin</a>
  </div>
</header>
<main>
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem">
      <h2 style="margin:0">MQTT Broker</h2>
      <span class="badge" :class="status.connected?'badge-connected':'badge-disconnected'"
            x-text="status.connected?'Connected':'Disconnected'"></span>
      <span x-show="status.connected" style="font-size:.82rem;color:#555" x-text="status.brokerUrl"></span>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
      <input type="text" x-model="brokerUrl" placeholder="mqtt://openpiste.local:1883"
             style="flex:1;min-width:16rem">
      <button class="primary" x-show="!status.connected" @click="connect()">Connect</button>
      <button x-show="status.connected" @click="disconnect()"
              style="background:#fde8e8;color:#922b21;border-color:#f5c2c7">Disconnect</button>
      <button @click="saveSettings()" style="background:#f0f2f5">Save</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 .75rem">Match flow</h2>
    <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
      <input type="checkbox" x-model="autoNextOnEnd" @change="saveSettings()" style="width:1rem;height:1rem">
      Automatically send next match after END is acknowledged
    </label>
    <div style="font-size:.8rem;color:#888;margin-top:.3rem;margin-left:1.6rem">
      When enabled, the next bout loads on the apparatus as soon as the score is confirmed —
      the referee does not need to press NEXT between bouts.
    </div>
  </div>
</main>
<script src="/js/nav.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function app() {
  return {
    notice: { text: '', error: false },
    status: { connected: false, brokerUrl: '', pistes: [] },
    brokerUrl: '',
    autoNextOnEnd: false,

    async init() {
      const s = await fetch('/api/opp2/settings').then(r => r.json()).catch(() => ({}));
      this.brokerUrl    = s.broker_url || 'mqtt://openpiste.local:1883';
      this.autoNextOnEnd = s.auto_next_on_end || false;
      await this.loadStatus();
      setInterval(() => this.loadStatus(), 5000);
    },

    async loadStatus() {
      const s = await fetch('/api/opp2/status').then(r => r.json()).catch(() => ({ connected: false, pistes: [] }));
      this.status = s;
    },

    async connect() {
      const r = await fetch('/api/opp2/connect', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ broker_url: this.brokerUrl }),
      });
      const d = await r.json();
      if (!r.ok) { this.showNotice(d.error || 'Connect failed', true); return; }
      this.showNotice('Connecting to ' + this.brokerUrl);
      await this.loadStatus();
    },

    async disconnect() {
      await fetch('/api/opp2/disconnect', { method: 'POST' });
      this.showNotice('Disconnected');
      await this.loadStatus();
    },

    async saveSettings() {
      await fetch('/api/opp2/settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ broker_url: this.brokerUrl, auto_next_on_end: this.autoNextOnEnd }),
      });
      this.showNotice('Settings saved');
    },

    showNotice(text, error = false) {
      this.notice = { text, error };
      setTimeout(() => { this.notice = { text: '', error: false }; }, 3000);
    },
  };
}
</script>
</body>
</html>
