<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .section-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
                   color:#888;margin:1.5rem 0 .6rem}
    .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .comp-card{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);
               border-left:4px solid #1a6bab;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.5rem}
    .comp-card.de{border-left-color:#8e44ad}
    .comp-card h3{margin:0;font-size:1rem}
    .comp-meta{font-size:.8rem;color:#888}
    .progress-wrap{display:flex;align-items:center;gap:.5rem}
    .progress-bar{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;background:#1e8449;border-radius:3px;transition:width .3s}
    .progress-fill.de{background:#8e44ad}
    .progress-label{font-size:.78rem;color:#555;white-space:nowrap}
    .open-btn{display:inline-block;margin-top:.25rem;padding:.35rem .9rem;background:#1a6bab;
              color:#fff;border-radius:5px;text-decoration:none;font-size:.85rem;font-weight:600;
              align-self:flex-start}
    .open-btn:hover{background:#155a9a}
    .open-btn.de{background:#8e44ad}
    .open-btn.de:hover{background:#7d3c98}

    .piste-grid{display:flex;flex-wrap:wrap;gap:.6rem}
    .piste-pill{display:flex;align-items:center;gap:.4rem;padding:.35rem .7rem;
                background:#f0f2f5;border-radius:6px;font-size:.82rem}
    .piste-pill.fencing{background:#eaf6ee;border:1px solid #b7e4c7}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .dot-on{background:#1e8449}
    .dot-off{background:#ccc}

    .upcoming-list{display:flex;flex-direction:column;gap:.5rem}
    .upcoming-row{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;
                  background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .upcoming-row a{font-size:.82rem;color:#1a6bab;text-decoration:none;margin-left:auto}
    .upcoming-row a:hover{text-decoration:underline}
    .empty-note{color:#aaa;font-size:.88rem;padding:.5rem 0}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>

  <!-- ── Active competitions ─────────────────────────────────────────────── -->
  <div class="section-title">Active competitions</div>
  <template x-if="active.length === 0 && upcoming.length === 0 && between.length === 0">
    <div style="background:#fff;border-radius:8px;padding:1.5rem 1.25rem;box-shadow:0 2px 6px rgba(0,0,0,.08);
                display:flex;flex-direction:column;gap:.75rem;max-width:420px">
      <div style="font-size:.95rem;color:#555">No competitions running right now.</div>
      <a href="/tournaments.html" style="display:inline-block;padding:.45rem 1rem;background:#1a6bab;
         color:#fff;border-radius:5px;text-decoration:none;font-size:.9rem;font-weight:600;align-self:flex-start">
        → Go to Events to start one
      </a>
    </div>
  </template>
  <div class="comp-grid">
    <template x-for="c in active" :key="c.phase_id">
      <div class="comp-card" :class="c.phase_type==='de'?'de':''">
        <h3 x-text="c.name"></h3>
        <div class="comp-meta"
          x-text="weaponLabel(c.weapon)+' · '+genderLabel(c.gender)+' · '+(c.phase_type==='pool'?'Pool round':'DE phase')">
        </div>
        <template x-if="c.progress && c.progress.total > 0">
          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill" :class="c.phase_type==='de'?'de':''"
                :style="'width:'+Math.round(c.progress.done/c.progress.total*100)+'%'"></div>
            </div>
            <span class="progress-label" x-text="c.progress.done+' / '+c.progress.total+' bouts'"></span>
          </div>
        </template>
        <template x-if="c.phase_type==='de' && c.progress?.current_round">
          <div class="comp-meta" x-text="'Round '+c.progress.current_round+' of '+c.progress.max_round"></div>
        </template>
        <a :href="phaseLink(c)" class="open-btn" :class="c.phase_type==='de'?'de':''">→ Open</a>
      </div>
    </template>
    <template x-for="c in between" :key="c.id">
      <div class="comp-card" style="border-left-color:#e67e22">
        <h3 x-text="c.name"></h3>
        <div class="comp-meta" x-text="weaponLabel(c.weapon)+' · '+genderLabel(c.gender)+' · Between phases'"></div>
        <a :href="'/competition-detail.html?id='+c.id" class="open-btn" style="background:#e67e22">→ Set up next phase</a>
      </div>
    </template>
  </div>

  <!-- ── Live pistes ─────────────────────────────────────────────────────── -->
  <template x-if="pisteStatus.pistes && pisteStatus.pistes.length">
    <div>
      <div class="section-title">Live pistes</div>
      <div class="piste-grid">
        <template x-for="p in pisteStatus.pistes" :key="p.pisteId">
          <div class="piste-pill" :class="p.bout?'fencing':''">
            <span class="dot" :class="p.apparatusOnline?'dot-on':'dot-off'"></span>
            <strong x-text="p.pisteId"></strong>
            <template x-if="p.bout">
              <span x-text="'#'+p.bout.bout_order+' '+p.bout.left+' — '+p.bout.right"></span>
            </template>
            <template x-if="!p.bout">
              <span style="color:#aaa">idle</span>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ── Upcoming ────────────────────────────────────────────────────────── -->
  <template x-if="upcoming.length > 0">
    <div>
      <div class="section-title">Upcoming</div>
      <div class="upcoming-list">
        <template x-for="c in upcoming" :key="c.phase_id">
          <div class="upcoming-row">
            <span x-text="c.name"></span>
            <span class="comp-meta" x-text="weaponLabel(c.weapon)+' · '+(c.phase_type==='pool'?'Pool round':'DE phase')"></span>
            <a :href="'/competition-detail.html?id='+c.id">Set up →</a>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ── Setup links ────────────────────────────────────────────────────── -->
  <div style="margin-top:2rem;padding-top:1rem;border-top:1px solid #e5e5e5;
              display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.82rem;color:#888">
    <span>Setup:</span>
    <a href="/people.html" style="color:#888">People &amp; fencers</a>
    <a href="/tournaments.html" style="color:#888">Events &amp; competitions</a>
    <a href="/strips.html" style="color:#888">Strips / Pistes</a>
    <a href="/opp2.html" style="color:#888">Schedule</a>
  </div>

</main>
<script src="/js/nav.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function app() {
  return {
    active: [], upcoming: [], between: [],
    pisteStatus: { connected: false, pistes: [] },

    async init() {
      await Promise.all([ this.loadComps(), this.loadPistes() ]);
      setInterval(() => this.loadPistes(), 4000);
      setInterval(() => this.loadComps(), 20000);

      const es = new EventSource('/api/opp2/piste-events');
      window.addEventListener('beforeunload', () => es.close());
      es.addEventListener('piste-state', e => {
        const update = JSON.parse(e.data);
        if (!this.pisteStatus.pistes) return;
        const idx = this.pisteStatus.pistes.findIndex(p => p.pisteId === update.pisteId);
        if (idx >= 0) this.pisteStatus.pistes[idx] = { ...this.pisteStatus.pistes[idx], ...update };
        else this.pisteStatus.pistes.push(update);
      });
    },

    async loadComps() {
      const all = await fetch('/api/competitions/active').then(r => r.json()).catch(() => []);
      this.active   = all.filter(c => c.phase_status === 'active');
      this.upcoming = all.filter(c => c.phase_status === 'pending');
      this.between  = all.filter(c => !c.phase_id);
    },

    async loadPistes() {
      this.pisteStatus = await fetch('/api/opp2/status')
        .then(r => r.json()).catch(() => ({ connected: false, pistes: [] }));
    },

    phaseLink(comp) {
      if (comp.phase_type === 'pool') return `/phase.html?id=${comp.phase_id}`;
      if (comp.phase_type === 'de')   return `/de.html?id=${comp.phase_id}`;
      return `/competition-detail.html?id=${comp.id}`;
    },

    weaponLabel(w) { return { foil: 'Foil', epee: 'Épée', sabre: 'Sabre' }[w] || w; },
    genderLabel(g) { return { M: 'Men', F: 'Women', X: 'Mixed' }[g] || g; },
  };
}
</script>
</body>
</html>
