<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Results</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th{text-align:left;padding:.5rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd}
    td{padding:.5rem .75rem;border-bottom:1px solid #eee;vertical-align:middle}
    tr:hover td{background:#f9f9f9}
    .place{font-weight:700;font-size:1rem;min-width:4rem;color:#1a6bab}
    .place-1{color:#c9a000}
    .place-2{color:#777}
    .place-34{color:#b87333}
    .note{font-size:.8rem;color:#888}
    .pool-row td{color:#aaa}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header>
  <strong>Atlas</strong>
  <a href="/index.html">Home</a>
  <a href="/people.html">People</a>
  <a href="/tournaments.html">Events</a>
  <a href="/strips.html">Strips</a>
  <a href="/opp2.html">OPP2</a>
  <span x-show="comp" style="color:#aad4f5;font-size:.9rem" x-text="'/ '+comp?.name"></span>
</header>
<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="(comp?.name||'Competition')+' — Final Results'"></h2>
      <a :href="'/competition-detail.html?id='+compId" style="font-size:.85rem;color:#888">← Back to competition</a>
    </div>
    <div style="margin-top:.3rem;font-size:.85rem;color:#666"
         x-text="({foil:'Foil',epee:'Épée',sabre:'Sabre'}[comp?.weapon]||'') + ' · ' + ({M:'Men',F:'Women',X:'Mixed'}[comp?.gender]||'')">
    </div>
  </div>

  <div class="card" x-show="results.length === 0" style="color:#999">
    No results available yet.
  </div>

  <div class="card" x-show="results.length > 0">
    <table>
      <thead>
        <tr>
          <th style="width:4rem">Place</th>
          <th style="width:3rem">Seed</th>
          <th>Name</th>
          <th>Club</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in results" :key="r.competitor_id">
          <tr :class="r.note?.startsWith('Pool') ? 'pool-row' : ''">
            <td>
              <span class="place"
                :class="r.place===1?'place-1':r.place===2?'place-2':r.place<=3?'place-34':''"
                x-text="r.place_label">
              </span>
            </td>
            <td style="color:#aaa;font-size:.85rem" x-text="r.de_seed||'—'"></td>
            <td x-text="r.last_name+', '+r.first_name"></td>
            <td x-text="r.club||'—'"></td>
            <td class="note" x-text="r.note||''"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function app() {
  const compId = new URLSearchParams(window.location.search).get('id');
  return {
    compId, comp: null, results: [],

    async init() {
      if (!compId) return;
      [this.comp, this.results] = await Promise.all([
        fetch('/api/competitions/' + compId).then(r => r.json()),
        fetch('/api/competitions/' + compId + '/results').then(r => r.json()),
      ]);
      document.title = 'Atlas — ' + (this.comp?.name || '') + ' Results';
    },
  };
}
</script>
</body>
</html>
