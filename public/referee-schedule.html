<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Referee Schedule</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
  <style>
    .sched-header {
      padding: .45rem 1rem;
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: var(--clr-th-bg);
      border-bottom: 2px solid var(--clr-border);
      color: var(--clr-text-muted);
    }
    .sched-header.unassigned-hdr { background: var(--clr-danger-bg); color: var(--clr-danger-text); }
    .sched-header.ref-hdr { background: var(--clr-brand); color: #fff; }
    tr.row-active td { background: #edfaf1; }
    tr.row-done  td { color: var(--clr-text-muted); }
    .ref-name { font-weight: 700; color: var(--clr-brand); }
    .piste-col { white-space: nowrap; }
  </style>
</head>
<body>
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <div class="nav-right">
    <a href="/tournaments.html">Events</a>
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html" class="active">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main class="layout-data">

<div x-data="refSchedule()" x-init="init()">

  <div class="toolbar">
    <div style="display:flex;gap:.25rem">
      <button class="btn btn-sm" :class="view==='piste'   ?'btn-primary':''" @click="view='piste'">By piste</button>
      <button class="btn btn-sm" :class="view==='referee' ?'btn-primary':''" @click="view='referee'">By referee</button>
    </div>
    <label style="display:flex;align-items:center;gap:.4rem;font-size:.9rem;cursor:pointer">
      <input type="checkbox" :checked="showDone" @change="toggleShowDone()"> Show completed
    </label>
    <button class="btn btn-sm" @click="load()">↻ Refresh</button>
    <span x-show="loading" class="loading">Loading…</span>
  </div>

  <!-- ── By piste ─────────────────────────────────────────────────────────── -->
  <template x-if="view==='piste'">
    <div>
      <template x-for="strip in pisteRows" :key="strip.id">
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
          <div class="sched-header ref-hdr" x-text="stripLabel(strip)"></div>
          <table class="table-responsive">
            <thead>
              <tr>
                <th style="width:5.5rem">Start</th>
                <th style="width:5.5rem">End</th>
                <th>Assignment</th>
                <th>Referee</th>
                <th>Other officials</th>
                <th style="width:5.5rem">Status</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="slot in visibleSlots(strip.slots)" :key="slot.id">
                <tr :class="slot.status==='active'?'row-active':slot.status==='done'?'row-done':''">
                  <td data-label="Start" x-text="slot.scheduled_start || '—'"></td>
                  <td data-label="End" x-text="slot.predicted_end   || '—'"></td>
                  <td data-label="Assignment" x-text="slotLabel(slot)"></td>
                  <td data-label="Referee">
                    <span x-show=" slot.referee_id" class="ref-name" x-text="refName(slot)"></span>
                    <span x-show="!slot.referee_id" class="badge badge-archived">Unassigned</span>
                  </td>
                  <td data-label="Other officials">
                    <template x-for="o in otherOfficials(slot)" :key="o.role">
                      <span style="font-size:.8rem;margin-right:.6rem"
                            x-text="roleLabel(o.role) + ': ' + [o.last_name, o.first_name].filter(Boolean).join(', ')"></span>
                    </template>
                  </td>
                  <td data-label="Status"><span class="badge" :class="'badge-'+badgeCls(slot.status)" x-text="slot.status"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <p x-show="pisteRows.length===0" class="empty">No active pipeline slots.</p>
    </div>
  </template>

  <!-- ── By referee ───────────────────────────────────────────────────────── -->
  <template x-if="view==='referee'">
    <div>
      <template x-for="group in refGroups" :key="group.refId">
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
          <div class="sched-header ref-hdr" x-text="group.name"></div>
          <table class="table-responsive">
            <thead>
              <tr>
                <th style="width:7rem">Piste</th>
                <th style="width:5.5rem">Start</th>
                <th style="width:5.5rem">End</th>
                <th>Assignment</th>
                <th style="width:8rem">Role</th>
                <th style="width:5.5rem">Status</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="slot in group.slots" :key="slot.id + '_' + slot.__role">
                <tr :class="slot.status==='active'?'row-active':slot.status==='done'?'row-done':''">
                  <td data-label="Piste" class="piste-col" x-text="stripLabel(slot)"></td>
                  <td data-label="Start" x-text="slot.scheduled_start || '—'"></td>
                  <td data-label="End" x-text="slot.predicted_end   || '—'"></td>
                  <td data-label="Assignment" x-text="slotLabel(slot)"></td>
                  <td data-label="Role" x-text="roleLabel(slot.__role)"></td>
                  <td data-label="Status"><span class="badge" :class="'badge-'+badgeCls(slot.status)" x-text="slot.status"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>

      <template x-if="unassigned.length > 0">
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
          <div class="sched-header unassigned-hdr">Unassigned slots</div>
          <table class="table-responsive">
            <thead>
              <tr>
                <th style="width:7rem">Piste</th>
                <th style="width:5.5rem">Start</th>
                <th style="width:5.5rem">End</th>
                <th>Assignment</th>
                <th style="width:5.5rem">Status</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="slot in unassigned" :key="slot.id">
                <tr>
                  <td data-label="Piste" class="piste-col" x-text="stripLabel(slot)"></td>
                  <td data-label="Start" x-text="slot.scheduled_start || '—'"></td>
                  <td data-label="End" x-text="slot.predicted_end   || '—'"></td>
                  <td data-label="Assignment" x-text="slotLabel(slot)"></td>
                  <td data-label="Status"><span class="badge" :class="'badge-'+badgeCls(slot.status)" x-text="slot.status"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>

      <p x-show="refGroups.length===0 && unassigned.length===0" class="empty">No referee assignments found.</p>
    </div>
  </template>

</div>
</main>

<script src="/js/nav.js"></script>
<script>
'use strict';
function refSchedule() {
  return {
    strips:     [],
    pisteRows:  [],
    refGroups:  [],
    unassigned: [],
    view:       'piste',
    showDone:   false,
    loading:    false,

    async init() {
      await this.load();
      setInterval(() => this.load(), 30000);
    },

    async load() {
      this.loading = true;
      try {
        this.strips = await fetch('/api/opp2/pipeline').then(r => r.json());
        this._recompute();
      } catch (e) { console.error('referee-schedule load error', e); }
      finally   { this.loading = false; }
    },

    _recompute() {
      const visible = (slots) =>
        (slots || []).filter(s => this.showDone || s.status !== 'done');

      // By-piste: strips that have at least one visible slot
      this.pisteRows = this.strips.filter(s => visible(s.slots).length > 0);

      // By-referee: group visible slots by every assigned official (referee,
      // referee2, video assistant, assessors), tagging each with their role
      // on that slot so a video assistant sees their own schedule too.
      const map = new Map();
      for (const strip of this.strips) {
        for (const slot of visible(strip.slots)) {
          for (const official of (slot.officials || [])) {
            if (!map.has(official.referee_id)) {
              map.set(official.referee_id, {
                refId: official.referee_id,
                name:  [official.last_name, official.first_name].filter(Boolean).join(', ') || `Referee ${official.referee_id}`,
                slots: [],
              });
            }
            map.get(official.referee_id).slots.push({
              ...slot,
              strip_name:   strip.name,
              strip_number: strip.strip_number,
              __role:       official.role,
            });
          }
        }
      }
      for (const g of map.values()) {
        g.slots.sort((a, b) =>
          (a.scheduled_start || '99:99').localeCompare(b.scheduled_start || '99:99'));
      }
      this.refGroups = [...map.values()].sort((a, b) => a.name.localeCompare(b.name));

      // Unassigned visible slots across all strips
      const unass = [];
      for (const strip of this.strips) {
        for (const slot of visible(strip.slots)) {
          if (!slot.referee_id)
            unass.push({ ...slot, strip_name: strip.name, strip_number: strip.strip_number });
        }
      }
      this.unassigned = unass.sort((a, b) =>
        (a.scheduled_start || '99:99').localeCompare(b.scheduled_start || '99:99'));
    },

    toggleShowDone() {
      this.showDone = !this.showDone;
      this._recompute();
    },

    visibleSlots(slots) {
      return (slots || []).filter(s => this.showDone || s.status !== 'done');
    },

    stripLabel(s) {
      const num  = s.strip_number ?? '';
      const name = s.name || s.strip_name || '';
      return name ? `Piste ${num} — ${name}` : `Piste ${num}`;
    },

    slotLabel(s) {
      if (s.type === 'pool')
        return `${s.competition_name || '?'} — Pool ${s.pool_number || '?'}`;
      if (s.type === 'de') {
        const name = s.competition_name || '?';
        const t = s.tableau || '?';
        if (!s.partition || s.partition === 'full') return `${name} — DE T${t}`;
        const [lo, hi] = this.boutRangeForPartition(s.partition, s.tableau);
        return lo === hi
          ? `${name} — DE T${t} bout ${lo}`
          : `${name} — DE T${t} bouts ${lo}–${hi}`;
      }
      if (s.type === 'team_match')
        return `${s.competition_name || '?'} — ${s.left_team_name || '?'} vs ${s.right_team_name || '?'}`;
      return s.type || '—';
    },

    boutRangeForPartition(partition, tableau) {
      const n = tableau / 2;
      if (!partition || partition === 'full') return [1, n];
      let lo = 1, hi = n;
      for (const ch of partition) {
        const mid = Math.floor((lo + hi) / 2);
        if ('A1aceg'.includes(ch)) hi = mid; else lo = mid + 1;
      }
      return [lo, hi];
    },

    refName(s) {
      return [s.ref_last, s.ref_first].filter(Boolean).join(', ');
    },

    roleLabel(role) {
      return {
        referee: 'Referee', referee2: 'Referee 2', video_assistant: 'Video Assistant',
        assessor1: 'Assessor 1', assessor2: 'Assessor 2',
      }[role] || role;
    },

    otherOfficials(slot) {
      return (slot.officials || []).filter(o => o.role !== 'referee');
    },

    badgeCls(status) {
      if (status === 'active') return 'active';
      if (status === 'done')   return 'finished';
      return 'pending';
    },
  };
}
</script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
