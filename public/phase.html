<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Phase</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
  <style>
    .pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:1.5rem}
    .pool-card{background:var(--clr-surface);border-radius:8px;padding:1rem;box-shadow:0 2px 6px rgba(0,0,0,.08);border-left:4px solid #ddd}
    .pool-card.active{border-left-color:#1e8449}
    .pool-card.finished{border-left-color:#1a6bab}
    .pool-card h3{margin:0 0 .5rem;font-size:1rem}
    .pool-meta{font-size:.8rem;color:var(--clr-text-muted);margin-bottom:.5rem}
    .progress-bar{height:6px;background:var(--clr-border);border-radius:3px;overflow:hidden;margin:.4rem 0}
    .progress-fill{height:100%;background:#1e8449;transition:width .3s}
    .pool-actions{margin-top:.75rem;display:flex;gap:.5rem}
    .rank-pos{font-weight:700;color:#1a6bab;width:2rem;text-align:center}
    .adv{color:#1e8449;font-weight:600}
    .elim{color:#c0392b}
    .vr{font-family:monospace}
    .modal-box{width:min(400px,90vw)}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       class="nav-comp-link"></a>
  </template>
  <div class="nav-right">
    <span x-show="comp" style="color:#aad4f5;font-size:.9rem" x-text="'/ '+comp?.name"></span>
    
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main class="layout-data">
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <!-- Phase header -->
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="'Pool phase — ' + (phase?.rule_doc||'')"></h2>
      <span class="badge" :class="'badge-'+(phase?.status||'')" x-text="phase?.status"></span>
      <a :href="'/competition-detail.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#888">← Back to competition</a>
    </div>
    <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button x-show="pools.length>0" @click="autoAssignReferees()"
              style="background:#eef6ff;color:#1a6bab;border-color:#b8d4ef"
              title="Draw referees for every pool from the competition's roster, avoiding a nationality/club conflict where possible (FIE t.50.1-2)">
        ⚡ Auto-assign referees
      </button>
      <button x-show="phase?.status==='finished'"
              style="background:#fff3cd;color:#856404;border-color:#ffc107"
              @click="reopenPhase()">↩ Reopen round</button>
      <template x-if="phase?.status==='active'">
        <span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <button @click="loadRankings()" style="background:#f0f2f5">⟳ Refresh rankings</button>
          <button @click="simulate()" style="background:#f5f0ff;color:#6b21a8;border-color:#d8b4fe">🎲 Simulate</button>
          <span style="font-size:.85rem;color:#666" x-text="allBoutsComplete?'All bouts complete':'Bouts remaining: '+boutsRemaining"></span>
          <!-- Advancement settings always visible while phase is active -->
          <label style="font-size:.85rem">Advance:
            <select x-model="closeMethod">
              <option value="rule">From rule</option>
              <option value="percentage">% of fencers</option>
              <option value="count">Exact count</option>
              <option value="multiple">Multiple of N</option>
            </select>
          </label>
          <input x-show="closeMethod!=='rule'" type="number" min="0" x-model="closeValue"
                 style="width:4rem;padding:.3rem;border:1px solid #ccc;border-radius:4px"
                 :placeholder="closeMethod==='percentage'?'%':'N'">
          <label x-show="closeMethod==='percentage'" style="font-size:.85rem">rounded up to multiple of
            <input type="number" min="0" x-model="closeRoundTo"
                   style="width:3.5rem;padding:.3rem;border:1px solid #ccc;border-radius:4px"
                   placeholder="none">
          </label>
          <button class="success" :disabled="!allBoutsComplete" @click="closePhase()"
                  :title="allBoutsComplete?'':'Complete all bouts first'">✓ Close round</button>
        </span>
      </template>
    </div>
  </div>

  <!-- Pool cards -->
  <div class="pool-grid">
    <template x-for="pool in pools" :key="pool.id">
      <div class="pool-card" :class="pool.status">
        <h3 x-text="'Pool ' + pool.pool_number"></h3>
        <div class="pool-meta">
          <span x-show="pool.strip_name">📍 <span x-text="pool.strip_name"></span></span>
          <span x-show="!pool.strip_name" style="color:#aaa">No strip assigned</span>
          <br>
          <span x-show="pool.ref_last">👤 <span x-text="(pool.ref_first||'')+' '+(pool.ref_last||'')"></span></span>
          <span x-show="!pool.ref_last" style="color:#aaa">No referee assigned</span>
        </div>
        <div style="font-size:.82rem;color:#555" x-text="pool.bouts_complete+' / '+pool.bouts_total+' bouts complete'"></div>
        <div class="progress-bar">
          <div class="progress-fill" :style="'width:'+(pool.bouts_total>0?Math.round(pool.bouts_complete/pool.bouts_total*100):0)+'%'"></div>
        </div>
        <div class="pool-actions">
          <a :href="'/pool.html?id='+pool.id" class="primary" style="display:inline-block;padding:.4rem .9rem;border-radius:5px;background:#1a6bab;color:#fff;text-decoration:none;font-size:.85rem">Open scoresheet</a>
          <button @click="assignResources(pool)" style="font-size:.82rem">Assign strip/ref</button>
        </div>
      </div>
    </template>
  </div>

  <!-- Assign strip/referee modal -->
  <div class="modal-backdrop" x-show="assignOpen" @click.self="assignOpen=false">
    <div class="modal-box">
      <h3 style="margin:0 0 1rem">Assign resources — Pool <span x-text="assignPool?.pool_number"></span></h3>
      <div style="display:flex;flex-direction:column;gap:.6rem">
        <label style="font-size:.85rem">Strip
          <select x-model="assignStripId">
            <option value="">— None —</option>
            <template x-for="s in strips" :key="s.id">
              <option :value="s.id" x-text="s.name||'Strip '+s.strip_number"></option>
            </template>
          </select>
        </label>
        <label style="font-size:.85rem">Referee
          <select x-model="assignRefId">
            <option value="">— None —</option>
            <template x-for="r in referees" :key="r.referee_id">
              <option :value="r.referee_id" x-text="r.last_name+', '+r.first_name"></option>
            </template>
          </select>
        </label>
        <div style="display:flex;gap:.5rem">
          <button class="primary" @click="saveAssignment()">Save</button>
          <button @click="assignOpen=false">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Auto-assign referees result -->
  <div class="modal-backdrop" x-show="assignResultOpen" @click.self="assignResultOpen=false">
    <div class="modal-box" style="width:min(560px,94vw)">
      <h3 style="margin:0 0 1rem">Auto-assign referees — result</h3>
      <p style="font-size:.9rem;margin:0 0 .75rem">
        <span x-text="assignResult?.assigned?.length||0"></span> pool(s) assigned.
        <span x-show="assignResult?.assigned?.some(a=>a.conflicts>0)" style="color:#856404">
          <span x-text="assignResult.assigned.filter(a=>a.conflicts>0).length"></span> had an unavoidable nationality/club conflict.
        </span>
      </p>

      <template x-if="assignResult?.assigned?.some(a=>a.conflicts>0)">
        <div style="margin-bottom:1rem">
          <div style="font-size:.85rem;font-weight:600;margin-bottom:.35rem">Assigned with a conflict</div>
          <template x-for="a in assignResult.assigned.filter(a=>a.conflicts>0)" :key="a.pool_id">
            <div style="font-size:.85rem;padding:.4rem .6rem;background:#fff8e1;border:1px solid #ffc107;border-radius:5px;margin-bottom:.35rem">
              Pool <span x-text="poolNumberById(a.pool_id)"></span> — <span x-text="refereeName(a.referee_id)"></span>
              (<span x-text="a.conflicts"></span> criterion violated)
            </div>
          </template>
        </div>
      </template>

      <template x-if="assignResult?.shortfalls?.length">
        <div style="margin-bottom:1rem">
          <div style="font-size:.85rem;font-weight:600;margin-bottom:.35rem">Why some pools couldn't get a clean referee</div>
          <template x-for="(s, i) in assignResult.shortfalls" :key="i">
            <div style="font-size:.85rem;padding:.5rem .6rem;background:#fde8e8;border:1px solid #f1a9a9;border-radius:5px;margin-bottom:.4rem">
              <div>
                Pool<span x-text="s.pools.length>1?'s':''"></span>
                <span x-text="s.pools.map(p=>poolNumberById(p.pool_id)).join(', ')"></span>
                <span x-text="s.pools.length>1?'together':''"></span>
                could only draw from
                <strong x-text="s.compatible_referee_ids.length"></strong> referee(s) satisfying
                <span x-text="s.threshold===0?'a fully clean assignment':('at most '+s.threshold+' violated criterion/criteria')"></span>.
              </div>
              <template x-for="p in s.pools" :key="p.pool_id">
                <div style="font-size:.8rem;color:#555;margin:.15rem 0 0 .5rem">
                  Pool <span x-text="poolNumberById(p.pool_id)"></span>: <span x-text="poolBlockingDetail(p)"></span>
                </div>
              </template>
              <div style="color:#922b21;margin-top:.35rem">
                Short by <strong x-text="s.shortfall"></strong> — add
                <span x-text="s.shortfall"></span> more referee(s) avoiding
                <span x-text="blockingSummary(s)"></span> to resolve this
                (<span x-text="s.compatible_referee_ids.map(id=>refereeName(id)).join(', ')||'none currently qualify'"></span> already do).
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="assignResult?.unassigned?.length">
        <div style="font-size:.85rem;color:#922b21;margin-bottom:1rem">
          <span x-text="assignResult.unassigned.length"></span> pool(s) got no referee at all:
          Pool <span x-text="assignResult.unassigned.map(id=>poolNumberById(id)).join(', ')"></span>.
          Not enough referees registered for this competition — add more to the roster or assign these by hand.
        </div>
      </template>

      <div style="display:flex;justify-content:flex-end">
        <button class="primary" @click="assignResultOpen=false">Close</button>
      </div>
    </div>
  </div>

  <!-- Live rankings -->
  <div class="card" x-show="rankings.length>0">
    <h2 style="margin-top:0">
      Rankings
      <span style="font-size:.8rem;color:#888;font-weight:400" x-show="phase?.status!=='finished'"> (live — not saved yet)</span>
    </h2>
    <table class="table-responsive">
      <thead><tr>
        <th>#</th><th>Name</th><th>Club</th>
        <th title="Victory ratio (victories / matches fenced)">V/M</th>
        <th title="Matches">M</th>
        <th title="Indicator">Ind</th>
        <th title="Touches scored">TS</th>
        <th title="Touches received">TR</th>
        <th x-show="manualTieBreak && phase?.status!=='finished'"></th>
      </tr></thead>
      <tbody>
        <template x-for="r in rankings" :key="r.competitor_id">
          <tr :class="r.advanced?'adv':(r.advanced===0?'elim':'')">
            <td data-label="#" class="rank-pos" x-text="(r.rank||r.position)+(r.tied?'T':'')"></td>
            <td data-label="Name" x-text="r.last_name+', '+r.first_name"></td>
            <td data-label="Club" x-text="r.club_name||'—'"></td>
            <td data-label="V/M" class="vr" x-text="r.matches>0?(r.victories/r.matches).toFixed(2):'—'"></td>
            <td data-label="M" x-text="r.matches"></td>
            <td data-label="Ind" x-text="(r.indicator>0?'+':'')+r.indicator"></td>
            <td data-label="TS" x-text="r.touches_scored"></td>
            <td data-label="TR" x-text="r.touches_received"></td>
            <td data-label="" x-show="manualTieBreak && phase?.status!=='finished'" style="white-space:nowrap">
              <button x-show="canMoveUp(r)"   @click="moveInTie(r.competitor_id,'up')"
                      style="padding:.1rem .45rem;font-size:.8rem;line-height:1" title="Move up within tied group">▲</button>
              <button x-show="canMoveDown(r)" @click="moveInTie(r.competitor_id,'down')"
                      style="padding:.1rem .45rem;font-size:.8rem;line-height:1" title="Move down within tied group">▼</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>
<script>
function app() {
  const phaseId = new URLSearchParams(window.location.search).get('id');
  return {
    phaseId, phase:null, comp:null, pools:[], rankings:[],
    strips:[], referees:[],
    notice:{text:'',error:false},
    closeMethod:'rule', closeValue:'', closeRoundTo:'',
    assignOpen:false, assignPool:null, assignStripId:'', assignRefId:'',
    assignResultOpen:false, assignResult:null,
    manualTieBreak: false,

    get allBoutsComplete() {
      return this.pools.length>0 && this.pools.every(p=>p.bouts_complete===p.bouts_total && p.bouts_total>0);
    },
    get boutsRemaining() {
      return this.pools.reduce((s,p)=>s+(p.bouts_total-p.bouts_complete),0);
    },

    async init() {
      if(!phaseId){this.showNotice('No phase ID in URL',true);return;}
      const cs = await fetch('/api/settings').then(r=>r.json()).catch(()=>({}));
      this.manualTieBreak = cs.manual_tie_break === '1';
      await Promise.all([this.loadPhase(),this.loadStrips(),this.loadReferees()]);
      await this.loadRankings();
    },

    async loadPhase() {
      this.phase = await fetch('/api/competitions/0/phases/'+phaseId).then(r=>r.json()).catch(()=>null);
      // Fall back: direct DB lookup via phase route
      this.phase = await fetch('/api/phases/'+phaseId).then(r=>r.ok?r.json():null).catch(()=>null)
                || this.phase;
      if(!this.phase) return;
      if(this.phase.competition_id) {
        this.comp = await fetch('/api/competitions/'+this.phase.competition_id).then(r=>r.json());
        document.title = 'Atlas — '+(this.comp?.name||'Phase');
      }
      this.pools = await fetch('/api/phases/'+phaseId+'/pools').then(r=>r.json());
    },

    async loadRankings() {
      const r = await fetch('/api/phases/'+phaseId+'/rankings');
      if(r.ok) this.rankings = await r.json();
    },

    async loadStrips()   { this.strips   = await fetch('/api/strips').then(r=>r.json()).catch(()=>[]); },
    async loadReferees() { this.referees = await fetch('/api/people?role=referee').then(r=>r.json()).catch(()=>[]); },

    canMoveUp(r) {
      if (!r.tied) return false;
      const i = this.rankings.findIndex(x => x.competitor_id === r.competitor_id);
      return i > 0 && this.rankings[i-1].rank === r.rank;
    },
    canMoveDown(r) {
      if (!r.tied) return false;
      const i = this.rankings.findIndex(x => x.competitor_id === r.competitor_id);
      return i < this.rankings.length - 1 && this.rankings[i+1].rank === r.rank;
    },
    async moveInTie(competitorId, dir) {
      const order = this.rankings.map(r => r.competitor_id);
      const i = order.indexOf(competitorId);
      if (dir === 'up'   && i > 0)                { [order[i], order[i-1]] = [order[i-1], order[i]]; }
      if (dir === 'down' && i < order.length - 1) { [order[i], order[i+1]] = [order[i+1], order[i]]; }
      await fetch('/api/settings/tie-order/'+phaseId, {
        method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(order),
      });
      await this.loadRankings();
    },

    async simulate() {
      const r = await fetch('/api/phases/'+phaseId+'/simulate',{method:'POST'});
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Simulate failed',true);return;}
      this.showNotice('Simulated '+data.simulated+' bout(s)');
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    async autoAssignReferees() {
      const r = await fetch('/api/phases/'+phaseId+'/auto-assign-referees', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error || 'Auto-assign failed', true); return; }
      this.assignResult = data;
      this.assignResultOpen = true;
      await this.loadPhase();
    },

    poolNumberById(id) {
      const p = this.pools.find(x => x.id === id);
      return p ? p.pool_number : id;
    },
    refereeName(id) {
      const r = this.referees.find(x => x.referee_id == id);
      return r ? r.last_name+', '+r.first_name : 'Referee '+id;
    },
    poolBlockingDetail(p) {
      const parts = [];
      if (p.nationalities.length) parts.push('nationality '+p.nationalities.join(', '));
      if (p.clubs.length) parts.push('club '+p.clubs.map(c=>c.club_name).join(', '));
      return parts.join(' · ') || '—';
    },
    blockingSummary(s) {
      const nats  = [...new Set(s.pools.flatMap(p => p.nationalities))];
      const clubs = [...new Set(s.pools.flatMap(p => p.clubs.map(c => c.club_name)))];
      const parts = [];
      if (nats.length)  parts.push('nationality '+nats.join(', '));
      if (clubs.length) parts.push('club '+clubs.join(', '));
      return parts.join(' and ') || 'nothing in particular';
    },

    async reopenPhase() {
      if (!confirm('Reopen this phase? The saved rankings and advancement will be cleared. Scores are kept.')) return;
      const r = await fetch('/api/phases/'+phaseId+'/reopen', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error || 'Reopen failed', true); return; }
      this.showNotice('Round reopened — rankings cleared, scores intact');
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    async closePhase() {
      let body = null;
      if(this.closeMethod!=='rule') {
        body = { method: this.closeMethod, value: Number(this.closeValue)||0,
                 multipleOf: Number(this.closeValue)||0 };
        if(this.closeMethod==='percentage' && Number(this.closeRoundTo)>0) {
          body.roundTo = Number(this.closeRoundTo);
        }
      }
      const r = await fetch('/api/phases/'+phaseId+'/close',{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})
      });
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Close failed',true);return;}
      this.showNotice('Round closed — advanced: '+data.advanced+', eliminated: '+data.eliminated);
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    assignResources(pool) {
      this.assignPool = pool;
      this.assignStripId = pool.strip_id||'';
      this.assignRefId   = pool.referee_id||'';
      this.assignOpen    = true;
    },

    async saveAssignment() {
      const r = await fetch('/api/pools/'+this.assignPool.id,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ strip_id: this.assignStripId||null, referee_id: this.assignRefId||null })
      });
      if(!r.ok){this.showNotice('Save failed',true);return;}
      this.showNotice('Resources assigned');
      this.assignOpen = false;
      await this.loadPhase();
    },

    showNotice(text,error=false){ this.notice={text,error}; setTimeout(()=>{this.notice={text:'',error:false};},4000); },
  };
}
</script>
<script src="/js/nav.js"></script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
