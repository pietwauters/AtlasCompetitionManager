<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Phase</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th{text-align:left;padding:.5rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd}
    td{padding:.5rem .75rem;border-bottom:1px solid #eee;vertical-align:middle}
    tr:hover td{background:#f9f9f9}
    .badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:10px;font-weight:600;margin-right:.2rem}
    .badge-pending{background:#fef3cd;color:#856404}
    .badge-active{background:#d4edda;color:#155724}
    .badge-finished{background:#d6d8db;color:#383d41}
    .notice-bar{padding:.6rem 1rem;border-radius:5px;margin-bottom:1rem;font-size:.9rem}
    .notice-ok{background:#d5f5e3;color:#1e5631}
    .notice-err{background:#fde8e8;color:#922b21}
    .pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:1.5rem}
    .pool-card{background:#fff;border-radius:8px;padding:1rem;box-shadow:0 2px 6px rgba(0,0,0,.08);border-left:4px solid #ddd}
    .pool-card.active{border-left-color:#1e8449}
    .pool-card.finished{border-left-color:#1a6bab}
    .pool-card h3{margin:0 0 .5rem;font-size:1rem}
    .pool-meta{font-size:.8rem;color:#666;margin-bottom:.5rem}
    .progress-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:.4rem 0}
    .progress-fill{height:100%;background:#1e8449;transition:width .3s}
    .pool-actions{margin-top:.75rem;display:flex;gap:.5rem}
    .rank-pos{font-weight:700;color:#1a6bab;width:2rem;text-align:center}
    .adv{color:#1e8449;font-weight:600}
    .elim{color:#c0392b}
    .vr{font-family:monospace}
    select{padding:.4rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <span x-show="comp" style="color:#aad4f5;font-size:.9rem" x-text="'/ '+comp?.name"></span>
    
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/people.html">People</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <!-- Phase header -->
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="'Pool phase — ' + (phase?.rule_doc||'')"></h2>
      <span class="badge" :class="'badge-'+(phase?.status||'')" x-text="phase?.status"></span>
      <a :href="'/competition-detail.html?id='+(comp?.id||'')" style="font-size:.85rem;color:#888">← Back to competition</a>
    </div>
    <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button x-show="phase?.status==='pending'" class="primary" @click="activate()">▶ Activate phase</button>
      <button x-show="phase?.status==='finished'"
              style="background:#fff3cd;color:#856404;border-color:#ffc107"
              @click="reopenPhase()">↩ Reopen phase</button>
      <template x-if="phase?.status==='active'">
        <span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <button @click="loadRankings()" style="background:#f0f2f5">⟳ Refresh rankings</button>
          <button @click="simulate()" style="background:#f5f0ff;color:#6b21a8;border-color:#d8b4fe">🎲 Simulate</button>
          <span style="font-size:.85rem;color:#666" x-text="allBoutsComplete?'All bouts complete':'Bouts remaining: '+boutsRemaining"></span>
          <!-- Advancement settings always visible while phase is active -->
          <label style="font-size:.85rem">Advance:
            <select x-model="closeMethod">
              <option value="rule">From rule</option>
              <option value="percentage">% of fencers</option>
              <option value="count">Exact count</option>
              <option value="multiple">Multiple of N</option>
            </select>
          </label>
          <input x-show="closeMethod!=='rule'" type="number" min="0" x-model="closeValue"
                 style="width:4rem;padding:.3rem;border:1px solid #ccc;border-radius:4px"
                 :placeholder="closeMethod==='percentage'?'%':'N'">
          <button class="success" :disabled="!allBoutsComplete" @click="closePhase()"
                  :title="allBoutsComplete?'':'Complete all bouts first'">✓ Close phase</button>
        </span>
      </template>
    </div>
  </div>

  <!-- Pool cards -->
  <div class="pool-grid">
    <template x-for="pool in pools" :key="pool.id">
      <div class="pool-card" :class="pool.status">
        <h3 x-text="'Pool ' + pool.pool_number"></h3>
        <div class="pool-meta">
          <span x-show="pool.strip_name">📍 <span x-text="pool.strip_name"></span></span>
          <span x-show="!pool.strip_name" style="color:#aaa">No strip assigned</span>
          <br>
          <span x-show="pool.ref_last">👤 <span x-text="(pool.ref_first||'')+' '+(pool.ref_last||'')"></span></span>
          <span x-show="!pool.ref_last" style="color:#aaa">No referee assigned</span>
        </div>
        <div style="font-size:.82rem;color:#555" x-text="pool.bouts_complete+' / '+pool.bouts_total+' bouts complete'"></div>
        <div class="progress-bar">
          <div class="progress-fill" :style="'width:'+(pool.bouts_total>0?Math.round(pool.bouts_complete/pool.bouts_total*100):0)+'%'"></div>
        </div>
        <div class="pool-actions">
          <a :href="'/pool.html?id='+pool.id" class="primary" style="display:inline-block;padding:.4rem .9rem;border-radius:5px;background:#1a6bab;color:#fff;text-decoration:none;font-size:.85rem">Open scoresheet</a>
          <button @click="assignResources(pool)" style="font-size:.82rem">Assign strip/ref</button>
        </div>
      </div>
    </template>
  </div>

  <!-- Assign strip/referee modal -->
  <div class="card" x-show="assignOpen" style="max-width:400px">
    <h3 style="margin-top:0">Assign resources — Pool <span x-text="assignPool?.pool_number"></span></h3>
    <div style="display:flex;flex-direction:column;gap:.6rem">
      <label style="font-size:.85rem">Strip
        <select x-model="assignStripId">
          <option value="">— None —</option>
          <template x-for="s in strips" :key="s.id">
            <option :value="s.id" x-text="s.name||'Strip '+s.strip_number"></option>
          </template>
        </select>
      </label>
      <label style="font-size:.85rem">Referee
        <select x-model="assignRefId">
          <option value="">— None —</option>
          <template x-for="r in referees" :key="r.referee_id">
            <option :value="r.referee_id" x-text="r.last_name+', '+r.first_name"></option>
          </template>
        </select>
      </label>
      <div style="display:flex;gap:.5rem">
        <button class="primary" @click="saveAssignment()">Save</button>
        <button @click="assignOpen=false">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Live rankings -->
  <div class="card" x-show="rankings.length>0">
    <h2 style="margin-top:0">
      Rankings
      <span style="font-size:.8rem;color:#888;font-weight:400" x-show="phase?.status!=='finished'"> (live — not saved yet)</span>
    </h2>
    <table>
      <thead><tr>
        <th>#</th><th>Name</th><th>Club</th>
        <th title="Victories">V</th>
        <th title="Matches">M</th>
        <th title="Victory ratio">V/M</th>
        <th title="Indicator">Ind</th>
        <th title="Touches scored">TS</th>
        <th title="Touches received">TR</th>
      </tr></thead>
      <tbody>
        <template x-for="r in rankings" :key="r.competitor_id">
          <tr :class="r.advanced?'adv':(r.advanced===0?'elim':'')">
            <td class="rank-pos" x-text="r.position"></td>
            <td x-text="r.last_name+', '+r.first_name"></td>
            <td x-text="r.club_name||'—'"></td>
            <td x-text="r.victories"></td>
            <td x-text="r.matches"></td>
            <td class="vr" x-text="r.matches>0?(r.victories/r.matches).toFixed(3):'—'"></td>
            <td x-text="(r.indicator>0?'+':'')+r.indicator"></td>
            <td x-text="r.touches_scored"></td>
            <td x-text="r.touches_received"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>
<script>
function app() {
  const phaseId = new URLSearchParams(window.location.search).get('id');
  return {
    phaseId, phase:null, comp:null, pools:[], rankings:[],
    strips:[], referees:[],
    notice:{text:'',error:false},
    closeMethod:'rule', closeValue:'',
    assignOpen:false, assignPool:null, assignStripId:'', assignRefId:'',

    get allBoutsComplete() {
      return this.pools.length>0 && this.pools.every(p=>p.bouts_complete===p.bouts_total && p.bouts_total>0);
    },
    get boutsRemaining() {
      return this.pools.reduce((s,p)=>s+(p.bouts_total-p.bouts_complete),0);
    },

    async init() {
      if(!phaseId){this.showNotice('No phase ID in URL',true);return;}
      await Promise.all([this.loadPhase(),this.loadStrips(),this.loadReferees()]);
      if(this.phase?.status!=='pending') await this.loadRankings();
    },

    async loadPhase() {
      this.phase = await fetch('/api/competitions/0/phases/'+phaseId).then(r=>r.json()).catch(()=>null);
      // Fall back: direct DB lookup via phase route
      this.phase = await fetch('/api/phases/'+phaseId).then(r=>r.ok?r.json():null).catch(()=>null)
                || this.phase;
      if(!this.phase) return;
      if(this.phase.competition_id) {
        this.comp = await fetch('/api/competitions/'+this.phase.competition_id).then(r=>r.json());
        document.title = 'Atlas — '+(this.comp?.name||'Phase');
      }
      this.pools = await fetch('/api/phases/'+phaseId+'/pools').then(r=>r.json());
    },

    async loadRankings() {
      const r = await fetch('/api/phases/'+phaseId+'/rankings');
      if(r.ok) this.rankings = await r.json();
    },

    async loadStrips()   { this.strips   = await fetch('/api/strips').then(r=>r.json()).catch(()=>[]); },
    async loadReferees() { this.referees = await fetch('/api/people?role=referee').then(r=>r.json()).catch(()=>[]); },

    async activate() {
      const r = await fetch('/api/phases/'+phaseId+'/activate',{method:'POST'});
      if(!r.ok){this.showNotice('Activate failed',true);return;}
      this.showNotice('Phase activated');
      await this.loadPhase();
    },

    async simulate() {
      const r = await fetch('/api/phases/'+phaseId+'/simulate',{method:'POST'});
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Simulate failed',true);return;}
      this.showNotice('Simulated '+data.simulated+' bout(s)');
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    async reopenPhase() {
      if (!confirm('Reopen this phase? The saved rankings and advancement will be cleared. Scores are kept.')) return;
      const r = await fetch('/api/phases/'+phaseId+'/reopen', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) { this.showNotice(data.error || 'Reopen failed', true); return; }
      this.showNotice('Phase reopened — rankings cleared, scores intact');
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    async closePhase() {
      let body = null;
      if(this.closeMethod!=='rule') {
        body = { method: this.closeMethod, value: Number(this.closeValue)||0,
                 multipleOf: Number(this.closeValue)||0 };
      }
      const r = await fetch('/api/phases/'+phaseId+'/close',{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})
      });
      const data = await r.json();
      if(!r.ok){this.showNotice(data.error||'Close failed',true);return;}
      this.showNotice('Phase closed — advanced: '+data.advanced+', eliminated: '+data.eliminated);
      await Promise.all([this.loadPhase(), this.loadRankings()]);
    },

    assignResources(pool) {
      this.assignPool = pool;
      this.assignStripId = pool.strip_id||'';
      this.assignRefId   = pool.referee_id||'';
      this.assignOpen    = true;
    },

    async saveAssignment() {
      const r = await fetch('/api/pools/'+this.assignPool.id,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ strip_id: this.assignStripId||null, referee_id: this.assignRefId||null })
      });
      if(!r.ok){this.showNotice('Save failed',true);return;}
      this.showNotice('Resources assigned');
      this.assignOpen = false;
      await this.loadPhase();
    },

    showNotice(text,error=false){ this.notice={text,error}; setTimeout(()=>{this.notice={text:'',error:false};},4000); },
  };
}
</script>
<script src="/js/nav.js"></script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
