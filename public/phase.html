<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase — Atlas</title>
    <script src="/js/htmx.min.js"></script>
    <script src="/js/alpinejs.min.js" defer></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        header {
            background: #1a1a2e;
            color: #fff;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header a {
            color: #aad4f5;
            text-decoration: none;
            font-size: .9rem;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
        }

        h2,
        h3,
        h4 {
            margin-top: 0;
        }

        .meta {
            display: flex;
            gap: 2rem;
            font-size: .9rem;
            color: #555;
            margin-bottom: 1rem;
        }

        .meta span strong {
            color: #1a1a2e;
        }

        .badge {
            display: inline-block;
            padding: .15rem .55rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-pending {
            background: #e8ecf0;
            color: #555;
        }

        .badge-active {
            background: #d4efdf;
            color: #1e8449;
        }

        .badge-finished {
            background: #eaf0fb;
            color: #1a6bab;
        }

        /* Pool grid */
        .pools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .pool-card {
            background: #fff;
            border: 1px solid #e0e6ee;
            border-radius: 8px;
            padding: 1.1rem 1.2rem;
        }

        .pool-card h4 {
            margin-bottom: .7rem;
            color: #1a1a2e;
            font-size: 1rem;
        }

        /* Fencer list in a pool */
        .fencer-list {
            list-style: none;
            margin: 0 0 1rem 0;
            padding: 0;
        }

        .fencer-list li {
            display: flex;
            gap: .5rem;
            padding: .25rem 0;
            font-size: .88rem;
            border-bottom: 1px solid #f0f2f5;
        }

        .fencer-list li:last-child {
            border-bottom: none;
        }

        .fencer-list .seed {
            width: 1.6rem;
            text-align: right;
            color: #888;
            flex-shrink: 0;
        }

        .fencer-list .nat {
            width: 2.2rem;
            text-align: right;
            color: #888;
            flex-shrink: 0;
            font-size: .78rem;
        }

        /* Bout table */
        .bouts-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .82rem;
            margin-top: .5rem;
        }

        .bouts-table th {
            background: #f0f2f5;
            text-align: left;
            padding: .3rem .5rem;
            font-weight: 600;
        }

        .bouts-table td {
            padding: .3rem .5rem;
            border-bottom: 1px solid #f0f2f5;
        }

        .bouts-table tr:last-child td {
            border-bottom: none;
        }

        .bouts-table .score {
            text-align: center;
            font-weight: bold;
            color: #1a6bab;
            white-space: nowrap;
        }

        .status-pill {
            display: inline-block;
            padding: .1rem .45rem;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: bold;
            text-transform: uppercase;
            background: #e8ecf0;
            color: #555;
        }

        .empty {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>
    <header>
        <strong>Atlas</strong>
        <a href="/">Home</a>
        <a href="/competitions">Competitions</a>
        <a id="back-link" href="#">Competition</a>
        <span id="header-sub" style="margin-left:auto;opacity:.7;font-size:.9rem"></span>
    </header>

    <main>
        <div class="card" id="phase-card">
            <div style="color:#888">Loading…</div>
        </div>
        <div class="pools-grid" id="pools-grid"></div>
    </main>

    <script>
        // Alpine.js row state for each bout, by ID
        function boutRowDataById(boutId, compId, phaseId) {
            const bout = window._boutsById[boutId];
            return {
                left: bout.left_score ?? '',
                right: bout.right_score ?? '',
                winner: bout.winner_id ?? '',
                saving: false,
                error: '',
                origLeft: bout.left_score ?? '',
                origRight: bout.right_score ?? '',
                origWinner: bout.winner_id ?? '',
                async saveResult() {
                    if (this.saving) return;
                    this.error = '';
                    this.saving = true;
                    try {
                        let body = { left_score: this.left, right_score: this.right };
                        // If tie, allow winner selection
                        if (this.left !== '' && this.right !== '' && Number(this.left) === Number(this.right)) {
                            if (this.winner) body.winner_id = this.winner;
                        }
                        const resp = await fetch(`/api/competitions/${compId}/phases/${phaseId}/bouts/${bout.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        if (!resp.ok) {
                            const data = await resp.json();
                            this.error = data.error || 'Error';
                        } else {
                            this.origLeft = this.left;
                            this.origRight = this.right;
                            this.origWinner = this.winner;
                            this.error = '';
                        }
                    } catch (e) {
                        this.error = 'Network error';
                    } finally {
                        this.saving = false;
                    }
                }
            };
        }
        const parts = location.pathname.split('/');
        const compId = parts[2];
        const phaseId = parts[4];

        document.getElementById('back-link').href = `/competitions/${compId}`;

        // Redirect to the EJS HTML page if loaded directly
        if (!window.location.pathname.endsWith('/view')) {
            window.location.pathname = `/competitions/${compId}/phases/${phaseId}/view`;
        }

        function render(phase) {
            document.title = `Phase ${phase.phase_order} — Atlas`;
            document.getElementById('header-sub').textContent = `Phase ${phase.phase_order}`;

            document.getElementById('phase-card').innerHTML = `
                <h2>Phase ${phase.phase_order}
                    <span class="badge badge-${phase.status}">${phase.status}</span>
                </h2>
                <div class="meta">
                    <span><strong>Rule:</strong> ${esc(phase.rule_doc)}</span>
                    <span><strong>Type:</strong> ${esc(phase.type)}</span>
                    <span><strong>Pools:</strong> ${phase.pools.length}</span>
                </div>
            `;

            const grid = document.getElementById('pools-grid');
            if (!phase.pools.length) {
                grid.innerHTML = '<p class="empty">No pools generated yet.</p>';
                return;
            }

            grid.innerHTML = phase.pools.map(pool => renderPool(pool)).join('');
        }

        function renderPool(pool) {
            // Only one valid implementation, no stray tags
            const isWin = (id, winnerId) => id === winnerId ? 'font-weight:bold' : '';
            // Make bouts globally accessible for Alpine lookup
            if (!window._boutsById) window._boutsById = {};
            pool.bouts.forEach(b => { window._boutsById[b.id] = b; });
            const boutRows = pool.bouts.map(b => {
                // Always editable
                // For tie-winner dropdown
                const tie = b.left_score !== null && b.right_score !== null && b.left_score === b.right_score;
                // Escape names for HTML
                const leftName = esc(b.left_name);
                const rightName = esc(b.right_name);
                return [
                    '<tr x-data="boutRowDataById(' + b.id + ', compId, phaseId)">',
                    '  <td style="' + isWin(b.left_id, b.winner_id) + '">' + leftName + '</td>',
                    '  <td class="score">',
                    '    <span>',
                    '      <input type="number" min="0" max="99" x-model="left" style="width:2.5em;text-align:right;" :disabled="saving" @keydown.enter.prevent="saveResult()"> — ',
                    '      <input type="number" min="0" max="99" x-model="right" style="width:2.5em;text-align:right;" :disabled="saving" @keydown.enter.prevent="saveResult()">',
                    // Tie-winner dropdown
                    '      <template x-if="left !== '' && right !== '' && Number(left) === Number(right)">',
                    '        <select x-model="winner" style="margin-left:.5em;" :disabled="saving">',
                    '          <option value="">-- Winner --</option>',
                    '          <option :value="' + b.left_id + '">' + leftName + '</option>',
                    '          <option :value="' + b.right_id + '">' + rightName + '</option>',
                    '        </select>',
                    '      </template>',
                    '      <button type="button" @click="saveResult()" :disabled="saving || (left === origLeft && right === origRight && winner === origWinner)" style="margin-left:.5em;font-size:.9em">Save</button>',
                    '      <span x-show="saving" style="margin-left:.3em;color:#888">Saving…</span>',
                    '      <span x-show="error" style="color:#b00;margin-left:.5em" x-text="error"></span>',
                    '    </span>',
                    '  </td>',
                    '  <td style="' + isWin(b.right_id, b.winner_id) + '">' + rightName + '</td>',
                    '  <td><span class="status-pill">' + b.status + '</span></td>',
                    '</tr>'
                ].join('');
            }).join('');

            // fencerRows, strip, referee must be defined in the parent scope
            return [
                '<div class="pool-card">',
                `  <h4>Pool ${pool.pool_number} ${typeof strip !== 'undefined' ? strip : ''}${typeof referee !== 'undefined' ? referee : ''}</h4>`,
                `  <ul class="fencer-list">${typeof fencerRows !== 'undefined' ? fencerRows : ''}</ul>`,
                '  <details>',
                '    <summary style="cursor:pointer;font-size:.85rem;color:#1a6bab;margin-bottom:.4rem">',
                `      Bouts (${pool.bouts.length})`,
                '    </summary>',
                '    <table class="bouts-table">',
                '      <thead>',
                '        <tr>',
                '          <th>Left</th>',
                '          <th style="text-align:center">Score</th>',
                '          <th>Right</th>',
                '          <th>Status</th>',
                '        </tr>',
                '      </thead>',
                `      <tbody>${boutRows}</tbody>`,
                '    </table>',
                '  </details>',
                '</div>'
            ].join('');
        }

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>

</html>
