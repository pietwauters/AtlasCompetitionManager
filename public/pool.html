<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Pool</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body{background:#1a1a2e;color:#fff;font-family:Arial,sans-serif}
    header{background:#0d0d1f;padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem}
    header a{color:#aad4f5;text-decoration:none;font-size:.9rem}
    .pool-header{padding:1rem 1.5rem;background:#16213e;display:flex;gap:2rem;align-items:center;flex-wrap:wrap}
    .pool-header h2{margin:0;font-size:1.2rem}
    .meta{font-size:.82rem;color:#aaa}
    .section-label{padding:.6rem 1.5rem .3rem;font-size:.72rem;font-weight:700;text-transform:uppercase;
                   letter-spacing:.07em;color:#556}

    /* ── Matrix ──────────────────────────────────────────────────────────── */
    .matrix-wrap{overflow-x:auto;padding:0 1.5rem 1rem}
    .mtx{border-collapse:collapse;font-size:.82rem;white-space:nowrap}
    .mtx th,.mtx td{border:1px solid #2a3a5e;padding:.3rem .45rem;text-align:center}
    .mtx thead th{background:#0d0d1f;color:#aad4f5;font-weight:600}
    .mtx .td-name{text-align:left;padding-left:.6rem;min-width:9rem;color:#eee}
    .mtx .td-num{color:#aad4f5;font-weight:600;min-width:1.6rem}
    .mtx .td-diag{background:#0a0a1a}
    .mtx .td-won{color:#4cde80;font-weight:700}
    .mtx .td-lost{color:#ccc}
    .mtx .td-empty{color:#333}
    .mtx .td-stat{color:#aad4f5;min-width:2.4rem}
    .mtx .td-ind-pos{color:#4cde80}
    .mtx .td-ind-neg{color:#e74c3c}
    .mtx .td-rank{font-weight:700;color:#fff;min-width:2rem}

    /* ── Scoresheet ──────────────────────────────────────────────────────── */
    .scoresheet{padding:0 1.5rem 1rem}
    .bout-row{background:#fff;color:#1a1a2e;border-radius:6px;margin-bottom:.6rem;display:flex;
              align-items:center;gap:.5rem;padding:.5rem .75rem;box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .bout-row.finished{background:#f0faf5}
    .bout-row.active{background:#fffbf0;border-left:3px solid #e67e22}
    .bout-num{font-size:.75rem;color:#888;width:1.8rem;text-align:center;flex-shrink:0}
    .fencer-name{flex:1;font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fencer-name.winner{color:#1e8449}
    .score-input{width:2.8rem;height:2.4rem;text-align:center;font-size:1.1rem;font-weight:700;
                 border:2px solid #ccc;border-radius:5px;background:#fff;color:#1a1a2e}
    .score-input:focus{outline:none;border-color:#1a6bab}
    .separator{font-size:1rem;color:#999;padding:0 .2rem}
    .btn-undo{background:#e74c3c;color:#fff;border:none;border-radius:4px;padding:.3rem .6rem;
              cursor:pointer;font-size:.78rem;flex-shrink:0}
    .btn-undo:hover{background:#c0392b}
    .tie-picker{font-size:.78rem;background:#fef3cd;border-radius:4px;padding:.2rem .4rem}
    .tie-picker select{border:none;background:transparent;font-size:.78rem;cursor:pointer}
    .progress{padding:.5rem 1.5rem;font-size:.85rem;color:#aad4f5}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header>
  <strong>Atlas</strong>
  <a :href="pool?'/phase.html?id='+pool.phase_id:'#'">← Phase overview</a>
  <span style="color:#aad4f5;margin-left:auto"
        x-text="pool?'Pool '+pool.pool_number+' | '+(pool.strip_name||'No strip'):''"></span>
</header>

<div class="pool-header" x-show="pool">
  <div>
    <h2 x-text="'Pool ' + (pool?.pool_number||'')"></h2>
    <div class="meta">
      <span x-show="pool?.strip_name">📍 <span x-text="pool?.strip_name"></span> &nbsp;</span>
      <span x-show="pool?.ref_last">👤 <span x-text="(pool?.ref_first||'')+' '+(pool?.ref_last||'')"></span></span>
    </div>
  </div>
  <div style="margin-left:auto;font-size:.9rem">
    <span x-text="bouts.filter(b=>b.status==='finished').length"></span>
    /
    <span x-text="bouts.length"></span>
    bouts complete
  </div>
</div>

<div class="progress" x-show="notice.text" :style="notice.error?'color:#e74c3c':''" x-text="notice.text"></div>

<!-- ── Pool matrix ─────────────────────────────────────────────────────── -->
<div x-show="pool">
  <div class="section-label">Results</div>
  <div class="matrix-wrap">
    <table class="mtx">
      <thead>
        <tr>
          <th class="td-num">#</th>
          <th style="text-align:left;padding-left:.6rem">Name</th>
          <template x-for="(_, j) in matrix.comps" :key="j">
            <th x-text="j + 1"></th>
          </template>
          <th class="td-stat">V</th>
          <th class="td-stat">Ind</th>
          <th class="td-stat">TS</th>
          <th class="td-stat">TR</th>
          <th class="td-rank">Rank</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in matrixRows" :key="row.comp.competitor_id">
          <tr>
            <td class="td-num" x-text="row.idx + 1"></td>
            <td class="td-name" x-text="row.comp.last_name + ', ' + row.comp.first_name"></td>
            <template x-for="cell in row.cells" :key="cell.k">
              <td :class="cell.cls" x-text="cell.txt"></td>
            </template>
            <td class="td-stat" x-text="row.v"></td>
            <td class="td-stat" :class="row.ind > 0 ? 'td-ind-pos' : row.ind < 0 ? 'td-ind-neg' : 'td-stat'"
                x-text="(row.ind > 0 ? '+' : '') + row.ind"></td>
            <td class="td-stat" x-text="row.ts"></td>
            <td class="td-stat" x-text="row.tr"></td>
            <td class="td-rank" x-text="row.rank ?? '—'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Scoresheet ─────────────────────────────────────────────────────── -->
<div x-show="pool">
  <div class="section-label">Scoresheet</div>
  <div class="scoresheet">
    <template x-for="bout in bouts" :key="bout.id">
      <div class="bout-row" :class="bout.status">
        <span class="bout-num" x-text="bout.bout_order"></span>

        <span class="fencer-name" :class="{winner: bout.winner_id===bout.left_id}"
              x-text="bout.left_last+', '+bout.left_first"></span>

        <input class="score-input" type="number" min="0" max="99"
               :value="bout.left_score??''"
               @change="saveScore(bout, $event.target.value, null)"
               @focus="$event.target.select()"
               :style="bout.winner_id===bout.left_id?'border-color:#1e8449':''">

        <span class="separator">:</span>

        <input class="score-input" type="number" min="0" max="99"
               :value="bout.right_score??''"
               @change="saveScore(bout, null, $event.target.value)"
               @focus="$event.target.select()"
               :style="bout.winner_id===bout.right_id?'border-color:#1e8449':''">

        <span class="fencer-name" :class="{winner: bout.winner_id===bout.right_id}"
              style="text-align:right"
              x-text="bout.right_last+', '+bout.right_first"></span>

        <span class="tie-picker"
              x-show="bout.left_score!==null && bout.right_score!==null
                      && bout.left_score===bout.right_score && !bout.winner_id">
          Winner:
          <select @change="setWinner(bout, $event.target.value)">
            <option value="">pick…</option>
            <option :value="bout.left_id"  x-text="bout.left_last"></option>
            <option :value="bout.right_id" x-text="bout.right_last"></option>
          </select>
        </span>

        <button class="btn-undo" @click="undo(bout)" title="Undo last score entry">↩</button>
      </div>
    </template>
  </div>
</div>

<script>
function app() {
  const poolId = new URLSearchParams(window.location.search).get('id');
  return {
    poolId, pool: null, bouts: [],
    notice: { text: '', error: false },
    pending: {},

    async init() {
      if (!poolId) { this.showNotice('No pool ID in URL', true); return; }
      await this.load();
      const es = new EventSource('/api/pools/' + poolId + '/events');
      window.addEventListener('beforeunload', () => es.close());
      es.addEventListener('bout-updated', e => {
        const updated = JSON.parse(e.data);
        this.bouts = this.bouts.map(b => b.id === updated.id ? { ...b, ...updated } : b);
      });
    },

    async load() {
      const r = await fetch('/api/pools/' + poolId);
      if (!r.ok) { this.showNotice('Pool not found', true); return; }
      this.pool  = await r.json();
      this.bouts = this.pool.bouts || [];
      document.title = 'Atlas — Pool ' + (this.pool.pool_number || '');
    },

    // ── Matrix computation ──────────────────────────────────────────────
    get matrix() {
      const comps = [...(this.pool?.competitors || [])];
      comps.sort((a, b) => (a.initial_seed || 999) - (b.initial_seed || 999));
      const N = comps.length;
      const idxOf = {};
      comps.forEach((c, i) => idxOf[c.competitor_id] = i);

      // grid[i][j] = { score, won } for finished bouts; null otherwise
      const grid = Array.from({ length: N }, () => Array(N).fill(null));
      const stats = Array.from({ length: N }, () => ({ v: 0, ts: 0, tr: 0, m: 0 }));

      for (const bout of this.bouts) {
        if (bout.status !== 'finished') continue;
        const li = idxOf[bout.left_id];
        const ri = idxOf[bout.right_id];
        if (li === undefined || ri === undefined) continue;
        const ls = bout.left_score ?? 0;
        const rs = bout.right_score ?? 0;
        const lWon = bout.winner_id === bout.left_id;
        const rWon = bout.winner_id === bout.right_id;
        grid[li][ri] = { score: ls, won: lWon };
        grid[ri][li] = { score: rs, won: rWon };
        stats[li].ts += ls; stats[li].tr += rs; stats[li].m++;
        stats[ri].ts += rs; stats[ri].tr += ls; stats[ri].m++;
        if (lWon) stats[li].v++;
        if (rWon) stats[ri].v++;
      }

      // Rank: best V/M, then best indicator, then most TS
      const order = comps.map((_, i) => i);
      order.sort((a, b) => {
        const vmA = stats[a].m ? stats[a].v / stats[a].m : 0;
        const vmB = stats[b].m ? stats[b].v / stats[b].m : 0;
        if (vmA !== vmB) return vmB - vmA;
        const indA = stats[a].ts - stats[a].tr;
        const indB = stats[b].ts - stats[b].tr;
        if (indA !== indB) return indB - indA;
        return stats[b].ts - stats[a].ts;
      });
      const rankOf = {};
      order.forEach((idx, pos) => rankOf[idx] = pos + 1);

      return { comps, grid, stats, rankOf };
    },

    get matrixRows() {
      const { comps, grid, stats, rankOf } = this.matrix;
      return comps.map((comp, i) => {
        const cells = comps.map((_, j) => {
          if (i === j) return { k: j, cls: 'td-diag', txt: '' };
          const d = grid[i][j];
          if (!d)         return { k: j, cls: 'td-empty', txt: '' };
          return d.won
            ? { k: j, cls: 'td-won',  txt: 'V' + d.score }
            : { k: j, cls: 'td-lost', txt: String(d.score) };
        });
        const s   = stats[i];
        const ind = s.ts - s.tr;
        return {
          comp, idx: i, cells,
          v: s.v, ts: s.ts, tr: s.tr, ind,
          rank: s.m > 0 ? rankOf[i] : null,
        };
      });
    },

    // ── Score entry ─────────────────────────────────────────────────────
    async saveScore(bout, leftVal, rightVal) {
      if (!this.pending[bout.id]) this.pending[bout.id] = { ls: bout.left_score, rs: bout.right_score };
      if (leftVal  !== null) this.pending[bout.id].ls = leftVal  === '' ? null : Number(leftVal);
      if (rightVal !== null) this.pending[bout.id].rs = rightVal === '' ? null : Number(rightVal);
      const { ls, rs } = this.pending[bout.id];
      if (ls !== null && rs !== null) {
        await this._patch(bout.id, ls, rs, null);
        delete this.pending[bout.id];
      }
    },

    async setWinner(bout, winnerId) {
      if (!winnerId) return;
      await this._patch(bout.id, bout.left_score, bout.right_score, winnerId);
    },

    async undo(bout) {
      const r = await fetch('/api/bouts/' + bout.id + '/undo', { method: 'POST' });
      if (!r.ok) { this.showNotice('Nothing to undo', true); return; }
      const updated = await r.json();
      this.bouts = this.bouts.map(b => b.id === bout.id ? { ...b, ...updated } : b);
      this.showNotice('Undone', false);
    },

    async _patch(boutId, ls, rs, winnerId) {
      const r = await fetch('/api/bouts/' + boutId, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ left_score: ls, right_score: rs, winner_id: winnerId || null }),
      });
      if (!r.ok) { this.showNotice('Save failed', true); return; }
      const updated = await r.json();
      this.bouts = this.bouts.map(b => b.id === boutId ? { ...b, ...updated } : b);
    },

    showNotice(text, error = false) {
      this.notice = { text, error };
      if (!error) setTimeout(() => { this.notice = { text: '', error: false }; }, 2000);
    },
  };
}
</script>
<script src="/js/alpinejs.min.js"></script>
</body>
</html>
