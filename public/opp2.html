<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Schedule</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notice-bar{padding:.6rem 1rem;border-radius:5px;margin-bottom:1rem;font-size:.9rem}
    .notice-ok{background:#d5f5e3;color:#1e5631}
    .notice-err{background:#fde8e8;color:#922b21}
    .badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:10px;font-weight:600;margin-right:.3rem}
    .badge-connected{background:#d4edda;color:#155724}
    .badge-disconnected{background:#d6d8db;color:#383d41}
    .badge-pending{background:#fef3cd;color:#856404}
    .badge-active{background:#d4edda;color:#155724}
    .badge-done{background:#d6d8db;color:#383d41}
    .badge-online{background:#d4edda;color:#155724}
    .badge-offline{background:#fde8e8;color:#922b21}
    .broker-row{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap;margin-top:.75rem}
    .broker-row input{flex:1;min-width:220px;padding:.4rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
    .pipeline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-top:1rem}
    .strip-card{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);overflow:hidden}
    .strip-header{padding:.6rem 1rem;background:#f0f2f5;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #ddd}
    .strip-header strong{flex:1;font-size:.95rem}
    .slot-list{padding:.5rem}
    .slot{border:1px solid #e0e0e0;border-radius:6px;margin-bottom:.5rem;background:#fafafa}
    .slot-head{padding:.4rem .7rem;display:flex;align-items:center;gap:.4rem;cursor:default}
    .slot-label{flex:1;font-size:.85rem;font-weight:600}
    .slot-time{font-size:.78rem;color:#666;white-space:nowrap}
    .slot-detail{padding:.3rem .7rem .6rem;font-size:.78rem;color:#555;border-top:1px solid #eee}
    .slot-detail .row{display:flex;gap:.5rem;align-items:center;margin-bottom:.2rem}
    .slot-detail input[type=time]{padding:.2rem .4rem;border:1px solid #ccc;border-radius:4px;font-size:.78rem}
    .slot-detail input[type=number]{width:4rem;padding:.2rem .4rem;border:1px solid #ccc;border-radius:4px;font-size:.78rem}
    .slot-detail select{padding:.2rem .4rem;border:1px solid #ccc;border-radius:4px;font-size:.78rem}
    .slot-actions{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
    .predicted{color:#1a6bab;font-weight:600}
    .overlap-warn{color:#856404}
    .add-slot-form{padding:.6rem;border-top:1px solid #eee;background:#f8f8f8}
    .add-slot-form select,.add-slot-form input{padding:.3rem .5rem;border:1px solid #ccc;border-radius:4px;font-size:.82rem;margin-bottom:.3rem;width:100%}
    .add-slot-form .row{display:flex;gap:.4rem;flex-wrap:wrap}
    .add-slot-form .row select,.add-slot-form .row input{width:auto;flex:1}
    .ref-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem}
    .ref-table th{text-align:left;padding:.4rem .6rem;background:#f0f2f5;border-bottom:2px solid #ddd}
    .ref-table td{padding:.4rem .6rem;border-bottom:1px solid #eee;vertical-align:top}
    .piste-status-grid{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem}
    .piste-dot{display:flex;align-items:center;gap:.3rem;font-size:.82rem;padding:.3rem .6rem;border-radius:5px;background:#f0f2f5}
    select{padding:.4rem .6rem;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
  </style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.phase_id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       style="color:#c8e6ff;font-weight:500;border-left:1px solid #334;padding-left:.75rem"></a>
  </template>
  <div style="margin-left:auto;display:flex;gap:1rem;align-items:center">
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html" style="color:#aad4f5">Schedule</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>
  <div class="notice-bar notice-ok" x-show="notice.text&&!notice.error" x-text="notice.text"></div>
  <div class="notice-bar notice-err" x-show="notice.text&& notice.error" x-text="notice.text"></div>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
      <h2 style="margin:0">Piste Schedule</h2>
      <span class="badge" :class="status.connected?'badge-connected':'badge-disconnected'"
            x-text="status.connected?'Connected':'Disconnected'"></span>
      <span x-show="status.connected" style="font-size:.82rem;color:#555" x-text="status.brokerUrl"></span>
      <a href="/admin.html" style="font-size:.82rem;color:#888;margin-left:auto">⚙ Settings</a>
    </div>

    <!-- Live piste status -->
    <template x-if="status.connected && status.pistes.length">
      <div style="margin-top:.75rem">
        <div style="font-size:.82rem;color:#666;margin-bottom:.3rem">Apparatus status</div>
        <div class="piste-status-grid">
          <template x-for="p in status.pistes" :key="p.pisteId">
            <div class="piste-dot">
              <span :style="'width:8px;height:8px;border-radius:50%;flex-shrink:0;background:'+(p.apparatusOnline?'#1e8449':'#aaa')"></span>
              <span style="font-weight:600" x-text="p.pisteId"></span>
              <template x-if="p.bout">
                <span style="color:#1a6bab;font-size:.8rem"
                  x-text="'#'+p.bout.bout_order+' '+p.bout.left+' — '+p.bout.right"></span>
              </template>
              <template x-if="!p.bout">
                <span style="color:#aaa;font-size:.8rem">idle</span>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- ── Pipeline builder ──────────────────────────────────────────────────── -->
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap">
      <h2 style="margin:0">Piste pipelines</h2>
      <span style="font-size:.82rem;color:#888">Drag-to-reorder not yet available — use ▲▼ buttons</span>
      <label style="margin-left:auto;font-size:.85rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
        <input type="checkbox" x-model="hideOffline"> Hide offline pistes
      </label>
    </div>

    <div class="pipeline-grid">
      <template x-for="strip in strips" :key="strip.id">
        <div class="strip-card" x-show="!hideOffline || !isOffline(strip)">
          <div class="strip-header">
            <strong x-text="strip.name||('Strip '+strip.strip_number)"></strong>
            <template x-if="liveState(strip.name)">
              <span class="badge"
                :class="liveState(strip.name).apparatusOnline?'badge-online':'badge-offline'"
                x-text="liveState(strip.name).apparatusOnline?'online':'offline'"></span>
            </template>
            <template x-if="liveState(strip.name)?.bout">
              <span style="font-size:.78rem;color:#1a6bab;margin-left:.25rem"
                x-text="'▶ #'+liveState(strip.name).bout.bout_order+' '+liveState(strip.name).bout.left+' — '+liveState(strip.name).bout.right"></span>
            </template>
          </div>

          <div class="slot-list">
            <template x-for="(slot, idx) in strip.slots" :key="slot.id">
              <div x-show="showSlot(slot, idx, strip.slots)" :class="'slot'+(slot.status==='done'?' slot-done':'')"

                <!-- Done slots: collapsed pill, click to expand -->
                <template x-if="slot.status==='done' && !expandedSlots.has(slot.id)">
                  <div class="slot-head slot-collapsed" @click="expandedSlots.add(slot.id); expandedSlots = new Set(expandedSlots)" style="cursor:pointer;opacity:.55">
                    <span class="badge badge-done">✓ done</span>
                    <span class="slot-label" x-text="slotLabel(slot)"></span>
                    <span style="font-size:.75rem;color:#aaa;margin-left:auto">▶ show</span>
                  </div>
                </template>

                <!-- All other slots (and expanded done slots) -->
                <template x-if="slot.status!=='done' || expandedSlots.has(slot.id)">
                  <div>
                    <div class="slot-head" :style="slot.status==='done'?'opacity:.65':''">
                      <span class="badge" :class="'badge-'+slot.status" x-text="slot.status"></span>
                      <span class="slot-label" x-text="slotLabel(slot)"></span>
                      <span class="slot-time">
                        <span x-show="slot.scheduled_start" x-text="slot.scheduled_start+' →'"></span>
                        <span class="predicted" x-show="slot.predicted_end" x-text="slot.predicted_end"></span>
                        <span class="overlap-warn"
                          x-show="idx>0 && hasOverlap(strip.slots[idx-1], slot)"> ⚠</span>
                      </span>
                      <template x-if="slot.status==='done'">
                        <span @click="expandedSlots.delete(slot.id); expandedSlots = new Set(expandedSlots)"
                              style="font-size:.75rem;color:#aaa;cursor:pointer;margin-left:.5rem">▼ hide</span>
                      </template>
                    </div>
                    <div class="slot-detail">
                      <div class="row">
                        <label>Start
                          <input type="time" step="300" :value="slot.scheduled_start||''"
                            @change="updateSlot(slot.id,{scheduled_start:round5($event.target.value)||null},strip)">
                        </label>
                        <label>Min/bout
                          <input type="number" min="1" max="60" :value="slot.minutes_per_bout||''"
                            :placeholder="slot.effective_minutes_per_bout||'—'"
                            @change="updateSlot(slot.id,{minutes_per_bout:Number($event.target.value)||null},strip)">
                        </label>
                        <label>Referee
                          <select @change="updateSlot(slot.id,{referee_id:$event.target.value||null},strip)">
                            <option value="">— None —</option>
                            <template x-for="r in referees" :key="r.referee_id">
                              <option :value="r.referee_id"
                                :selected="slot.referee_id==r.referee_id"
                                x-text="r.last_name+', '+r.first_name"></option>
                            </template>
                          </select>
                        </label>
                      </div>
                      <div class="slot-actions">
                        <button @click="moveSlot(slot.id,'up',strip)" style="font-size:.75rem;padding:.2rem .5rem">▲</button>
                        <button @click="moveSlot(slot.id,'down',strip)" style="font-size:.75rem;padding:.2rem .5rem">▼</button>
                        <button @click="deleteSlot(slot.id,strip)" style="font-size:.75rem;padding:.2rem .5rem;color:#922b21">Remove</button>
                      </div>
                    </div>
                  </div>
                </template>

              </div>
            </template>

            <!-- Add slot form -->
            <div class="add-slot-form" x-show="addOpen===strip.id">
              <div style="font-size:.82rem;font-weight:600;margin-bottom:.4rem">Add slot</div>
              <select x-model="addForm.type" style="margin-bottom:.4rem">
                <option value="pool">Pool</option>
                <option value="de_range">DE range</option>
              </select>

              <!-- Pool picker -->
              <template x-if="addForm.type==='pool'">
                <div>
                  <select x-model="addForm.pool_id">
                    <option value="">— Select pool —</option>
                    <template x-for="p in availablePools" :key="p.id">
                      <option :value="p.id"
                        x-text="p.competition_name+' — Pool '+p.pool_number+' ('+p.phase_status+')'"></option>
                    </template>
                  </select>
                </div>
              </template>

              <!-- DE range picker -->
              <template x-if="addForm.type==='de_range'">
                <div>
                  <select x-model="addForm.phase_id" @change="loadDeRounds(addForm.phase_id)" style="margin-bottom:.3rem">
                    <option value="">— Select DE phase —</option>
                    <template x-for="ph in availableDePhases" :key="ph.id">
                      <option :value="ph.id"
                        x-text="ph.competition_name+' — '+ph.phase_label"></option>
                    </template>
                  </select>
                  <template x-if="deRounds.length > 0">
                    <div style="margin-bottom:.3rem">
                      <select @change="selectDeRound($event.target.value)" style="width:100%">
                        <option value="">— Select round —</option>
                        <template x-for="rd in deRounds" :key="rd.de_round">
                          <option :value="rd.de_round" :selected="addForm.de_round===rd.de_round"
                            x-text="'Round '+rd.de_round+' ('+rd.total_bouts+' bouts)'"></option>
                        </template>
                      </select>
                    </div>
                  </template>
                  <template x-if="addForm.de_round">
                    <div class="row" style="align-items:flex-end">
                      <div>
                        <div style="font-size:.75rem;color:#666;margin-bottom:.1rem">From bout</div>
                        <input type="number" x-model.number="addForm.bout_start" min="1">
                      </div>
                      <div>
                        <div style="font-size:.75rem;color:#666;margin-bottom:.1rem">To bout</div>
                        <input type="number" x-model.number="addForm.bout_end" min="1">
                      </div>
                      <div style="font-size:.75rem;color:#888;padding-bottom:.25rem"
                        x-text="'1–'+(deRounds.find(r=>r.de_round===addForm.de_round)?.total_bouts||'?')+' available'">
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <div class="row" style="margin-top:.4rem">
                <input type="time" step="300" x-model="addForm.scheduled_start"
                  @change="addForm.scheduled_start = round5($event.target.value)"
                  placeholder="Start time">
                <input type="number" x-model.number="addForm.minutes_per_bout" placeholder="Min/bout" min="1" max="60">
              </div>
              <div style="display:flex;gap:.4rem;margin-top:.4rem">
                <button class="primary" @click="submitAddSlot(strip)">Add</button>
                <button @click="addOpen=null">Cancel</button>
              </div>
            </div>
            <div style="padding:.4rem .5rem" x-show="addOpen!==strip.id">
              <button @click="openAdd(strip)" style="width:100%;font-size:.8rem">+ Add slot</button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Piste schedule (Gantt) ───────────────────────────────────────────── -->
  <div class="card" x-show="ganttData.hasData">
    <h2 style="margin-top:0">Piste schedule</h2>
    <div style="overflow-x:auto">
      <div style="min-width:500px;display:flex">
        <!-- Label column -->
        <div style="width:110px;flex-shrink:0">
          <div style="height:26px"></div>
          <template x-for="row in ganttData.rows" :key="row.name+'_l'">
            <div style="height:34px;display:flex;align-items:center;border-bottom:1px solid #f0f0f0;font-size:.82rem;font-weight:600;padding-right:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                 x-text="row.name"></div>
          </template>
        </div>
        <!-- Chart area — single position:relative reference for header, gridlines, now-line and bars -->
        <div style="flex:1;position:relative;min-width:0">
          <!-- Hour labels -->
          <div style="height:26px;position:relative;border-bottom:2px solid #ddd">
            <template x-for="tick in ganttData.ticks" :key="'lbl'+tick.left">
              <div x-show="tick.isHour"
                   style="position:absolute;transform:translateX(-50%);bottom:4px;font-size:.72rem;color:#666;white-space:nowrap;pointer-events:none"
                   :style="{ left: tick.left+'%' }" x-text="tick.label"></div>
            </template>
          </div>
          <!-- Vertical gridlines spanning all rows -->
          <template x-for="tick in ganttData.ticks" :key="'grid'+tick.left">
            <div style="position:absolute;top:26px;bottom:0;pointer-events:none"
                 :style="{ left: tick.left+'%', width: tick.isHour ? '1px' : '1px', background: tick.isHour ? '#ddd' : '#f0f0f0' }"></div>
          </template>
          <!-- Now line -->
          <div style="position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;opacity:.7;z-index:2;pointer-events:none"
               :style="{ left: ganttData.nowLeft+'%' }"></div>
          <!-- Rows -->
          <template x-for="row in ganttData.rows" :key="row.name">
            <div style="height:34px;position:relative;border-bottom:1px solid #f0f0f0">
              <template x-for="bar in row.bars" :key="bar.id">
                <div style="position:absolute;top:7px;height:20px;border-radius:3px;overflow:hidden;display:flex;align-items:center;padding:0 5px;font-size:.7rem;color:#fff;white-space:nowrap;box-sizing:border-box;z-index:1"
                     :style="{ left: bar.left+'%', width: bar.width+'%', background: bar.color }"
                     :title="bar.label+(bar.start?' ('+bar.start+' → '+(bar.end||'?')+')':'')">
                  <span x-text="bar.label"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
      <!-- Legend -->
      <div style="display:flex;gap:1rem;margin-top:.6rem;font-size:.75rem;color:#666">
        <span><span style="display:inline-block;width:12px;height:12px;background:#1a6bab;border-radius:2px;vertical-align:middle;margin-right:3px"></span>Pending</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#1e8449;border-radius:2px;vertical-align:middle;margin-right:3px"></span>Active</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#999;border-radius:2px;vertical-align:middle;margin-right:3px"></span>Done</span>
        <span style="margin-left:auto;color:#aaa">Only slots with a scheduled start time are shown.</span>
      </div>
    </div>
  </div>

  <!-- ── Referee schedule ──────────────────────────────────────────────────── -->
  <div class="card" x-show="referees.length">
    <div style="display:flex;align-items:baseline;gap:1rem;margin-bottom:.5rem">
      <h2 style="margin:0">Referee schedule</h2>
      <select x-model="selectedReferee" @change="loadRefereeSchedule()">
        <option value="">— Select referee —</option>
        <template x-for="r in referees" :key="r.referee_id">
          <option :value="r.referee_id" x-text="r.last_name+', '+r.first_name"></option>
        </template>
      </select>
    </div>
    <template x-if="refSchedule.length">
      <table class="ref-table">
        <thead><tr><th>Strip</th><th>Assignment</th><th>Start</th><th>End (predicted)</th><th>Status</th></tr></thead>
        <tbody>
          <template x-for="s in refSchedule" :key="s.id">
            <tr>
              <td x-text="s.strip_name||('Piste '+s.strip_number)"></td>
              <td x-text="slotLabel(s)"></td>
              <td x-text="s.scheduled_start||'—'"></td>
              <td x-text="s.predicted_end||'—'"></td>
              <td><span class="badge" :class="'badge-'+s.status" x-text="s.status"></span></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
    <div x-show="selectedReferee && !refSchedule.length" style="color:#888;font-size:.9rem">No slots assigned to this referee.</div>
  </div>
</main>

<script>
function app() {
  return {
    notice: { text: '', error: false },
    status: { connected: false, brokerUrl: '', pistes: [] },
    strips: [],
    expandedSlots: new Set(),
    _tick: 0,
    hideOffline: false,
    referees: [],
    availablePools: [],
    availableDePhases: [],
    deRounds: [],
    addOpen: null,
    addForm: {},
    selectedReferee: '',
    refSchedule: [],

    async init() {
      await Promise.all([
        this.loadStatus(),
        this.loadStrips(),
        this.loadReferees(),
        this.loadAvailablePhases(),
      ]);
      setInterval(() => this.loadStatus(), 5000);
      setInterval(() => this._tick++, 60000);
    },

    async loadStatus() {
      const s = await fetch('/api/opp2/status').then(r => r.json()).catch(() => ({ connected: false, pistes: [] }));
      this.status = s;
    },

    async loadStrips() {
      const data = await fetch('/api/opp2/pipeline').then(r => r.json()).catch(() => []);
      this.strips = data;
    },

    async loadReferees() {
      const people = await fetch('/api/people?role=referee').then(r => r.json()).catch(() => []);
      this.referees = people;
    },

    async loadAvailablePhases() {
      // Load all pools and DE phases for the add-slot pickers.
      // We use the competitions API to enumerate all active phases.
      const comps = await fetch('/api/competitions').then(r => r.json()).catch(() => []);
      const pools = [], dePhases = [];
      for (const c of comps) {
        const phases = await fetch(`/api/competitions/${c.id}/phases`).then(r => r.json()).catch(() => []);
        for (const ph of phases) {
          if (ph.type === 'pool') {
            const phPools = await fetch(`/api/phases/${ph.id}/pools`).then(r => r.json()).catch(() => []);
            for (const p of phPools) {
              pools.push({ ...p, competition_name: c.name, phase_status: ph.status });
            }
          } else if (ph.type === 'de') {
            dePhases.push({ ...ph, competition_name: c.name,
              phase_label: `DE Phase ${ph.phase_order} (${ph.status})` });
          }
        }
      }
      const plannedPoolIds = new Set(
        this.strips.flatMap(s => s.slots).filter(s => s.pool_id).map(s => s.pool_id)
      );
      this.availablePools    = pools.filter(p => !plannedPoolIds.has(p.id));
      this.availableDePhases = dePhases;
    },

    liveState(stripName) {
      return this.status.pistes?.find(p => p.pisteId === stripName) || null;
    },

    round5(time) {
      if (!time) return time;
      const [h, m] = time.split(':').map(Number);
      const r = Math.round(m / 5) * 5;
      const hh = r === 60 ? h + 1 : h;
      const mm = r === 60 ? 0 : r;
      return `${String(hh % 24).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    },

    isOffline(strip) {
      const s = this.liveState(strip.name);
      return s !== null && !s.apparatusOnline;
    },

    showSlot(slot, idx, slots) {
      if (slot.status !== 'done') return true;
      const lastDoneIdx = slots.reduce((last, s, i) => s.status === 'done' ? i : last, -1);
      return idx === lastDoneIdx;
    },

    get ganttData() {
      void this._tick; // reactive dependency for "now" line updates
      const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      const fmtMin = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
      const colorOf = s => s.status === 'done' ? '#999' : s.status === 'active' ? '#1e8449' : '#1a6bab';

      const scheduled = this.strips.flatMap(strip =>
        strip.slots.filter(s => s.scheduled_start).map(s => ({ strip, slot: s }))
      );
      if (!scheduled.length) return { hasData: false, rows: [], ticks: [], nowLeft: null };

      const starts = scheduled.map(({ slot: s }) => toMin(s.scheduled_start));
      const ends   = scheduled.filter(({ slot: s }) => s.predicted_end).map(({ slot: s }) => toMin(s.predicted_end));
      const axisStart = Math.floor(Math.min(...starts) / 30) * 30;
      const axisEnd   = Math.ceil((ends.length ? Math.max(...ends) : Math.max(...starts) + 60) / 30) * 30;
      const total = axisEnd - axisStart;

      const ticks = [];
      for (let t = axisStart; t <= axisEnd; t += 30)
        ticks.push({ label: fmtMin(t), left: (t - axisStart) / total * 100, isHour: t % 60 === 0 });

      const rows = this.strips
        .filter(strip => strip.slots.some(s => s.scheduled_start))
        .map(strip => ({
          name: strip.name || ('Piste ' + strip.strip_number),
          bars: strip.slots.filter(s => s.scheduled_start).map(s => {
            const s0 = toMin(s.scheduled_start);
            const s1 = s.predicted_end ? toMin(s.predicted_end) : s0 + 30;
            return {
              id:    s.id,
              left:  (s0 - axisStart) / total * 100,
              width: Math.max((s1 - s0) / total * 100, 0.5),
              color: colorOf(s),
              label: this.slotLabel(s),
              start: s.scheduled_start,
              end:   s.predicted_end,
            };
          }),
        }));

      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const nowLeft = Math.max(0, Math.min(100, (nowMin - axisStart) / total * 100));

      return { hasData: true, rows, ticks, nowLeft };
    },

    slotLabel(slot) {
      if (slot.type === 'pool')
        return `${slot.competition_name || '?'} — Pool ${slot.pool_number || '?'}`;
      if (slot.type === 'de_range')
        return `${slot.competition_name || '?'} — DE R${slot.de_round} #${slot.bout_start||1}–${slot.bout_end||'end'}`;
      return slot.type;
    },

    hasOverlap(prev, curr) {
      if (!prev?.predicted_end || !curr?.scheduled_start) return false;
      return curr.scheduled_start < prev.predicted_end;
    },

    openAdd(strip) {
      this.addOpen  = strip.id;
      this.deRounds = [];
      const latest = strip.slots
        .filter(s => s.predicted_end)
        .reduce((best, s) => (!best || s.predicted_end > best) ? s.predicted_end : best, null);
      let suggested = '';
      if (latest) {
        const [h, m] = latest.split(':').map(Number);
        const t = h * 60 + m + 5;
        suggested = this.round5(`${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);
      }
      this.addForm  = { type: 'pool', pool_id: '', phase_id: '',
                        de_round: '', bout_start: '', bout_end: '',
                        scheduled_start: suggested, minutes_per_bout: '' };
    },

    async loadDeRounds(phaseId) {
      this.deRounds = [];
      this.addForm.de_round  = '';
      this.addForm.bout_start = '';
      this.addForm.bout_end   = '';
      if (!phaseId) return;
      const bouts = await fetch('/api/bouts?phase_id=' + phaseId).then(r => r.json()).catch(() => []);
      const map = {};
      for (const b of bouts) {
        if (b.de_round == null) continue;
        map[b.de_round] = (map[b.de_round] || 0) + 1;
      }
      this.deRounds = Object.entries(map)
        .map(([r, n]) => ({ de_round: Number(r), total_bouts: n }))
        .sort((a, b) => a.de_round - b.de_round);
    },

    selectDeRound(val) {
      const deRound = Number(val);
      this.addForm.de_round = deRound;
      const rd = this.deRounds.find(r => r.de_round === deRound);
      if (rd) { this.addForm.bout_start = 1; this.addForm.bout_end = rd.total_bouts; }
    },

    async submitAddSlot(strip) {
      const body = {
        type:             this.addForm.type,
        pool_id:          this.addForm.type === 'pool'     ? (this.addForm.pool_id  || null) : null,
        phase_id:         this.addForm.type === 'de_range' ? (this.addForm.phase_id || null) : null,
        de_round:         this.addForm.type === 'de_range' ? (this.addForm.de_round || null) : null,
        bout_start:       this.addForm.type === 'de_range' ? (this.addForm.bout_start || null) : null,
        bout_end:         this.addForm.type === 'de_range' ? (this.addForm.bout_end   || null) : null,
        scheduled_start:  this.addForm.scheduled_start  || null,
        minutes_per_bout: this.addForm.minutes_per_bout || null,
      };
      const r = await fetch(`/api/opp2/pipeline/strip/${strip.id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const d = await r.json(); this.showNotice(d.error||'Add failed',true); return; }
      this.addOpen = null;
      await this.loadStrips();
    },

    async updateSlot(id, fields, strip) {
      const r = await fetch(`/api/opp2/pipeline/slots/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fields),
      });
      if (!r.ok) { const d = await r.json().catch(() => ({})); this.showNotice(d.error || 'Update failed', true); return; }
      await this.loadStrips();
    },

    async moveSlot(id, direction, strip) {
      const r = await fetch(`/api/opp2/pipeline/slots/${id}/reorder`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction }),
      });
      if (!r.ok) { const d = await r.json().catch(() => ({})); this.showNotice(d.error || 'Move failed', true); return; }
      await this.loadStrips();
    },

    async deleteSlot(id, strip) {
      if (!confirm('Remove this slot from the pipeline?')) return;
      const r = await fetch(`/api/opp2/pipeline/slots/${id}`, { method: 'DELETE' });
      if (!r.ok) { const d = await r.json().catch(() => ({})); this.showNotice(d.error || 'Delete failed', true); return; }
      await this.loadStrips();
    },

    async loadRefereeSchedule() {
      if (!this.selectedReferee) { this.refSchedule = []; return; }
      this.refSchedule = await fetch(`/api/opp2/pipeline/referee/${this.selectedReferee}`)
        .then(r => r.json()).catch(() => []);
    },

    showNotice(text, error = false) {
      this.notice = { text, error };
      setTimeout(() => { this.notice = { text: '', error: false }; }, 4000);
    },
  };
}
</script>
<script src="/js/nav.js"></script>
