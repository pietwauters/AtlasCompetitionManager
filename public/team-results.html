<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — Team Results</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{font-family:sans-serif;margin:0;background:#f0f2f5;color:#222}
  main{max-width:760px;margin:0 auto;padding:1rem}
  .card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:1.25rem;margin-bottom:1rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{text-align:left;padding:.5rem .75rem;background:#f0f2f5;border-bottom:2px solid #ddd}
  td{padding:.55rem .75rem;border-bottom:1px solid #eee;vertical-align:top}
  tr:hover td{background:#f9f9f9}
  .place{font-weight:700;font-size:1.05rem;min-width:3rem;display:inline-block}
  .place-1{color:#c9a000}
  .place-2{color:#777}
  .place-3{color:#b87333}
  .members{font-size:.82rem;color:#555;margin-top:.2rem}
  .badge-reserve{display:inline-block;padding:.05rem .35rem;border-radius:8px;font-size:.72rem;background:#fef3cd;color:#856404;margin-left:.25rem}
</style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <nav class="nav-bar">
    <a class="nav-brand" href="/">Atlas</a>
    <span class="nav-sep">|</span>
    <span class="nav-item" x-text="comp?.name||'Team Results'"></span>
    <div class="nav-right">
      <span class="nav-user" x-text="user?.username||''"></span>
      <a class="nav-item" href="#" @click.prevent="logout()">Logout</a>
    </div>
  </nav>
</header>
<main>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <h2 style="margin:0" x-text="(comp?.name||'Competition')+' — Final Results'"></h2>
      <a :href="'/competition-detail.html?id='+compId" style="font-size:.85rem;color:#888">← Back to competition</a>
    </div>
    <div style="margin-top:.3rem;font-size:.85rem;color:#666"
         x-text="({foil:'Foil',epee:'Épée',sabre:'Sabre'}[comp?.weapon]||'') + ' · ' + ({M:'Men',F:'Women',X:'Mixed'}[comp?.gender]||'') + ' · Teams'">
    </div>
  </div>

  <div class="card" x-show="results.length===0" style="color:#999">
    No results available yet. Close the team DE phase to record final rankings.
  </div>

  <div class="card" x-show="results.length>0">
    <table>
      <thead>
        <tr>
          <th style="width:4rem">Place</th>
          <th>Team</th>
          <th>Members</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="t in results" :key="t.id">
          <tr>
            <td>
              <span class="place"
                    :class="t.final_rank===1?'place-1':t.final_rank===2?'place-2':t.final_rank===3?'place-3':''"
                    x-text="t.final_rank"></span>
            </td>
            <td>
              <strong x-text="t.name"></strong>
              <span x-show="t.club_name" style="font-size:.83rem;color:#888" x-text="' — '+t.club_name"></span>
            </td>
            <td>
              <div class="members" x-text="memberList(t)"></div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>
<script>
function app() {
  const compId = new URLSearchParams(window.location.search).get('id');
  return {
    compId, comp: null, results: [],

    async init() {
      if (!compId) return;
      [this.comp, this.results] = await Promise.all([
        fetch('/api/competitions/'+compId).then(r=>r.json()),
        fetch('/api/competitions/'+compId+'/teams/results').then(r=>r.json()).catch(()=>[]),
      ]);
      document.title = 'Atlas — '+(this.comp?.name||'')+' Results';
    },

    memberList(team) {
      return team.members.map(m =>
        m.last_name+', '+m.first_name+(m.role==='reserve'?' (R)':'')
      ).join(' · ');
    },
  };
}
</script>
<script src="/js/nav.js"></script>
</body>
</html>
