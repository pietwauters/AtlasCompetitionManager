<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — Team DE</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme-init.js"></script>
<style>
  main{max-width:1000px;margin:0 auto;padding:1rem}
  .back{font-size:.85rem;color:#555;text-decoration:none;display:inline-block;margin-bottom:.75rem}
  .back:hover{color:#333}
  .notice{padding:.6rem 1rem;border-radius:5px;margin-bottom:.75rem;font-size:.9rem}
  .notice.ok{background:#d1e7dd;color:#0f5132}
  .notice.err{background:#f8d7da;color:#842029}

  /* Tableau grid */
  .tableau{display:flex;gap:1.5rem;overflow-x:auto;padding-bottom:.5rem}
  .round-col{display:flex;flex-direction:column;gap:.75rem;min-width:200px}
  .round-title{font-size:.8rem;font-weight:700;text-transform:uppercase;color:#888;margin-bottom:.25rem;text-align:center}
  .match-card{background:#fff;border:1px solid #dde;border-radius:6px;padding:.6rem .75rem;cursor:pointer;transition:box-shadow .15s}
  .match-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .match-card.bye-card{opacity:.5;cursor:default}
  .match-card .team-row{display:flex;align-items:center;gap:.4rem;padding:.2rem 0;font-size:.9rem}
  .match-card .team-row.winner{font-weight:700}
  .match-card .team-row .score{margin-left:auto;font-weight:700;min-width:1.5rem;text-align:right}
  .match-card .team-row .seed-badge{font-size:.72rem;color:#888;min-width:1.2rem}
  .match-card .meta{font-size:.75rem;color:#999;margin-top:.3rem;display:flex;gap:.5rem;align-items:center}
  .spacer{flex:1}
</style>
</head>
<body x-data="app()" x-init="init()">
<header x-data="navApp()" x-init="initNav()">
  <a href="/index.html"><strong>Atlas</strong></a>
  <template x-for="comp in activeComps" :key="comp.id">
    <a :href="phaseLink(comp)" x-text="compLabel(comp)"
       class="nav-comp-link"></a>
  </template>
  <div class="nav-right">
    <a href="/tournaments.html">Events</a>
    <a href="/strips.html">Strips</a>
    <a href="/opp2.html">Schedule</a>
    <a href="/referee-schedule.html">Referees</a>
    <a href="/people.html">People</a>
    <a href="/clubs.html">Clubs</a>
    <a href="/admin.html">Admin</a>
  </div>
</header>
<main>
  <div style="display:flex;gap:1rem;align-items:center;margin-bottom:.75rem">
    <a class="back" style="margin-bottom:0" :href="'/competition-detail.html?id='+compId">← Back to competition</a>
    <a :href="'/team-results.html?id='+compId" style="font-size:.85rem;color:#1a6bab">📋 Results</a>
  </div>

  <div x-show="notice.text" :class="'notice '+(notice.error?'err':'ok')" x-text="notice.text"></div>

  <div class="card" x-show="phase">
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.5rem">
      <h1 x-text="'Team DE — '+(phase?.competition_name||'')"></h1>
      <span class="chip" :class="'chip-'+(phase?.status||'pending')" x-text="phase?.status||''"></span>
      <div class="spacer"></div>
      <button x-show="phase?.status!=='finished'&&phase?.matches_total>0&&phase?.matches_complete>=phase?.matches_total"
              class="success" @click="closePhase()">Close phase</button>
      <button x-show="phase?.status!=='finished'" @click="simulatePhase()">Simulate all</button>
    </div>
    <div style="font-size:.85rem;color:#666" x-show="phase?.status==='active'"
         x-text="(phase?.matches_complete||0)+' / '+(phase?.matches_total||0)+' matches complete'"></div>
  </div>

  <!-- Tableau -->
  <div class="card" x-show="rounds.length">
    <h2>Tableau</h2>
    <div class="tableau">
      <template x-for="(round, ri) in rounds" :key="ri">
        <div class="round-col">
          <div class="round-title" x-text="round.label"></div>
          <template x-for="m in round.matches" :key="m.id">
            <div :class="'match-card'+(m.status==='finished'&&!m.left_team_id&&!m.right_team_id?' bye-card':'')"
                 @click="m.left_team_id&&m.right_team_id&&m.status!=='finished'?goMatch(m.id):null">
              <div class="team-row" :class="m.winner_team_id&&m.winner_team_id===m.left_team_id?'winner':''">
                <span class="seed-badge" x-text="m.left_seed?'#'+m.left_seed:''"></span>
                <span x-text="m.left_team_name||'TBD'"></span>
                <span class="score" x-show="m.status==='finished'" x-text="m.left_score??''"></span>
              </div>
              <div class="team-row" :class="m.winner_team_id&&m.winner_team_id===m.right_team_id?'winner':''">
                <span class="seed-badge" x-text="m.right_seed?'#'+m.right_seed:''"></span>
                <span x-text="m.right_team_name||'TBD'"></span>
                <span class="score" x-show="m.status==='finished'" x-text="m.right_score??''"></span>
              </div>
              <div class="meta">
                <span class="chip" :class="'chip-'+m.status" x-text="m.status"></span>
                <a :href="'/team-match.html?match='+m.id" @click.stop style="font-size:.75rem;color:#0d6efd"
                   x-show="m.left_team_id&&m.right_team_id">Open →</a>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- Bronze bout -->
  <div class="card" x-show="bronze">
    <h2>3rd Place bout</h2>
    <div class="match-card" style="max-width:280px"
         @click="bronze&&bronze.left_team_id&&bronze.right_team_id?goMatch(bronze.id):null">
      <div class="team-row" :class="bronze?.winner_team_id&&bronze?.winner_team_id===bronze?.left_team_id?'winner':''">
        <span class="seed-badge" x-text="bronze?.left_seed?'#'+bronze.left_seed:''"></span>
        <span x-text="bronze?.left_team_name||'TBD'"></span>
        <span class="score" x-show="bronze?.status==='finished'" x-text="bronze?.left_score??''"></span>
      </div>
      <div class="team-row" :class="bronze?.winner_team_id&&bronze?.winner_team_id===bronze?.right_team_id?'winner':''">
        <span class="seed-badge" x-text="bronze?.right_seed?'#'+bronze.right_seed:''"></span>
        <span x-text="bronze?.right_team_name||'TBD'"></span>
        <span class="score" x-show="bronze?.status==='finished'" x-text="bronze?.right_score??''"></span>
      </div>
      <div class="meta">
        <span class="chip" :class="'chip-'+(bronze?.status||'pending')" x-text="bronze?.status||''"></span>
        <a :href="'/team-match.html?match='+bronze?.id" @click.stop style="font-size:.75rem;color:#0d6efd"
           x-show="bronze?.left_team_id&&bronze?.right_team_id">Open →</a>
      </div>
    </div>
  </div>

  <!-- Final results (after close) -->
  <div class="card" x-show="phase?.status==='finished'&&rankedTeams.length">
    <h2>Results</h2>
    <table>
      <thead><tr>
        <th>Rank</th>
        <th>Team</th>
      </tr></thead>
      <tbody>
        <template x-for="t in rankedTeams" :key="t.id">
          <tr style="border-bottom:1px solid #f0f0f0">
            <td style="padding:.35rem .5rem;font-weight:700" x-text="t.final_rank"></td>
            <td style="padding:.35rem .5rem" x-text="t.name"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>

<script>
function app() {
  const params  = new URLSearchParams(window.location.search);
  const phaseId = params.get('phase');
  const compId  = params.get('comp');
  return {
    phaseId, compId, phase: null, rounds: [], bronze: null, rankedTeams: [],
    notice: { text:'', error:false },

    async init() {
      if (!phaseId) { this.showNotice('No phase ID in URL', true); return; }
      await this.loadPhase();
    },

    async loadPhase() {
      const r = await fetch('/api/team-phases/'+phaseId);
      if (!r.ok) { this.showNotice('Phase not found', true); return; }
      const ph = await r.json();
      const cid = compId || ph.competition_id;
      // Augment with competition name
      const cr = await fetch('/api/competitions/'+cid);
      if (cr.ok) { const c = await cr.json(); ph.competition_name = c.name; }
      this.phase = ph;

      // Fetch teams for seed lookup
      const tr = await fetch('/api/competitions/'+cid+'/teams');
      const teams = tr.ok ? await tr.json() : [];
      const seedMap = Object.fromEntries(teams.map(t=>[t.id, t.seed]));

      // Annotate matches with seed
      const matches = (ph.matches || []).map(m => ({
        ...m,
        left_seed:  seedMap[m.left_team_id]  || null,
        right_seed: seedMap[m.right_team_id] || null,
      }));

      // Split into rounds (de_round != null) and bronze (place_rank=3)
      const deMatches = matches.filter(m => m.de_round != null);
      const bMatch    = matches.find(m => m.place_rank === 3);
      this.bronze = bMatch || null;

      // Group by de_round
      const maxRound = deMatches.reduce((m,x)=>Math.max(m,x.de_round),0);
      const rounds = [];
      for (let r = 1; r <= maxRound; r++) {
        const ms = deMatches.filter(m=>m.de_round===r).sort((a,b)=>a.tableau_position-b.tableau_position);
        rounds.push({
          label: r === maxRound ? 'Final' : r === maxRound-1 ? 'Semi-final' : 'Round of '+ms.length*2,
          matches: ms,
        });
      }
      this.rounds = rounds;

      this.rankedTeams = teams.filter(t=>t.final_rank!=null).sort((a,b)=>a.final_rank-b.final_rank);
    },

    async closePhase() {
      if (!confirm('Close this phase and record final rankings?')) return;
      const r = await fetch('/api/team-phases/'+phaseId+'/close', {method:'POST'});
      const d = await r.json();
      if (!r.ok) { this.showNotice(d.error||'Close failed', true); return; }
      this.showNotice('Phase closed');
      await this.loadPhase();
    },

    async simulatePhase() {
      const r = await fetch('/api/team-phases/'+phaseId+'/simulate', {method:'POST'});
      const d = await r.json();
      if (!r.ok) { this.showNotice(d.error||'Simulate failed', true); return; }
      this.showNotice('Simulation complete');
      await this.loadPhase();
    },

    goMatch(id) { window.location.href = '/team-match.html?match='+id+'&phase='+phaseId+'&comp='+(compId||''); },

    showNotice(text, error=false) {
      this.notice = { text, error };
      setTimeout(()=>{ this.notice = {text:'',error:false}; }, 4000);
    },
  };
}
</script>
<script src="/js/nav.js"></script>
</body>
</html>
